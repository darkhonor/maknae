schema_version: 1
permissions:
  allow:
    - "Read(~/**)"
    - "Write(~/projects/**)"
  deny:
    - "Read(~/.ssh/**)"
    - "Read(~/.gnupg/**)"
    - "Read(~/.aws/**)"
    - "Read(~/.vault-token)"
    - "Read(~/.netrc)"
    - "Read(~/.git-credentials)"
    - "Read(~/.kube/**)"
    - "Read(~/.docker/config.json)"
    - "Read(~/.maknae/**)"
    - "Write(~/.ssh/**)"
    - "Write(~/.gnupg/**)"
    - "Write(~/.aws/**)"
    - "Write(~/.vault-token)"
    - "Write(~/.netrc)"
    - "Write(~/.git-credentials)"
    - "Write(~/.kube/**)"
    - "Write(~/.docker/config.json)"
    - "Write(~/.maknae/**)"

# The administrative terms the enrolled administrator (`admin`) holds on a fresh
# install: the basic operation of a single-user host (#490). Edit the list to
# grant fewer or more; `admin.config.show` is grantable the same way.
roles:
  admin:
    allow:
      - "admin.status"
      - "admin.subject.list"
      - "admin.baseline.show"
      - "admin.baseline.accept"
