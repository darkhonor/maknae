schema_version: 1
permissions:
  allow:
    - "Read(~/**)"
    - "Write(~/projects/**)"
  # The credential and system paths no role may reach are in sensitive.yaml.
  deny: []

# Per-account limits (#608, ADR-0032). An entry's actions and models only narrow
# what the account's role holds. Its permissions allow replaces the allow list
# above for that account and may reach paths that list does not cover; the deny
# list above and sensitive.yaml always apply. Uncomment and edit to use:
#
# subjects:
#   notes-agent:
#     permissions:
#       allow:
#         - "Read(~/notes/**)"
#         - "Write(~/notes/**)"
#     actions:
#       allow:
#         - "fs.*"
#         - "session.*"
#       deny:
#         - "fs.delete"
#     models:
#       allow:
#         - "local/llama"

# The terms each role holds on a fresh install: basic operation of a single-user host
# for `admin` (#490), and for both roles the conversation terms (#170), `session.task`
# (#609), which tasks an enrolled agent, `tool.catalog` (#674), which fetches a
# reference list of tools, `board.post` and `board.read` (#695), which post to and
# read the board of a task's tasker, and `board.manage` (#698), which reads and sets a
# person's own board settings and clears their own board; each call is still decided on
# its own. Edit the lists to grant fewer or more; `admin.config.show` and `admin.contain`
# are grantable too.
roles:
  admin:
    allow:
      - "admin.status"
      - "admin.subject.list"
      - "admin.baseline.show"
      - "admin.baseline.accept"
      - "admin.release"
      - "session.prompt"
      - "session.new"
      - "session.close"
      - "session.list"
      - "session.delete"
      - "session.task"
      - "tool.catalog"
      - "board.post"
      - "board.read"
      - "board.manage"
  user:
    allow:
      - "session.prompt"
      - "session.new"
      - "session.close"
      - "session.list"
      - "session.delete"
      - "session.task"
      - "tool.catalog"
      - "board.post"
      - "board.read"
      - "board.manage"

# A role may also hold Tool(...) grants (#674): its allow joins the allow list in force
# for each person bound to the role (the one above, or the person's own under subjects:),
# and its deny joins the deny lists. Agents never inherit them. Only Tool(...) entries
# are accepted here. To use, add a permissions: key to the role's entry above:
#
#   user:
#     permissions:
#       allow:
#         - "Tool(github-read gh:pr.*)"
#       deny:
#         - "Tool(github-read gh:pr.checks)"
