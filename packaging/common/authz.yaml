schema_version: 1
permissions:
  allow:
    - "Read(~/**)"
    - "Write(~/projects/**)"
  deny:
    - "Read(~/.ssh/**)"
    - "Read(~/.gnupg/**)"
    - "Read(~/.aws/**)"
    - "Read(~/.vault-token)"
    - "Read(~/.netrc)"
    - "Read(~/.git-credentials)"
    - "Read(~/.kube/**)"
    - "Read(~/.docker/config.json)"
    - "Read(~/.maknae/**)"
    - "Write(~/.ssh/**)"
    - "Write(~/.gnupg/**)"
    - "Write(~/.aws/**)"
    - "Write(~/.vault-token)"
    - "Write(~/.netrc)"
    - "Write(~/.git-credentials)"
    - "Write(~/.kube/**)"
    - "Write(~/.docker/config.json)"
    - "Write(~/.maknae/**)"

# Per-account limits (#608, ADR-0032). An entry's actions and models only narrow
# what the account's role holds. Its permissions allow replaces the allow list
# above for that account and may reach paths that list does not cover; the deny
# list above always applies. Uncomment and edit to use:
#
# subjects:
#   notes-agent:
#     permissions:
#       allow:
#         - "Read(~/notes/**)"
#         - "Write(~/notes/**)"
#     actions:
#       allow:
#         - "fs.*"
#         - "session.*"
#       deny:
#         - "fs.delete"
#     models:
#       allow:
#         - "local/llama"

# The terms each role holds on a fresh install (#490, #609); `session.task` tasks an
# enrolled agent and is refused until task delivery is built. Edit the lists to grant
# fewer or more; `admin.config.show`, `admin.contain` and `session.prompt` are grantable too.
roles:
  admin:
    allow:
      - "admin.status"
      - "admin.subject.list"
      - "admin.baseline.show"
      - "admin.baseline.accept"
      - "admin.release"
      - "session.task"
  user:
    allow:
      - "session.task"
