# Pinned toolchain (#201). Why THIS version, so the next person inherits reasoning
# and not a number (AGENTS.md: an undocumented pin is an unreviewed control):
#
# 1. 1.98.0 made the UNSAFE_CODE lint "consistently emitted for all unsafe
#    attributes". Every workspace member but maknae-sys forbids unsafe_code, and
#    confining unsafe to that one crate is a headline property (ADR-0002,
#    ADR-0027); before 1.98 the forbid could miss an unsafe attribute. This is
#    the entry that is ours.
# 2. 1.97.1 is a one-line release: "Fix miscompilation in LLVM optimization".
#    For a deny-by-default, fail-closed product a miscompiling compiler sits
#    below every gate, test and review. 1.94.1 predated the fix.
# 3. 1.99.1 (2026-10-15). The Rust project ships fixes only for the current
#    stable, so 1.98.x gets no further point releases. 1.99.1 is the point
#    release that fixes 1.99.0's x86_64 FFI `bool` return miscompile (rust-lang/rust#163911);
#    1.99.0 itself is not acceptable here.
#
# The failure this pin prevents: an unsafe attribute compiling under a forbid
# that did not see it. Bump deliberately, with the reason written here.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy", "llvm-tools"]
