[package]
name = "maknae-authz-basic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The bundled RBAC decision backend behind the maknae-security seam"
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
maknae-security = { path = "../maknae-security" }
maknae-config = { path = "../maknae-config" }
maknae-graph = { path = "../maknae-graph" }

[target.'cfg(unix)'.dependencies]
# getpwnam at policy load ONLY (boot and reload) — zero per-request NSS (spec §3:
# a per-request lookup would reintroduce the SSSD/LDAP worker-stall class the
# kernel bounds with spawn_blocking+timeout; resolution happens per load, over
# names root wrote into the policy file).
nix = { version = "0.31", default-features = false, features = ["user"] }

[features]
# Test-only door over the production decide sequence (#77): exports
# HermeticAuthorizer, whose loader is requirement-parameterized. Non-default;
# production resolution is pinned featureless by ci/gates/feature-resolution-pin.sh.
hermetic-test-seam = ["maknae-config/hermetic-test-seam"]

[dev-dependencies]
maknae-config = { path = "../maknae-config", features = ["hermetic-test-seam"] }
maknae-io = { path = "../maknae-io" }
