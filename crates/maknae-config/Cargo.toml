[package]
name = "maknae-config"
publish.workspace = true
description = "Configuration loading, custody checks, and disclosure rules for the Maknae trust plane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
yaml-rust2 = "=0.13.0"
# float_roundtrip: the default parse can miss a long decimal by one ulp, so a
# persisted baseline float would no longer re-encode to its own text and be refused.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The classification seam (ADR-0022): `Ceiling.classification` is a `Level` in a
# declared system, validated through a `ClassificationPolicy`. The US system
# itself (`BasicPolicy`) lives HERE because it is the config's default
# vocabulary; the seam is policy-agnostic and depends on nothing of ours.
maknae-security = { path = "../maknae-security" }

[target.'cfg(unix)'.dependencies]
maknae-io = { path = "../maknae-io" }

[features]
# Exports load_authz_with_requirement for hermetic tests ONLY (spec #85 §6a.4).
# Never enabled by a production consumer; the gate pins maknaed's normal-dep
# feature resolution. Default stays empty: nothing outside maknae-config can
# choose a weaker artifact requirement in a production build.
hermetic-test-seam = []
