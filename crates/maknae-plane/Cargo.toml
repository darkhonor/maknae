[package]
name = "maknae-plane"
publish.workspace = true
description = "The local client-plane transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# NOT optional: Cargo does not apply [workspace.lints] to a member that omits this,
# and the workspace sets `unsafe_code = "forbid"`. This crate sits in the client-plane
# read path; omitting this would exempt it from the project's headline memory-safety
# control, and ci/gates/unsafe-confinement.sh fails the build if it does (ADR-0027).
[lints]
workspace = true

# The whole crate is cfg(unix): a Unix-domain socket is its subject matter.
[target.'cfg(unix)'.dependencies]
# The security-relevant half of descriptor delegation lives in maknae-io, per AGENTS.md
# ("file and directory I/O goes through maknae-io"): the recvmsg itself, CMSG_CLOEXEC,
# the per-message descriptor bound, and the checks a received descriptor must satisfy.
# This crate contributes NO security decision — only the async plumbing that calls it.
maknae-io = { path = "../maknae-io" }
# net      — tokio::net::UnixStream, the stream being adapted.
# io-util  — the AsyncRead/ReadBuf machinery the adapter implements.
# Deliberately NOT "rt"/"macros"/"time": this crate spawns nothing and sleeps on
# nothing; a runtime dependency here would be surface with no caller.
tokio = { version = "1", default-features = false, features = ["net", "io-util"] }

[target.'cfg(unix)'.dev-dependencies]
# TEST-ONLY. The end-to-end proof has to SEND ancillary data, and rustix is the only
# safe SCM_RIGHTS API in the tree (maknae-io's production pin records why nix cannot
# serve: its ScmRights yields bare RawFds and every conversion is `unsafe`, which is
# forbidden workspace-wide). Production code here never touches rustix.
# Fixtures CREATE the objects they delegate rather than borrowing a system file:
# `/etc/hostname` does not exist on macOS, which the darwin-native job caught.
tempfile = "3"
# EXACT PIN, matching maknae-io's: rustix holds the `unsafe` ancillary-data parsing
# the delegated-descriptor and sender-credential tests exercise, so `cargo update`
# must not move it apart from maknae-io's without a reviewed bump. 1.1.6 is the
# floor: 1.1.5 does not compile with "net" alone (bytecodealliance/rustix#1681).
# "process" is for the test-only `rustix::process::getuid()` in fd.rs's
# sender-credential tests.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "net", "process"] }
tokio = { version = "1", default-features = false, features = ["net", "io-util", "rt", "macros"] }
