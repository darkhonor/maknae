[package]
name = "maknae-vault"
publish.workspace = true
description = "Non-privileged Vault client for plane certificates and secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
maknae-config = { path = "../maknae-config" }

# vaultrs 0.8.0 (reqwest 0.13, rustify 0.7). `rustls-no-provider`, NOT `rustls`: from
# reqwest 0.13 the `rustls` feature installs the non-FIPS aws-lc-rs provider as the
# process default, which would silently pull aws-lc-sys into the TLS path and race
# the FIPS provider this crate installs (§6.1). `rustls-no-provider` leaves provider
# selection to the process, i.e. to the `.fips()`-asserted install. Same choice as
# Microkosmos. The failure this prevents: a Vault-HTTPS leg on a non-validated module
# with every test still green. vaultrs and rustify move TOGETHER (0.7.4 needs rustify
# 0.6, 0.8.0 needs 0.7); Dependabot #254 and #255 each bumped one and failed to build.
vaultrs = { version = "=0.8.0", default-features = false, features = ["rustls-no-provider"] }
rustify = { version = "=0.7.0", default-features = false }        # direct dep only for the hand-rolled issuer/default/json Endpoint; already transitive via vaultrs, pinned to the resolved Cargo.lock version and moved in lockstep with vaultrs; no features of our own
rustify_derive = "=0.5.5"                                          # the #[derive(Endpoint)] macro used by the endpoint above; already transitive via vaultrs, pinned to the resolved Cargo.lock version
# UPPER BOUND IS THE SAME COMPLIANCE CONTROL AS THE aws-lc-rs BOUND BELOW,
# REACHED FROM THE OTHER SIDE — see that comment for the module-line facts;
# they are not restated here so there is one place to correct. rcgen 0.14.10
# raises its OWN aws-lc-rs requirement to ^1.18, which is precisely the range
# that bound excludes. The two are unsatisfiable together, so 0.14.10 does not
# resolve at all. MEASURED, not assumed — with the ceiling widened to <0.15,
# `cargo update -p rcgen --precise 0.14.10` fails:
#
#   error: failed to select a version for `aws-lc-rs`.
#       ... required by package `rcgen v0.14.10`
#   versions that meet the requirements `^1.18` are: 1.18.1, 1.18.0
#   all possible versions conflict with previously selected packages
#     previously selected package `aws-lc-rs v1.17.3`
#
# So cargo already fails closed; the bound exists to say WHY in the manifest
# instead of leaving the next reader to reverse-engineer a resolver error, and
# the dependabot.yml ignore rule mirrors it (Dependabot does not honor an upper
# bound — it proposes widening one). Lift it only WITH the aws-lc-rs bound; the
# watch is #259.
#
# 0.13 -> 0.14 was an API break, not a routine bump: `CertificateParams::signed_by`
# takes an `Issuer` instead of (issuer certificate, issuer key). Test issuers
# therefore retain the CA's `CertificateParams` and build `Issuer::from_params`
# — `Issuer::from_ca_cert_der` would need rcgen's `x509-parser` feature, which
# this crate deliberately does not enable (we parse with our own x509-parser).
# The `aws_lc_rs` + `fips` feature definitions are byte-identical across the
# break, so the FIPS backend selection is unchanged by the bump.
rcgen = { version = ">=0.14.9, <0.14.10", default-features = false, features = ["aws_lc_rs", "fips", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["fips"] }
# UPPER BOUND IS A COMPLIANCE CONTROL, NOT DEPENDENCY HYGIENE. Do not relax it to
# take a routine Dependabot bump (the dependabot.yml ignore rule mirrors it).
# aws-lc-rs is otherwise only a transitive dependency (rustls, rcgen, webpki);
# it is named here so the workspace resolves ONE version and this bound wins.
#
# aws-lc-rs 1.18.0 switches aws-lc-fips-sys from the AWS-LC-FIPS 3.x module to
# 4.x. The 3.x module shipped by aws-lc-rs 1.17.x is FIPS 140-3 VALIDATED (CMVP
# certificate #5314 static / #5298 dynamic); the 4.x module has completed lab
# testing and is on the CMVP Modules In Process list, not the validated list.
# Upstream's own guidance: "Consumers who need to remain on the FIPS 3.x module
# should pin aws-lc-rs to <1.18.0." Upstream keeps the 1.17.x line patched
# (1.17.4 and 1.18.1 released the same day), so the pin costs no fixes.
#
#   AWS-LC-FIPS module | aws-lc-rs        | aws-lc-fips-sys
#   3.0.x              | >=1.17.3, <1.18  | 0.13.x   <-- maknae is here, deliberately
#   4.x                | >=1.18           | 0.14.x
#
# Narrowed 2026-09-13 (#284): "VALIDATED" above is a claim about the MODULE, not
# about any platform Maknae ships on. Certificate #5314's security policy Table 3
# lists Amazon Linux 2023 on Graviton4 / Xeon 8375C as the tested operational
# environments; RHEL/Rocky 9 and macOS arm64 are both PORTED, unlisted ones, and
# CMVP "makes no statement as to the correct operation of the module when so
# ported". The honest claim is "a validated module", never "validated here".
#
# ASD STIG APSC-DV-001860 (CAT I) requires the module on the NIST CMVP
# VALIDATED list; in-process does not satisfy it. Raising this bound moves the
# product off a validated module and is an AO-visible change. Revisit only when
# 4.x has an issued certificate: the watch is #259. Same control as Microkosmos.
# The failure this pin prevents: the lockfile had already drifted to 1.18.0 /
# aws-lc-fips-sys 0.14.1 (the in-process module) before the pin existed.
aws-lc-rs = { version = ">=1.17.3, <1.18.0", features = ["fips"] }
x509-parser = "0.18"  # also parses CA/leaf PEM->DER (rustls-pemfile is unmaintained, RUSTSEC-2025-0134)
url = "2"             # validate vault.addr is a well-formed https:// URL (fail-closed, no plaintext)
zeroize = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false }  # its rustls uses the installed FIPS provider (§4.1)
arc-swap = "1"                                                  # hot-path ResolvesServerCert swap (Microkosmos pattern)
nix = { version = "0.31", default-features = false, features = ["socket", "user", "fs"] }
  # socket=peer-creds; user=geteuid (dir-owner check); fs=fchown (group-own the UDS)

[target.'cfg(unix)'.dependencies]
maknae-io = { path = "../maknae-io" }
# The client-plane descriptor collector (ADR-0009). It must sit BENEATH the TLS layer,
# and the TLS acceptor lives here — so until #66 moves PlaneListener/AuthenticatedStream
# into maknae-plane, the wrapping happens here and the adapter is borrowed from there.
maknae-plane = { path = "../maknae-plane" }

[dev-dependencies]
# Fixtures CREATE the objects they delegate rather than borrowing a system file:
# `/etc/hostname` does not exist on macOS, which the darwin-native job caught.
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "io-util", "test-util"] }
