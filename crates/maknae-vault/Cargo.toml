[package]
name = "maknae-vault"
publish.workspace = true
description = "Non-privileged Vault client for plane certificates and secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
maknae-config = { path = "../maknae-config" }

# vaultrs 0.8.0 (reqwest 0.13, rustify 0.7). `rustls-no-provider`, NOT `rustls`: from
# reqwest 0.13 the `rustls` feature installs the non-FIPS aws-lc-rs provider as the
# process default, which would silently pull aws-lc-sys into the TLS path and race
# the FIPS provider this crate installs (§6.1). `rustls-no-provider` leaves provider
# selection to the process, i.e. to the `.fips()`-asserted install. Same choice as
# Microkosmos. The failure this prevents: a Vault-HTTPS leg on a non-FIPS provider
# with every test still green. vaultrs and rustify move TOGETHER (0.7.4 needs rustify
# 0.6, 0.8.0 needs 0.7); Dependabot #254 and #255 each bumped one and failed to build.
# SECOND consequence, found while closing #318 and now asserted by two tests in
# client.rs (one reads this line, one asks the linked crate): vaultrs's
# `default_identity` always reads $VAULT_CLIENT_CERT/$VAULT_CLIENT_KEY, but the
# `Identity` construction it would return is `#[cfg(feature = "rustls")]`. This
# feature choice is therefore also what keeps that env path shut on every plane.
# Taking `rustls` (or restoring default-features) re-opens it — MEASURED: the
# compiled-behaviour test goes red on that change, it is not a paper claim.
vaultrs = { version = "=0.8.0", default-features = false, features = ["rustls-no-provider"] }
# #240b: the HTTP client every Vault client actually sends through is built HERE
# (http.rs), not by vaultrs — vaultrs 0.8.0 keeps reqwest's default redirect
# policy (follow 10), sets no https_only and no no_proxy, so an HTTPS-to-HTTP
# 307/308 from Vault or a proxy would resend the AppRole login body, SecretID
# included, in plaintext (found by codex review of #240b). Pinned to the exact
# version vaultrs resolves so there is ONE reqwest in the tree; the feature
# set is vaultrs's, so no TLS provider is installed by this dependency either.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustify = { version = "=0.7.0", default-features = false }        # direct dep only for the hand-rolled issuer/default/json Endpoint; already transitive via vaultrs, pinned to the resolved Cargo.lock version and moved in lockstep with vaultrs; no features of our own
rustify_derive = "=0.5.5"                                          # the #[derive(Endpoint)] macro used by the endpoint above; already transitive via vaultrs, pinned to the resolved Cargo.lock version
# THE COMPLIANCE CEILING IS REMOVED 2026-09-19 (#320) TOGETHER WITH THE aws-lc-rs
# BOUND BELOW. What remains -- `<0.15` -- IS NOT A CONTROL: for a 0.x crate that
# is exactly cargo's caret bound, i.e. `>=0.14.9, <0.15` resolves identically to
# `rcgen = "0.14.9"`, written out so the floor is visible. THE FLOOR IS THE
# CONTROL; the ceiling is cargo's own semantics. (Review caught an earlier draft
# of this header claiming the bound was simply "removed" while the line below
# still spelled one out -- an unexplained ceiling in a manifest whose rule is
# that a bound records the failure it prevents.)
#
# See the aws-lc-rs posture comment in crates/maknae-crypto/Cargo.toml for the ruling and the module-line facts,
# which are not restated here so there is one place to correct. The ceiling here was never
# about rcgen: `>=0.14.9, <0.14.10` existed because rcgen 0.14.10 raises its OWN
# aws-lc-rs requirement to ^1.18, which the old FIPS bound excluded, so the two
# were unsatisfiable and cargo refused the pair. With that bound lifted, 0.14.10
# resolves normally (MEASURED: aws-lc-rs 1.18.1, aws-lc-fips-sys 0.14.2, rcgen
# 0.14.10, pem 4.0.0 in one `cargo update`; workspace tests and `cargo deny
# check` both green).
#
# THE FLOOR IS DELIBERATE AND STAYS: `>=0.14.9`, not the bare `0.14` a first
# pass wrote. Caught in review 2026-09-19 before this shipped -- `"0.14"` is
# cargo's caret requirement, i.e. `>=0.14.0`, which would have silently dropped
# the floor eight patch versions below anything measured here, in a manifest
# whose own rule is that a bound records the failure it prevents. Nothing below
# 0.14.9 has ever been resolved or tested against this crate's rcgen usage --
# `csr_gen.rs` in production, plus the `Issuer::from_params` test issuers the
# API note below describes.
#
# 0.13 -> 0.14 was an API break, not a routine bump: `CertificateParams::signed_by`
# takes an `Issuer` instead of (issuer certificate, issuer key). Test issuers
# therefore retain the CA's `CertificateParams` and build `Issuer::from_params`
# — `Issuer::from_ca_cert_der` would need rcgen's `x509-parser` feature, which
# this crate deliberately does not enable (we parse with our own x509-parser).
# The `aws_lc_rs` + `fips` feature definitions are byte-identical across the
# break, so the FIPS backend selection is unchanged by the bump.
maknae-crypto = { path = "../maknae-crypto" }
rcgen = { version = ">=0.14.9, <0.15", default-features = false, features = ["aws_lc_rs", "fips", "pem"] }
x509-parser = "0.18"  # also parses CA/leaf PEM->DER (rustls-pemfile is unmaintained, RUSTSEC-2025-0134)
url = "2"             # validate vault.addr is a well-formed https:// URL (fail-closed, no plaintext)
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1.10.1"  # below 1.10.1, to_vec on a Bytes::from_owner buffer leaks the owner, so the zeroizing body is never wiped
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false }  # its rustls uses the installed FIPS provider (§4.1)
arc-swap = "1"                                                  # hot-path ResolvesServerCert swap (Microkosmos pattern)
nix = { version = "0.31", default-features = false, features = ["socket", "user", "fs"] }
  # socket=peer-creds; user=geteuid (dir-owner check); fs=fchown (group-own the UDS)

[target.'cfg(unix)'.dependencies]
maknae-io = { path = "../maknae-io" }
# The client-plane descriptor collector (ADR-0009). It must sit BENEATH the TLS layer,
# and the TLS acceptor lives here — so until #66 moves PlaneListener/AuthenticatedStream
# into maknae-plane, the wrapping happens here and the adapter is borrowed from there.
maknae-plane = { path = "../maknae-plane" }

[target.'cfg(target_os = "macos")'.dependencies]
# The plane SecretID read from the System keychain (#76, ADR-0018 amendment); safe API only.
security-framework = "3"

[dev-dependencies]
# Fixtures CREATE the objects they delegate rather than borrowing a system file:
# `/etc/hostname` does not exist on macOS, which the darwin-native job caught.
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "io-util", "test-util"] }
maknae-seal = { path = "../maknae-seal" }  # dev-only: a normal edge would link maknae-seal into maknaed (seal-confinement.sh)
