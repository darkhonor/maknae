[package]
name = "maknae-io"
publish.workspace = true
description = "Secure filesystem I/O for the Maknae trust plane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# NOT optional: Cargo does not apply [workspace.lints] to a member that omits this,
# and the workspace sets `unsafe_code = "forbid"`. ci/gates/unsafe-confinement.sh
# fails any member other than maknae-sys that omits it (ADR-0027).
[lints]
workspace = true

# The whole crate is cfg(unix); this mirrors maknae-audit-append's placement.
[target.'cfg(unix)'.dependencies]
# fs   — openat/openat2/renameat/fstat/fstatat/fcntl. Without it none of the fd-relative
#        primitives this crate exists to provide are reachable.
# uio  — pwrite for offset-independent replacement through the subject's own writable re-open.
# dir  — nix::dir::Dir for fd-relative enumeration. Dir::openat BORROWS the dirfd;
#        Dir::from_fd consumes and Drop-closes it, which would destroy the anchor pin.
# user — home.rs's session_home(): the passwd record for the effective uid (#596).
nix = { version = "0.31", default-features = false, features = ["fs", "dir", "uio", "user"] }
# net — recvmsg with SCM_RIGHTS, for ADR-0009 subject-delegated descriptors. THE reason
#       this is rustix and not another nix feature: `unsafe_code = "forbid"` is set
#       workspace-wide and cannot be locally overridden, and nix's
#       `ControlMessageOwned::ScmRights(Vec<RawFd>)` yields BARE RawFds whose conversion
#       to OwnedFd/BorrowedFd is `unsafe` in every form std offers. rustix's
#       `RecvAncillaryMessage::ScmRights(AncillaryIter<'_, OwnedFd>)` yields OWNED
#       descriptors safely. Without it the only paths were an `unsafe` block in precisely
#       the crate AGENTS.md holds up as the minimal-TCB I/O primitive, where the workspace
#       forbids it (ADR-0027 confines `unsafe` to maknae-sys), or holding bare RawFds with
#       hand-rolled close-on-drop — the exact leak-on-the-refusal-path hazard ADR-0009
#       names. It also parses SCM_CREDENTIALS into `UCred` (#115).
# `default-features = false` keeps it to "std" + "net"; the fs/process/thread/event
# APIs are not compiled in.
# EXACT PIN: rustix holds the `unsafe` ancillary-data parsing this crate trusts for
# delegated descriptors and sender credentials, so `cargo update` must not move it
# without a reviewed bump. 1.1.6 is the floor: 1.1.5 does not compile with "net"
# alone (`mod timespec` was not gated on `net`; bytecodealliance/rustix#1681).
rustix = { version = "=1.1.6", default-features = false, features = ["std", "net"] }
# Credential reads return Zeroizing<..> so the buffer is wiped on drop rather than left
# in freed heap. Re-exported from lib.rs so consumers need no zeroize pin of their own.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
maknae-sys = { path = "../maknae-sys" }

[dev-dependencies]
# Every fixture needs a private, mode-controlled directory tree; $TMPDIR is 1777.
tempfile = "3"

# cfg(unix)-scoped to match the production table above; the crate is unbuildable
# off-unix either way, but a manifest that says so in one table and not the other
# invites the reader to think one of them is deliberate.
[target.'cfg(unix)'.dev-dependencies]
# "user" is also a production feature now (home.rs); tests use it for geteuid owner checks.
nix = { version = "0.31", default-features = false, features = ["fs", "dir", "user"] }
