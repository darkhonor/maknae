[package]
name = "maknae-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
maknae-proto = { path = "../maknae-proto" }
maknae-spif = { path = "../maknae-spif" }
maknae-subject-ctx = { path = "../maknae-subject-ctx" }
maknae-audit = { path = "../maknae-audit" }
maknae-vault = { path = "../maknae-vault" }
maknae-config = { path = "../maknae-config" }
maknae-subject-ctx-mint = { path = "../maknae-subject-ctx-mint" }
maknae-audit-append = { path = "../maknae-audit-append" }
maknae-security = { path = "../maknae-security" }
maknae-authz-basic = { path = "../maknae-authz-basic" }
maknae-io = { path = "../maknae-io" }
maknae-msgs = { path = "../maknae-msgs" }
nix = { version = "0.31", default-features = false, features = ["user"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util"] }
serde_json = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
# The enforcement e2e constructs the REAL PDP over fixture policy files via the
# requirement-parameterized seam (nothing stubbed); dev-only — the
# feature-resolution-pin gate proves production resolution stays featureless.
maknae-authz-basic = { path = "../maknae-authz-basic", features = ["hermetic-test-seam"] }
