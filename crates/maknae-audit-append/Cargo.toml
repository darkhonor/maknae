[package]
name = "maknae-audit-append"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
maknae-config = { path = "../maknae-config" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["rt", "sync", "time", "io-util"] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW (via `nix::libc`) + `geteuid` (feature `user`) for the fail-closed
# integrity check on the OPENED audit fd (regular file, owner=euid, not
# group/world-writable). `custom_flags` + `MetadataExt` keep this `unsafe`-free.
nix = { version = "0.31", default-features = false, features = ["user"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"
