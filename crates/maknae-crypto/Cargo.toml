[package]
name = "maknae-crypto"
publish.workspace = true
description = "Maknae's cryptographic libraries and policy: the aws-lc-rs FIPS provider, its TLS key-exchange groups, and the start-up assertion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
# FIPS POSTURE — READ BEFORE CHANGING THIS LINE. This crate is the only
# workspace member that declares aws-lc-rs or rustls (ADR-0030; deny.toml
# enforces it): the workspace resolves ONE version, this requirement wins, and
# the posture has one documented home.
#
# MAINTAINER RULING 2026-09-19 (#320), recorded as ADR-0025 --
# design/adr/ADR-0025-fips-validation-is-a-goal-not-a-constraint.md, which is
# the DECISION OF RECORD; this comment mirrors it and never outranks it
# (AGENTS.md authority order: code -> KLC -> current ADRs -> everything else).
# Maknae moves to the AWS-LC-FIPS 4.x module line. In their words: *"Maknae does
# NOT have the same compliance posture as Microkosmos and it's silly to try and
# justify it otherwise. The design goal is the same (FIPS Validated), but it's a
# goal not a constraint."*
# Maknae is a personal project — no authorization boundary, no ATO, no assessor
# (AGENTS.md). FIPS 140-3 validation is a DESIGN TARGET so the system CAN be
# fielded; when a DoD deployment is genuinely pursued, the deploying
# organization's requirements govern, and re-pinning is a decision available to
# them at that time.
#
#   AWS-LC-FIPS module | aws-lc-rs        | aws-lc-fips-sys | CMVP
#   3.x                | >=1.17.3, <1.18  | 0.13.x          | VALIDATED: #5314 static / #5298 dynamic
#   4.x                | >=1.18           | 0.14.x          | Modules In Process (Review) <-- maknae is here
#
# (Rows are LINES, not module versions. The 2026-09-13 ruling that any 3.x
# implementation is approved -- and that the certificate-issued-at-3.1.0 vs
# crate-vendors-3.6.0 mapping is not a finding -- stands and is not reopened
# here; a row labelled with an exact version would reintroduce exactly that.)
#
# (Upstream `aws-lc/crypto/fipsmodule/FIPS.md`, read 2026-09-19: v4.0 static and
# dynamic are both listed under Modules In Process, not under validated.)
#
# THE HONEST CLAIM, everywhere in this repository: Maknae is built on the
# AWS-LC-FIPS 4.x module line, which is SUBMITTED and under CMVP review — never
# "validated", and never "validated here". (The platform half of that caveat is
# unchanged and independent: certificate environments were Amazon Linux 2023 on
# Graviton4 / Xeon 8375C even for 3.1, so RHEL/Rocky and macOS arm64 were ported,
# unlisted environments then too.) The old bound cited ASD STIG APSC-DV-001860
# (CAT I), which requires a module on the NIST CMVP validated list. **That
# requirement does not apply to Maknae**: there is no authorization boundary, no
# ATO and no assessor (AGENTS.md; maintainer, 2026-09-19: *"We don't need to be
# FIPS Validated because there is no CAT I."*). It would apply to a deployment
# fielded under an ASD STIG obligation — and such a deployment can re-pin to a
# validated line, which is the deploying organization's decision, made with
# their own knowledge of the tradeoff this comment records.
#
# WHAT FORCED THE DECISION — RUSTSEC-2026-0285 (#320). rustls <0.23.45 accepts
# TLS 1.3 handshake messages across encryption-level boundaries.
#
# ITS MEASURED SEVERITY, because this comment does not get to be vague where it
# asks for precision elsewhere: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N,
# and the advisory says plainly that "the handshake transcript is still
# authenticated, so a network-position attacker cannot use this to alter or
# complete a handshake". It is a confidentiality-only, low-severity defect, NOT
# a handshake break. The forcing function was never its blast radius: it was
# that a FAIL-CLOSED gate went red on every branch with no fix reachable. The fix,
# 0.23.45, requires aws-lc-rs >=1.18, which the old `<1.18.0` bound excluded, so
# `cargo deny check advisories` was red on main and on every branch with no
# agent-available fix. The standing reasoning applies and is the maintainer's
# own (2026-09-12): keeping an older crypto library with known vulnerabilities is
# worse than moving within the vendor's supported channel. A frozen, validated,
# VULNERABLE module is the posture an assessor penalises.
#
# MEASURED on the move (2026-09-19, Linux x86_64, Rust 1.98.1): aws-lc-rs 1.18.1
# + aws-lc-fips-sys 0.14.2 + rustls 0.23.45 + rcgen 0.14.10 resolve and build;
# `cargo deny check` -> "advisories ok, bans ok, licenses ok, sources ok"; the
# runtime `.fips()` assertion still holds on the 4.x module
# (`glue::tests::asserts_fips_true_on_this_build`), which is what actually
# proves the FIPS build, not the dependency tree.
#
# The floor is >=1.18 because that is where the 4.x module starts. There is no
# ceiling of OUR OWN -- but "1.18" is cargo's caret requirement, i.e.
# >=1.18.0, <2.0.0, so an aws-lc-rs 2.x would still need a manifest edit. That
# is cargo's bound, not a compliance control, and nothing here mirrors it: the
# dependabot.yml ignore that mirrored the old ceiling is removed outright.
#
# THE v4.0 CERTIFICATE IS NOT TRACKED, and that is the maintainer's ruling too
# (2026-09-19): *"We don't need to be FIPS Validated because there is no CAT I."*
# There is no watch issue, no review date and nothing owed. If NIST issues the
# certificate, the only change it licenses is an upgrade to the CLAIM — this
# comment and the posture docs — never a version change, and no one is obliged
# to notice. Do not file a watch, and do not re-raise the pin.
aws-lc-rs = { version = "1.18", features = ["fips"] }
rustls = { version = "0.23", default-features = false, features = ["fips", "std"] }
# rcgen: `>=0.14.9, <0.15`. THE FLOOR IS THE CONTROL: nothing below 0.14.9 has
# been resolved or tested against Maknae's rcgen usage (`csr.rs` here, and
# maknae-vault's `Issuer::from_params` test issuers), and a bare `"0.14"` would
# be cargo's `>=0.14.0`. The `<0.15` is cargo's own caret bound for a 0.x crate,
# written out so the floor is visible, not a compliance ceiling (ADR-0025).
# 0.14 signs against an `Issuer` built from the issuing `CertificateParams`;
# `Issuer::from_ca_cert_der` would need rcgen's `x509-parser` feature, which is
# not enabled. The `aws_lc_rs` + `fips` features select the FIPS backend.
rcgen = { version = ">=0.14.9, <0.15", default-features = false, features = ["aws_lc_rs", "fips", "pem"] }
pem = "4"
zeroize = "1"
