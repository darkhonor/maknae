[package]
name = "maknae-crypto"
publish.workspace = true
description = "Maknae's single door to its cryptography: the crypto-profile-awslc4 backend, the preferred profile and the plane signature keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
test-support = ["crypto-profile-awslc4/test-support"]

[dependencies]
# Exact: a crypto-profile release can change the `preferred` lists, which
# tests/offer_golden.rs pins (ADR-0031). The module line is ADR-0025's.
crypto-profile-awslc4 = "=0.9.0"
