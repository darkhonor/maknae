[package]
name = "maknae-proto"
publish.workspace = true
description = "Kernel decision request and response types: the versioned wire contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
ciborium = "0.2"
# Same pin form as maknae-io's: file content on the wire is secret-adjacent
# (spec D5) and must not linger in freed heap; alloc-only, no default features.
# Already in the workspace graph via maknae-io — no new supply-chain surface.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
tokio = { workspace = true, features = ["io-util"] }
# 2.2: the version url's idna_adapter already locks; NFC and General Category for the
# containment operand rule (#165). A second version would put two Unicode tables in the binary.
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.2", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
