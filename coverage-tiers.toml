anchor = "map_err(|_| ProtoFrameError::Oversize {"
end_anchor = "max: u32::MAX as usize,"
why = "write_frame's u32::try_from(body.len()) overflow guard fires only for a body >= 4 GiB (u32::MAX bytes); constructing such a slice in a unit test would require an actual multi-gigabyte allocation (or unsafe code to fake a slice length, forbidden by #![forbid(unsafe_code)]). Provably-unreachable in practice — every caller bounds body by transport.frame_max_bytes (<=1 MiB, config.rs range-enforced), never by this defensive cap. The Io error paths on the same function (header write, body write, flush) ARE unit-tested via a hand-rolled failing AsyncWrite."

