# Risk-tiered coverage contract (ADR-0016, issue #24).
# UNIVERSE: every git-tracked *.rs file in the REPO (`git ls-files '*.rs'`)
# outside [universe].exclude resolves to EXACTLY ONE tier. Unclassified,
# stale, double-classified, or (non-T3) absent-from-coverage = hard failure.
# Line-drawing rule (T1): "if this code silently breaks, can the engine return
# Permit for an access policy denies, derive a label less restrictive than its
# sources, or emit false assurance?" See design/adr/ADR-0016.

[universe]
# Segment-aware globs (`*` = one path segment, `**` = any number of segments),
# depth-pinned to workspace-member level: tests/benches/examples/build scripts
# are instruments, not subjects. A src/-nested look-alike is NOT excluded and
# hard-fails unclassified (fail-closed by design).
exclude = [
  "crates/*/tests/**",    "bins/*/tests/**",
  "crates/*/benches/**",  "bins/*/benches/**",
  "crates/*/examples/**", "bins/*/examples/**",
  "crates/*/build.rs",    "bins/*/build.rs",
  "build.rs",
]

[t1]
floor_production_region = 95
# The authorization seam (maknae-security): the fail-closed reference-monitor
# contract + composition. A broken combine/finalize/merge can return Permit for
# a deny — the exact T1 line-drawing rule. Re-populates the cohort emptied when
# the DCS engine relocated (2026-08-08).
files = [
  # The RBAC PDP backend (#85): role vocabulary, uid-keyed binding resolution,
  # and the pure decision core. Every line here is a verdict path — the exact
  # T1 rule (a wrong branch returns Permit for a deny).
  "crates/maknae-authz-basic/src/lib.rs",
  "crates/maknae-authz-basic/src/role.rs",
  "crates/maknae-authz-basic/src/binding.rs",
  "crates/maknae-authz-basic/src/decide.rs",
  # The classification seam (ADR-0022): the `ClassificationPolicy` contract
  # and `first_token`, the two systems that implement it (US in the kernel's
  # config crate, PSPF in its own crate), and the registry that selects one by
  # name. Every line ranks a level or picks the ladder that will -- a wrong
  # rank lets content flow above the ceiling once PR B consults it.
  "crates/maknae-security/src/classification.rs",
  "crates/maknae-config/src/policy.rs",
  "crates/maknae-classification-aus/src/lib.rs",
  "crates/maknae-kernel/src/classification.rs",
  # The fail-closed authz boot gate (#77): principal-required + PDP
  # construction refusal mapping — a wrong arm is a daemon serving without a
  # decider.
  "crates/maknae-kernel/src/boot_gate.rs",
  # #148 / #154: the per-request classification-ceiling operand and the
  # composition root. A wrong arm in the operand passes classified content
  # past the declared ceiling (or permits where it must abstain, which folds to
  # a fail-open under rule 3); a wrong shape in the composition makes the
  # baseline removable. Both are pure; the I/O-free fold they use lives in
  # maknae-security/compose.rs (T1).
  "crates/maknae-kernel/src/ceiling_authz.rs",
  "crates/maknae-kernel/src/composition.rs",
  # The CBOR byte-string content codec (#77): a wrong major type halves the
  # read ceiling and mis-routes oversize; the visitor is a refusal surface.
  "crates/maknae-proto/src/bytes.rs",
  "crates/maknae-io/src/anchor.rs",
  "crates/maknae-io/src/checks.rs",
  # ADR-0009 confinement: every line is a refusal path, and the failure mode is
  # exact — a wrong branch hands a subject an object outside its enrolled home,
  # or accepts a fifo/hardlink/oversize descriptor the named requirements refuse.
  "crates/maknae-io/src/delegated.rs",
  "crates/maknae-io/src/normalize.rs",
  # Raw T1 syscall coverage, with no exceptions. Corrected 2026-09-06 (#126):
  # current measurements are macOS 97/97 and Linux 116/116, both 100.00%.
  # The earlier 87/87 and 107/107 figures described the promotion revision,
  # before fd_path and the shared directory opener; they are not current counts.
  "crates/maknae-io/src/syscall.rs",
  "crates/maknae-io/src/walk.rs",
  "crates/maknae-io/src/strategy.rs",
  "crates/maknae-io/src/dir.rs",
  "crates/maknae-io/src/write.rs",
  "crates/maknae-security/src/value.rs",
  "crates/maknae-security/src/obligation.rs",
  "crates/maknae-security/src/verdict.rs",
  "crates/maknae-security/src/compose.rs",
  # maknae-config loading core (parses untrusted config → policy; a mis-parse or
  # dup-key bypass loads the wrong policy). value.rs is a bare enum (no production
  # regions) → T3 below.
  "crates/maknae-config/src/error.rs",
  "crates/maknae-config/src/scalar.rs",
  "crates/maknae-config/src/builder.rs",
  "crates/maknae-config/src/lib.rs",
  # cycle ②a: the document model + extension registry. loader.rs is the
  # permission gate + merge/precedence (a mis-parse loads the wrong policy or a
  # weakened ceiling → T1). document.rs holds the admin.config.show disclosure classifier (#162) plus the section() scan.
  # In [t1].files ONLY — NOT ratchet_cohort (each clears its own 95% floor; the
  # 99 aggregate is the seam+cycle-① cohort, ADR-0016 §4).
  "crates/maknae-config/src/document.rs",
  "crates/maknae-config/src/loader.rs",
  # cycle ②c: the classification ceiling parse + coarse ingest projection. A
  # mis-read ceiling widens the ingest gate → T1. In [t1].files ONLY (own 95%
  # floor; NOT ratchet_cohort, per ②a Task 8).
  "crates/maknae-config/src/ceiling.rs",
  # kernel config-boot: the boot gate resolves the runtime ingest posture and must
  # fail closed. In [t1].files ONLY (own 95% floor; NOT ratchet_cohort).
  "crates/maknae-kernel/src/boot.rs",
  # maknae-vault Stage 1: the plane-cert client's PURE decision logic. The URI-SAN
  # verifier is the register's single consciously-owned code; the CSR shape + config
  # + FIPS decision are fail-closed gates. Each in [t1].files ONLY (own 95% floor;
  # NOT ratchet_cohort). The network/keygen/provider I/O (auth/client/ca/fips_glue)
  # is T3 + excluded from mutation via the workspace-root mutants.toml.
  "crates/maknae-vault/src/verify.rs",
  "crates/maknae-vault/src/csr.rs",
  "crates/maknae-vault/src/plane.rs",
  "crates/maknae-vault/src/config.rs",
  "crates/maknae-vault/src/fips.rs",
  # PR-J1 Task 4: per-plane SecretID credential-SOURCE resolution (spec §5.1) —
  # pure decision logic, no I/O. A swapped precedence arm or a missing fail-closed
  # default here is exactly the T1 line-drawing rule (silently prefers a weaker
  # credential source, or the daemon and CLI resolvers get conflated). In
  # [t1].files ONLY (own 95% floor; NOT ratchet_cohort). The I/O half
  # (secret_io.rs) is T3 below.
  "crates/maknae-vault/src/secret_source.rs",
  # #172: the FIPS-module SHA-256 wrapper behind every egress content digest.
  "crates/maknae-vault/src/digest.rs",
  # Stage-3a "it responds" cohort (Task 9): the wire/frame decode-and-dispatch
  # + config-range + audit-canonicalization + connection/verb decision seams.
  # Each holds fail-closed decision logic per the T1 line-drawing rule (a
  # missed decode-version check, an out-of-range config field silently
  # accepted, a mis-sorted audit record, or a swapped authz/dispatch arm all
  # weaken the enforced posture). Each in [t1].files ONLY (own 95% floor; NOT
  # ratchet_cohort — the ratchet is the security-seam + config-loading-core
  # cohort, ADR-0016 §4).
  "crates/maknae-proto/src/wire.rs",
  # #240a: the maknaed<->egress frame. The request/response mapping is T1 by
  # #240's own declaration; its Debug redaction is what keeps prompt content
  # and the provider key path out of operator-visible error strings.
  "crates/maknae-proto/src/egress_frame.rs",
  # #240a D3-A: the PURE peer-identity decision. It is a separate file from
  # peercred.rs because that one is whole-file mutation-excluded (syscall I/O),
  # which would make a T1 tier there vacuous — zero mutants, zero missed.
  "crates/maknae-vault/src/peer_identity.rs",
  # #240a: the shared bounds parser and its CONTAINMENT check. A bare
  # `starts_with` admits `providers-evil/key` under a `providers` prefix — a
  # malformed or hostile registry entry naming a Vault path outside the
  # deputy's grant. Both maknaed (at boot) and the deputy (at use) decide on it.
  "crates/maknae-config/src/bounds.rs",
  # #240a: the deputy's decision — bounds containment and shape admission, and
  # the absence of any path by which it could chain to another call.
  "bins/maknae-egress/src/handle.rs",
  "crates/maknae-proto/src/frame.rs",
  "crates/maknae-config/src/transport.rs",
  # #243: the provider registration parser. A wrong arm registers a
  # destination the operator did not name, or lets a pasted key through.
  "crates/maknae-config/src/provider.rs",
  "crates/maknae-config/src/audit_cfg.rs",
  # PR-J1 Task 5: the `principal` section (enrolled-operator identity `maknae
  # enroll` writes into maknae.yaml). The authorization policy resolves
  # `~` against this — a malformed section that silently collapsed to "absent"
  # would leave `~` unresolved instead of refused. Fail-closed decision logic,
  # the T1 line-drawing rule. In [t1].files ONLY (own 95% floor; NOT
  # ratchet_cohort).
  "crates/maknae-config/src/principal.rs",
  # PR-J1 Task 6: the authz policy schema v1 (spec §7; RBAC-decided per ADR-0020) — the
  # Claude-Code/Codex-style permission grammar (Read patterns) a future
  # per-request PDP evaluates, plus the secure fail-closed load (symlink
  # refusal + mode gate + root-ownership assertion, spec §4.6). A durable
  # contract: a mis-parsed glob/argv rule, a swapped deny/allow precedence, or
  # a dropped owner check would silently widen what a compromised `_maknae`
  # can read/exec — exactly the T1 line-drawing rule. In [t1].files ONLY (own
  # 95% floor; NOT ratchet_cohort).
  "crates/maknae-config/src/authz.rs",
  "crates/maknae-audit-append/src/record.rs",
  # #172: the Egress seam — the DurableEgressIntent type gate, the reply admission, the
  # outcome record derivation. The write-ahead order is a type here, so this file is T1.
  "crates/maknae-kernel/src/egress.rs",
  # #189's journald wire encoder: a malformed field name corrupts the entire
  # datagram (not merely its own field), and a wrong PrimaryOutcome arm makes
  # the two audit sinks diverge silently. Pure computation; the socket lives in
  # journal_io.rs, tiered separately.
  "crates/maknae-audit-append/src/journal.rs",
  # #222's macOS unified-log formatter: a wrong oversize predicate ships
  # CORRUPT JSON into the audit trail — the platform clips at 1015 bytes and
  # marks the wreckage `<…>`, so an off-by-one keeps a record that is truncated
  # mid-payload while still looking present. It also holds the D4b scrub, whose
  # failure lets a subject forge structured fields into their own deny record.
  # Pure; the syslog(3) call lives in syslog_io.rs, tiered separately.
  "crates/maknae-audit-append/src/syslog_fmt.rs",
  "crates/maknae-audit-append/src/session.rs",
  "crates/maknae-kernel/src/authz.rs",
  "crates/maknae-kernel/src/handler.rs",
  # #158: namespace/report evidence, descriptor mutations, and durable audit admission.
  "crates/maknae-kernel/src/mutation_exchange.rs",
  "crates/maknae-kernel/src/mutation.rs",
  "crates/maknae-io/src/mutation.rs",
  "crates/maknae-io/src/audit_append.rs",
  "crates/maknae-vault/src/supervisor.rs",
  # maknae-msgs: the compiled-in en_US/ko_KR message catalog (spec §4.3, PR-J1
  # Task 1). lib.rs owns detect_locale (env-var precedence: LC_MESSAGES then
  # LANG, ko-prefix routing) and msg() (locale -> catalog dispatch) — a
  # mis-detected locale or swapped dispatch arm silently ships the wrong
  # language to an operator. In [t1].files ONLY (own 95% floor; NOT
  # ratchet_cohort — new crate, not the security-seam+config-loading-core
  # cohort, ADR-0016 §4). The two catalog files are pure declaration-only
  # string tables (no decision logic) -> T3 below.
  "crates/maknae-msgs/src/lib.rs",
  # PR-J1 Task 7: boot credential-posture determination (spec §5.2) — the pure
  # (CredentialSource, marker) -> Posture closed map `maknaed` states in its
  # per-boot AU-3 record. A wrong cell would silently claim a STRONGER posture
  # than what actually protected the SecretID (e.g. reporting a plaintext
  # secret as `hrot_sealed`) — exactly the "emit false assurance" T1
  # line-drawing rule. In [t1].files ONLY (own 95% floor; NOT ratchet_cohort).
  # The marker-file read + record construction/emission (I/O) stay in run.rs
  # (already T3, mutation-excluded via .cargo/mutants.toml).
  "crates/maknae-kernel/src/posture.rs",
  # Issue #145: pure blocking circuit-breaker state for non-cancellable
  # `spawn_blocking` work. A wrong transition can keep spawning into a wedged
  # filesystem/NSS backend or fail open instead of refusing before spawn.
  "crates/maknae-kernel/src/blocking_guard.rs",
  "crates/maknae-audit-append/src/blocking_guard.rs",
]
# maknae-security request.rs/authorizer.rs and maknae-config value.rs are pure
# declarations (no executable production regions) → T3, not T1. The mutation set
# is the whole crate regardless of tier, so they stay mutation-covered.
# Risk-based mutation set (operator decision 2026-08-04): MLS/DCS/security-
# critical crates whose fail-closed behavior must be provable to external
# third parties. Zero missed mutants required.
mutants_crates = ["maknae-security", "maknae-config", "maknae-io", "maknae-kernel", "maknae-vault", "maknae-proto", "maknae-audit-append", "maknae-msgs", "maknae-authz-basic", "maknae-classification-aus"]
# Crates whose mutation run needs a non-default feature so feature-gated seam
# code is LIVE (mutants in cfg'd-out code are unkillable-MISSED — the
# 2026-08-27 main-red class; #77 generalized the maknae-config special case).
# Contract: every key MUST appear in mutants_crates; every value MUST be a
# list of strings; an absent table is legal. Validated in coverage-tiers.sh's
# prologue (BOTH lanes).
mutants_features = { maknae-config = ["hermetic-test-seam"], maknae-authz-basic = ["hermetic-test-seam"] }

[t2]
floor_production_region = 90
# The client-plane descriptor adapter (ADR-0009). NOT T1, by the line-drawing rule
# above and not by convenience: if this silently breaks, delegated descriptors are
# LOST, and an absent descriptor is a `Deny` (ADR-0009 decision 2) -- it cannot yield
# a Permit for an access policy denies. The queue is per-connection, so a mis-ordered
# take stays within one subject, and the PDP decides on the path of whichever
# descriptor is actually used (decision 6), so the verdict follows the object rather
# than diverging from it. What IS at stake here is availability and descriptor
# exhaustion, which is a T2 concern. The security-relevant half -- the recvmsg,
# CMSG_CLOEXEC, the per-message bound, the checks -- is in maknae-io and is T1.
files = [
  # #240a: the kernel-side egress transport. T2, not T1, and by the repo's own
  # line-drawing rather than by convenience: this file is socket I/O — connect,
  # timeouts, framed read/write — and every other I/O file here is T3
  # (secret_io, syslog_io, journal_io, supervisor_run at 79%). The SECURITY
  # DECISION it carries is not in this file: peer identity is decided in
  # `maknae-vault/src/peer_identity.rs`, which IS T1 and mutation-visible.
  # What this file owns is the ORDERING — the check happens before the first
  # write — and that is proven by a mutation probe, not by a coverage floor:
  # moving the check below the write put 200 bytes of prompt content and a
  # Vault key path on the wire to an unauthenticated peer, and the test failed
  # on the byte count.
  "crates/maknae-kernel/src/egress_socket.rs",
  # #240a: the deputy's side of the same transport, tiered for the same reason
  # — socket I/O, with the DECISION in handle.rs (T1) and the peer-identity
  # check in maknae-vault's peer_identity.rs (T1).
  "bins/maknae-egress/src/serve.rs",
  "crates/maknae-plane/src/fd.rs", "crates/maknae-plane/src/send.rs",
  # Cooperative execution in the untrusted CLI: cannot issue a PDP Permit or
  # kernel-observed completion. Guard failures can damage the subject's own
  # files or misreport progress; real filesystem/ack tests remain required.
  "bins/maknae/src/mutation.rs",
]

[project]
# Cohort ratchet (ADR-0016 §4): the floor applies to ratchet_cohort ONLY —
# new files meet their tier bars but do not implicitly join the cohort.
# Re-baselining (extend cohort + recompute floor) is deliberate and recorded
# here with provenance. Floor is int-only: floor(measured on the CI lane).
ratchet_floor = 99
# Re-baselined 2026-08-09. Cohort = maknae-security seam (100%) + maknae-config
# loading core. maknae-config/src/builder.rs sits at 98.31% region coverage: its
# 3 uncovered regions are the provably-unreachable `if let Some(Partial::Seq/Map)
# = stack.pop()` else-arms on Sequence/Mapping end (the parser guarantees balanced
# Start/End, so pop() always matches) — defensive, uncoverable. Aggregate 99.23%
# → floor(99.23) = 99. A justified cohort-extension re-baseline (ADR-0016 §4), not
# a discretionary lowering; each T1 file still clears its own 95% floor.
ratchet_cohort = [
  "crates/maknae-security/src/value.rs",
  "crates/maknae-security/src/obligation.rs",
  "crates/maknae-security/src/verdict.rs",
  "crates/maknae-security/src/compose.rs",
  "crates/maknae-config/src/error.rs",
  "crates/maknae-config/src/scalar.rs",
  "crates/maknae-config/src/builder.rs",
  "crates/maknae-config/src/lib.rs",
]

[project.ratchet_provenance]
# Cohort = maknae-security (100%) + maknae-config loading core. floor =
# floor(measured aggregate). builder.rs's 3 unreachable defensive pop() branches
# hold the aggregate at 99.23%. DCS-era provenance (97.88) superseded.
value = 99.23
date = "2026-08-09"
lane = "darwin dev-host (clean worktree); ubuntu-latest CI authoritative on merge"
command = "bash ci/gates/coverage-tiers.sh --root .  # via .github/workflows/ci.yml build-and-gate"

