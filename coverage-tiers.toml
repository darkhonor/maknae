# Risk-tiered coverage contract (ADR-0016, issue #24).
# UNIVERSE: every git-tracked *.rs file in the REPO (`git ls-files '*.rs'`)
# outside [universe].exclude resolves to EXACTLY ONE tier. Unclassified,
# stale, double-classified, or (non-T3) absent-from-coverage = hard failure.
# Line-drawing rule (T1): "if this code silently breaks, can the engine return
# Permit for an access policy denies, derive a label less restrictive than its
# sources, or emit false assurance?" See design/adr/ADR-0016.

[universe]
# Segment-aware globs (`*` = one path segment, `**` = any number of segments),
# depth-pinned to workspace-member level: tests/benches/examples/build scripts
# are instruments, not subjects. A src/-nested look-alike is NOT excluded and
# hard-fails unclassified (fail-closed by design).
exclude = [
  "crates/*/tests/**",    "bins/*/tests/**",
  "crates/*/benches/**",  "bins/*/benches/**",
  "crates/*/examples/**", "bins/*/examples/**",
  "crates/*/build.rs",    "bins/*/build.rs",
  "build.rs",
]

[t1]
floor_production_region = 95
# EMPTY at present. The security-critical DCS crate (maknae-dcs-core: lattice,
# label, dominance, registry, ownership, controls) was relocated to a private
# library; no in-tree production code carries a T1 obligation until Maknae's
# security substance is rebuilt against the authorization seam. Re-populate as
# T1 crates land.
files = []
# Risk-based mutation set (operator decision 2026-08-04): MLS/DCS/security-
# critical crates whose fail-closed behavior must be provable to external
# third parties. EMPTY while no security-critical crate is in-tree (see above).
mutants_crates = []

[t2]
floor_production_region = 90
files = []

[project]
# Cohort ratchet (ADR-0016 §4): the floor applies to ratchet_cohort ONLY —
# new files meet their tier bars but do not implicitly join the cohort.
# Re-baselining (extend cohort + recompute floor) is deliberate and recorded
# here with provenance. Floor is int-only: floor(measured on the CI lane).
ratchet_floor = 97
# EMPTY cohort: the ratcheted maknae-dcs-core production files were relocated
# to a private library. The floor value is retained as the high-water mark to
# re-baseline against when T1 production code returns; with an empty cohort the
# gate has no files to measure (inert, not lowered).
ratchet_cohort = []

[project.ratchet_provenance]
# Cohort emptied 2026-08-08 when the DCS engine (maknae-dcs-core) was relocated
# to a private library. The prior baseline (value 97.88, 2026-08-05, EPIC #33
# Stage 1 cohort of decide/label/policy/subject/controls/ownership/registry) is
# preserved here as provenance; floor 97 stands as the re-baseline target. When
# T1 production code lands again, re-measure and record a fresh cohort.
value = 97.88
date = "2026-08-05"
lane = "darwin dev-host (clean worktree); ubuntu-latest CI authoritative on merge"
command = "bash ci/gates/coverage-tiers.sh --root .  # via .github/workflows/ci.yml build-and-gate"

