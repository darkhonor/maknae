# KNOWN IMPRECISION in the exceptions below, no floor impact.
#
# The gate matches WHOLE LINES, and several exceptions anchor on a line that carries
# BOTH a covered call and an uncovered `?`/closure edge — the `foo(..).map_err(..)?`
# form and the bare `x(..)?;` statement alike. An exception anchored there necessarily
# removes both, so some covered regions leave the denominator alongside the arm the
# `why` names. The per-exception region counts the gate prints on each run are the
# authoritative figures; no derived percentage is quoted here, because the last attempt
# quoted one measured on an earlier tree state and it was wrong by the exact amount of
# the fix that landed in the same commit.
#
# NO file currently has an imprecision-driven delta: every [t1] file reports 100.00%,
# so precise sub-line spans would return 100.00% for all of them.
#
# Not fixable by writing a narrower `why`: it needs sub-line region anchoring in the
# gate, or reformatting every such site so the closure sits on its own line, which
# rustfmt would undo. Recorded rather than tolerated silently, because "an exception
# must excuse the arm it names and nothing adjacent to it" is the rule the rest of this
# file is held to.

# Row 0's Err arm needs NO exception any more: anchor_parent_failures_name_the_parent_
# and_do_not_claim_a_refusal provokes it for real (a missing intermediate and a symlink
# loop), so the gate reports it covered. Deleted rather than left behind — the gate
# hard-fails a stale exception, which is how this one was found.

[[exception]]
path = "crates/maknae-io/src/anchor.rs"
anchor = "syscall::fstat(&afd).map_err"
why = "fstat on an fd the kernel just returned cannot fail on a healthy FS; the arm is a pure errno passthrough with no decision"

[[exception]]
path = "crates/maknae-io/src/delegated.rs"
anchor = "fd_path(&fd).map_err(|e| IoError::FdPathUnavailable {"
end_anchor = "        kind: crate::checks::kind_of_errno(e),"
why = "The /proc/self/fd lane failing for a descriptor the caller already holds requires /proc to be absent from the process's mount namespace (a container built without it). That is a REAL deployment condition, not a theoretical one, and it is why the arm exists and why it maps to FdPathUnavailable -> ADR-0009 decision 8's unknown -> Deny rather than to any success. It is not constructible in-process: unsharing a mount namespace mid-test would apply to every thread of a parallel harness, and fork-then-unshare in a multithreaded process leaves only async-signal-safe operations available. The testable path is a re-exec of the test binary into `unshare -Urm` with /proc masked; that is a harness the crate does not have and would be the way to retire this exception. The arm itself carries NO decision -- it is a total mapping of any errno to one variant -- and its Display is separately asserted in error.rs (display_strings_the_crate_reasons_about), including that it names no false path."

[[exception]]
path = "crates/maknae-io/src/delegated.rs"
anchor = ".map_err(|e| crate::checks::map_errno_no_disambiguation(e, &path))"
why = "Identical in kind to the anchor.rs fstat exception above, and strictly weaker: this fstat runs on a descriptor whose /proc/self/fd entry resolved two lines earlier, so the fd is demonstrably valid and open at that instant. A pure errno passthrough with no decision."


