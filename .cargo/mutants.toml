# cargo-mutants config (read even under `cargo mutants --package`, from the workspace
# root where the CI gate invokes it). The exclude_globs are path-scoped to maknae-vault,
# maknae-proto, maknae-audit-append, maknae-kernel, and maknae-io respectively, so they do NOT
# affect the other mutated crates (config/security mutate their own files). Scope each
# mutated crate to its pure T1 decision logic — the excluded files are I/O (network/
# keygen/provider/file/syscall) that cannot be meaningfully unit-killed.
#
# ONE DELIBERATE EXEMPTION, and what it actually costs — MEASURED, not assumed.
#
# Most excluded files are also [[t3]]; `crates/maknae-io/src/syscall.rs` is `[t1]`
# (promoted at 87/87 regions darwin, 107/107 regions Linux) and still excluded. ADR-0016 defines T1 as
# floor + crate mutation gate, and no gate cross-checks these two files, so this note is
# the only place the exemption is visible.
#
# The original justification — `replace | with ^` on a disjoint bitflag union is
# behaviourally identical, so an equivalent mutant is reported MISSED and the gate goes
# red — is TRUE but INCOMPLETE, and stating only that overstated the case.
#
# MEASURED on darwin with the exclusion lifted, two runs, IDENTICAL both times:
#   73 mutants: 21 caught, 9 unviable, 38 missed + 5 timeouts.
# Of the 43 uncaught, 26 are the equivalent `^` family. The other 17:
#
#   6  `openat2_resolve` / `probe_openat2`. MISSED on darwin because the code is
#      `#[cfg(target_os = "linux")]` and darwin never compiles it. FIVE are lane
#      artifacts. The SIXTH was a real defect: `openat2_resolve`'s `O_NONBLOCK` had no
#      control on either platform, so `read("config.d/<fifo>")` blocked maknaed forever
#      on the fast lane. Closed by `the_openat2_lane_does_not_block_on_a_fifo`.
#      (An earlier version of this note said all six were "not evidence of a gap", and
#      two commit bodies claimed to have corrected it while changing only two labels.
#      Corrected here for real. Assessing the remaining five by MUTATION still needs a
#      Linux mutants run — but flag deletion on Linux assesses them today, and did.)
#   4  `open_dir_handle`. It targets `.`, which cannot be a symlink, and it carries
#      `O_NONBLOCK`. Low severity, still uncontrolled.
#   2  `fsync_fd` / `sync_data` bodies replaced with `Ok(())`. Durability is not
#      observable from a unit test without crash injection.
#   5  TIMEOUTs on the read / temp / append opens. NOT all "dropped O_NONBLOCK": `&`
#      binds TIGHTER than `|` in Rust, so a mutated `|` drops exactly the two ADJACENT
#      operands, not the whole union. Verified at `open_temp_excl` — the mutant there
#      drops `O_NOFOLLOW` and `O_CREAT` and KEEPS `O_NONBLOCK`. It is behaviourally
#      detected well before the timeout — read the mutant's own log rather than trusting
#      a remembered count, which is how "three assertions" got written here.
#
# Two errors this note previously contained, both corrected against my own runs:
#   - It claimed the `&` mutants dropping O_NOFOLLOW/O_EXCL "were already caught". Not
#     true then; the ones that mattered are caught NOW, by tests added for them.
#   - It said counts vary run to run and should be treated as approximate, inferring
#     that from a 40/19 figure. Wrong, and harmful: 40/19 was the PRE-remediation tree,
#     and both trees reproduce exactly. Nothing here is noise — telling the next
#     engineer to discount mutation counts would discard the signal that found the
#     row-0 hang in the first place.
#
# Compensating controls: a coverage floor (87/87 regions darwin, 107/107 regions Linux); per-verb
# FD_CLOEXEC assertions for six of the seven opens (`open_dir_handle` pins only the END
# state and says so on the test — `fdopendir` sets the bit afterwards, so no external
# assertion can hold its call-site flag); and behavioural tests for O_NOFOLLOW, O_EXCL,
# and O_DIRECTORY at BOTH rows — row 0's FIFO-parent hang and row 1's non-directory
# anchor, each added after the mutant that exposed it — plus O_NOFOLLOW on `append` and
# O_NONBLOCK on the openat2 lane. Durability and the four `open_dir_handle` drops remain
# uncontrolled. The Linux-only lane is uncontrolled BY MUTATION but is now covered
# behaviourally, by tests that run there. Narrowing this
# to an `exclude_re` on the `^` family is tracked as #126.

# ---------------------------------------------------------------------------
# exclude_re — method-scoped, where a whole-file glob would be too blunt.
#
# `maknae-plane`'s fd.rs and send.rs carry real decisions (the descriptor queue's
# cap, FIFO ordering, attach-once, the readiness-retry classifier) that MUST stay
# mutated — attach-once in particular is an invariant a mutant kills and review did
# not. So these two methods are excluded individually rather than the files.
#
# `poll_flush` on both adapters delegates to `tokio::net::UnixStream::poll_flush`.
# VERIFIED IN TOKIO'S SOURCE, not assumed — tokio 1.53.1, src/net/unix/stream.rs:1058:
#
#     fn poll_flush(self: Pin<&mut Self>, _: &mut Context<'_>) -> Poll<io::Result<()>> {
#         Poll::Ready(Ok(()))
#     }
#
# The mutation replaces our delegation with `Poll::from(Ok(()))`, which is the SAME
# VALUE by the same reasoning. No test can distinguish them because there is nothing
# to distinguish: a socket has no userspace buffer to flush. A textbook equivalent
# mutant, and the honest handling is to exclude it rather than to invent an assertion
# that would only be testing tokio.
#
# NOT excluded, deliberately: `poll_shutdown` on either adapter. It looked like the
# same shape and is not — a shutdown that returns Ok without shutting down leaves the
# peer waiting for an EOF that never comes. Mutation caught that as MISSED because the
# test asserted only that `shutdown()` returned Ok; asserting the peer actually reads
# 0 bytes turned both into TIMEOUTs, which is a detection. The near-miss is recorded
# because "it delegates, so it is equivalent" is the reasoning that would have wrongly
# excluded it too.
# `BasicAuthorizer::subjects` -- the 3-line PRODUCTION trait wrapper that binds
# `load_authz` (the root-owned hardened loader) and forwards to
# `subjects_with_loader`. `replace ... with None` survives, and cannot be killed
# in this environment for a structural reason worth writing down:
#
#   the production loader requires a ROOT-OWNED policy file, so off-root every
#   call returns None whether the body forwards or is stubbed. Any assertion
#   available to a non-root test is satisfied by both.
#
# Corrected 2026-09-01, from an actual run rather than an assumption. This note
# previously argued by analogy: "the sibling `decide` wrapper is in the same
# unkillable boat and is only categorised differently, because `Verdict` has no
# `Default`." BOTH HALVES WERE FALSE. `Verdict` derives `Default`
# (`verdict.rs:16`), and `verdict.rs:11-15` says it was made so ON PURPOSE
# "so cargo-mutants can generate viable `-> Default::default()` mutants for
# combine/decide, so the fail-closed core is actually mutation-exercised" --
# and that mutant is CAUGHT. Lifting this exclusion and re-running reports
# exactly one missed mutant, this one, out of 105.
#
# So the exclusion stands on its own argument, not on a sibling's:
#
# COMPENSATING CONTROLS, both real:
#   - `subjects_with_loader` -- everything the wrapper delegates to, including
#     the None-on-unreadable and None-on-invalid paths -- is mutation-covered
#     and directly tested (`subjects_reports_file_bindings_and_none_on_failure`).
#   - `HermeticAuthorizer::subjects` runs the SAME code through a
#     fixture-satisfiable requirement, and `wrapper_subjects_delegate_and_read_live`
#     proves it returns Some, reads live, and re-reads after a file edit.
# What is NOT covered is the one-line choice of loader. Reviewed and accepted.
exclude_re = [
  "maknae-plane.*::poll_flush",
  # NARROWED to the one replacement the argument covers. The broad form also
  # suppressed the two KILLABLE mutants on the same method -- including
  # `with Some(vec![])`, which is the single most load-bearing distinction on
  # this surface: it turns "I cannot enumerate" into "nobody is bound". An
  # exclusion wider than its justification silently retires coverage the
  # justification never claimed.
  "maknae-authz-basic.*BasicAuthorizer>::subjects -> Option<Vec<maknae_security::SubjectBinding>> with None",
]

exclude_globs = [
  "crates/maknae-io/src/error.rs",       # IoError/IoKind enum + Display; no From impl exists
  "crates/maknae-io/src/syscall.rs",     # raw wrappers; OFlag/Mode/ResolveFlag/AtFlags unions -> equivalent mutants
  "crates/maknae-vault/src/auth.rs",       # AppRole login (standing SecretID) — live-Vault I/O
  "crates/maknae-vault/src/client.rs",     # mint/renew/shutdown/rotate_leaf — network I/O
  "crates/maknae-vault/src/operator.rs",   # OperatorClient role-id/secret-id/accessor/CA I/O (Task 3) — thin vaultrs pass-throughs + one hand-rolled Endpoint; the pure join_ca_chain helper is unit-tested directly, not via mutation
  "crates/maknae-vault/src/supervisor_run.rs", # credential-supervisor I/O driver — T3 (decisions it drives, retry_action/rotate_now, stay in supervisor.rs, NOT excluded)
  "crates/maknae-vault/src/ca.rs",         # PEM file I/O (fixture-tested for coverage, not mutation)
  "crates/maknae-vault/src/csr_gen.rs",    # rcgen keygen I/O (non-deterministic); pure shape checks are csr.rs (T1)
  "crates/maknae-vault/src/fips_glue.rs",  # process-global provider fetch (T3)
  "crates/maknae-vault/src/error.rs",      # Display/From declarations
  "crates/maknae-vault/src/lib.rs",        # re-exports
  "crates/maknae-vault/src/tls.rs",           # rustls config builders — provider/handshake I/O (T3)
  "crates/maknae-vault/src/plane_verify.rs",  # rustls verifier adapter — delegates to WebPki + T1 verify (T3)
  "crates/maknae-vault/src/resolver.rs",      # ArcSwapOption cert resolver — TLS hot path (T3)
  "crates/maknae-vault/src/socket.rs",        # UDS bind/accept/connect + fs hardening — I/O (T3)
  "crates/maknae-vault/src/peercred.rs",      # nix getsockopt peer-creds — syscall I/O (T3)
  "crates/maknae-vault/src/stream.rs",        # PlaneListener/Connector/AuthenticatedStream — I/O (T3)
  "crates/maknae-vault/src/transport_tests.rs", # #[cfg(test)] loopback suite — test-only, uniform T3 story
  "crates/maknae-vault/src/secret_io.rs",      # PR-J1 Task 4: reads an already-resolved secret source — file I/O + one systemd-creds subprocess; the fail-closed precedence decisions it consumes stay in secret_source.rs (T1), NOT excluded
  # Stage-3a "it responds" cohort (Task 9): T3 I/O files of the newly-mutated
  # crates (maknae-proto, maknae-audit-append) + the kernel's I/O-only files —
  # only the T1 decision logic (wire/frame/transport/audit_cfg/record/session/
  # authz/handler/supervisor) is mutated.
  # UPDATED 2026-09-05 (#189): maknae-audit-append gained journal.rs (T1, the
  # journald wire encoder) and journal_io.rs (T3, the socket). NEITHER is
  # excluded — journal_io.rs measured 2 caught / 1 unviable / 0 missed, so the
  # T3 tier needs no mutation exemption here, and taking one would retire
  # coverage this note's argument never claimed.
  "crates/maknae-proto/src/error.rs",       # Display/Error declarations only
  "crates/maknae-audit-append/src/sink.rs", # file-open + blocking-write I/O
  "crates/maknae-audit-append/src/error.rs", # Display/Error declarations only
  "crates/maknae-kernel/src/groupres.rs",   # nix Group/User/getgrouplist — syscall I/O
  "crates/maknae-kernel/src/run.rs",        # run-loop orchestration + process entrypoint — I/O/control-flow driver
]
