[package]
name = "maknae"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "maknae"
path = "src/main.rs"

[dependencies]
maknae-proto = { path = "../../crates/maknae-proto" }
maknae-config = { path = "../../crates/maknae-config" }
maknae-vault = { path = "../../crates/maknae-vault" }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# NO privileged crate (maknae-kernel/-subject-ctx-mint/-audit-append/-spif-compile) — spec §3 P1.
# STRICTLY non-privileged (task-8 brief): the ONLY deps allowed here are
# maknae-proto, maknae-vault, maknae-config, clap, tokio — no maknae-mcp either
# (Task 9's isolation gate enforces this set).
