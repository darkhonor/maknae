# SPIKE (#332) — THROWAWAY. Delete once it has answered its one question.
#
# Question: do GitHub's macOS runners attach com.apple.provenance to files they
# write, and does pkgbuild therefore serialise AppleDouble `._name` siblings into
# the payload BOM?
#
# Why it exists: every other context measured on the maintainer's host TAGS —
# Terminal.app included, in every location tried. The ONLY context proven clean
# is a launchd-spawned process, and a CI runner job is launchd-hosted, so CI is
# expected to be clean. EXPECTED IS NOT MEASURED: that same inference said
# "Terminal.app is Apple-signed, therefore clean", and it was false.
#
# NO SECRETS. pkgbuild is unsigned by default; nothing here signs or notarizes.
#
# This job OBSERVES. It prints a VERDICT line and exits 0 either way, because a
# red job here would mean "the spike ran", not "the repo is broken".
name: spike-332-provenance
on:
  push:
    branches: [fix/332-payload-xattr-clean]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    # Pinned to the same NAMED image ci.yml uses, deliberately not macos-latest:
    # the runner IS the evidence here, so it must not re-point underneath us.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Context — who is responsible for this shell, and where are we
        run: |
          echo "TMPDIR=${TMPDIR:-<unset>}"
          echo "uname: $(uname -a)"
          echo "--- process lineage ---"
          pid=$$
          while [ "$pid" -gt 1 ]; do
            echo "    $(ps -o comm= -p $pid)"
            pid=$(ps -o ppid= -p $pid | tr -d ' ')
          done
          echo "--- SIP ---"; csrutil status || true

      - name: Do files this runner writes carry extended attributes?
        run: |
          v() { a="$(xattr "$2" 2>/dev/null | tr '\n' ' ')"; \
                if [ -z "$a" ]; then printf '  %-38s CLEAN\n' "$1"; \
                else printf '  %-38s %s val=%s\n' "$1" "$a" \
                     "$(xattr -px com.apple.provenance "$2" 2>/dev/null | tr -d ' \n')"; fi; }
          T="$(mktemp -d)"
          touch "$T/a";        v "touch (in mktemp -d)"        "$T/a"
          : > "$T/b";          v "shell redirect >"            "$T/b"
          mkdir "$T/d";        v "mkdir"                       "$T/d"
          install -d "$T/i/u/l/b"; v "install -d (leaf)"       "$T/i/u/l/b"
                               v "install -d (intermediate)"   "$T/i/u"
                               v "mktemp -d root itself"       "$T"
          touch /tmp/mk332ci;  v "touch /tmp"                  /tmp/mk332ci
          v "a CHECKED-OUT repo file (README.md)" "$GITHUB_WORKSPACE/README.md"
          v "a CHECKED-OUT repo file (authz.yaml)" "$GITHUB_WORKSPACE/packaging/common/authz.yaml"

      - name: The 5-second repro — does the BOM carry `._` entries
        run: |
          set -eu
          W="$(mktemp -d)"; cd "$W"
          install -d root/usr/local/bin
          printf '#!/bin/sh\necho hi\n' > root/usr/local/bin/tool
          chmod 755 root/usr/local/bin/tool
          echo "--- xattrs across the payload, before pkgbuild ---"
          xattr -r -l root || true
          echo "  (nothing between the dashes = no extended attributes anywhere)"
          echo "--- pkgbuild ---"
          pkgbuild --root root --identifier io.maknae.spike332 --version 1.0 \
                   --install-location / out.pkg
          pkgutil --expand out.pkg exp
          echo "--- BOM ---"
          lsbom -s exp/Bom
          n="$(lsbom -s exp/Bom | grep -c '/\._' || true)"
          echo
          echo "AppleDouble rows in BOM: $n"
          if [ "$n" -eq 0 ]; then
            echo "VERDICT: CLEAN — this runner does not tag, and pkgbuild emits no AppleDouble entries."
          else
            echo "VERDICT: TAGGED — $n AppleDouble rows. CI is NOT a clean packaging context."
          fi

      - name: Run the real gate against a runner-written payload
        run: |
          W="$(mktemp -d)"
          install -d "$W/usr/local/bin"
          printf '#!/bin/sh\n' > "$W/usr/local/bin/tool"
          echo "--- ci/gates/payload-xattr-clean.sh against a payload this runner built ---"
          if ./ci/gates/payload-xattr-clean.sh "$W"; then
            echo "GATE VERDICT: ACCEPTS a runner-built payload."
          else
            echo "GATE VERDICT: REFUSES a runner-built payload (exit $?)."
          fi
