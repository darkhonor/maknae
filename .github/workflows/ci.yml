name: ci
# Least privilege for every job; nothing here writes to the repo.
permissions:
  contents: read

on:
  pull_request:
    # `labeled` is what makes the mutation lane's `run-mutants` opt-in reachable
    # without a push (codex review 2026-09-07); the other three are GitHub's defaults.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

# Supersede-and-cancel, PR branches only: a new push to a PR's ref cancels that
# ref's still-running CI. Without it every intermediate push runs to completion —
# 8 runs x ~23 min of `build-and-gate` accumulated on a single branch on
# 2026-08-22 and exhausted the monthly Actions budget.
#
# `main` pushes deliberately get a per-RUN group, not the shared per-ref one.
# Corrected 2026-08-25: `cancel-in-progress: false` alone is NOT main-safe, which
# is what an earlier revision of this block assumed. It only protects the run
# already executing; Actions still permits exactly one PENDING run per group, so
# a third `main` push arriving inside a ~23 min window displaces the second one's
# queued run and that commit is never validated at all. Keying `push` runs by
# `github.run_id` gives each its own group, so a `main` run can neither be
# queued behind nor displaced by another: every commit that lands on the default
# branch gets a distinct classified run, which is what the branch-protection evidence chain
# is relying on. PR supersession is unaffected — those still share a per-ref group.
concurrency:
  # A `labeled` event gets its OWN group: it must never cancel a push-triggered
  # PR run (codex review round 2, 2026-09-07).
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

# MUTANTS_PATHS: retained as the drift-checked inventory, verified by
# ci/gates/coverage-tiers.sh against coverage-tiers.toml's mutants_crates
# (drift = gate FAIL). Comma-separated repo-relative crate dirs. Do not add a
# second MUTANTS_PATHS: line anywhere in this file (multi-match = hard FAIL).
# The authorization seam (maknae-security) is the in-tree security-critical crate
# carrying the mutation obligation (ADR-0016 T1, zero missed).
# There is no macOS crate list here (#198). `ci/gates/darwin-cross-check.sh`
# checks EVERY workspace member for aarch64-apple-darwin, one at a time, and
# reports which ones the runner cannot build (an SDK crate's build script).
# It used to be `DARWIN_CRATES`, a hand-written seven whose own comment
# admitted it was "NOT gate-verified against any manifest"; seventeen check
# clean, so ten crates -- `maknae-authz-basic` among them -- were compiled for
# macOS by nothing. Same defect class as #74's clippy list, same cure.
env:
  MUTANTS_PATHS: "crates/maknae-config,crates/maknae-security,crates/maknae-io,crates/maknae-kernel,crates/maknae-vault,crates/maknae-proto,crates/maknae-audit-append,crates/maknae-msgs,crates/maknae-authz-basic,crates/maknae-classification-aus"

jobs:
  affected:
    # A `labeled` event runs this selector only for the `run-mutants` label; any
    # other label is a no-op run (nothing below it fires).
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'run-mutants' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.select.outputs.build }}
      mutants: ${{ steps.select.outputs.mutants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: External-authority lint (#34 — no Maknae rule rests on a foreign ADR)
        run: ci/gates/external-authority-lint.sh
      - name: Isolation-contract lint (also required for documentation-only changes)
        run: ci/gates/isolation-contract-lint.sh
      - name: Selector fixtures (including negative cases)
        run: python3 -m unittest discover -s ci/tests -v
      - name: Select affected packages
        id: select
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # #198: no `--darwin` list any more. Both darwin jobs run whenever
          # Rust is affected (`build`); the cross-check gate checks every member
          # itself and lets cargo say which are SDK-blocked from the runner.
          python3 ci/affected.py --base="$BASE" --head="$HEAD" --event="$EVENT" --github-output "$GITHUB_OUTPUT"

  build-and-gate:
    needs: affected
    # Propagate lightweight-job failure into the required check before any Rust build.
    # Never on a `labeled` event: labels reach the mutation lane only.
    if: ${{ always() && github.event.action != 'labeled' && (needs.affected.result != 'success' || needs.affected.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    # A blocking open(2) on a FIFO is a real failure mode in maknae-io; without
    # this a regression burns the 360-minute default and emits no diagnostic.
    timeout-minutes: 40  # negative-control's real-repo darwin probe runs one per-pass cold cross-check (#198): 116 s measured on Rocky 9 x86_64, ~2.5 min on Apple Silicon; plus ~75 fixture probes
    env:
      # Exact versions from the passing #235 merge run. Floating installs made
      # cold and cached runs use different tools; every pin participates in its
      # executable-only cache key. No coverage reports or test outcomes cached.
      CARGO_DENY_VERSION: "0.19.9"
      CARGO_AUDITABLE_VERSION: "0.7.5"
      RUST_AUDIT_INFO_VERSION: "0.5.4"
      CARGO_LLVM_COV_VERSION: "0.8.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require successful lightweight gates and selection
        env:
          SELECTOR_RESULT: ${{ needs.affected.result }}
        run: test "$SELECTOR_RESULT" = success
      - name: Install toolchain (pinned)
        run: rustup show   # honors rust-toolchain.toml
      - name: Add the darwin target (negative-control probes the darwin cross-check gate, #198)
        run: rustup target add aarch64-apple-darwin
      - name: Cache gate-tool executables
        id: gate-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-auditable
            ~/.cargo/bin/rust-audit-info
          key: gate-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-deny-${{ env.CARGO_DENY_VERSION }}-auditable-${{ env.CARGO_AUDITABLE_VERSION }}-audit-info-${{ env.RUST_AUDIT_INFO_VERSION }}
      - name: Install gate tooling (BEFORE the auditable builds that need it)
        if: steps.gate-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo install cargo-auditable --version "$CARGO_AUDITABLE_VERSION" --locked
          cargo install rust-audit-info --version "$RUST_AUDIT_INFO_VERSION" --locked
      - name: fmt
        run: cargo fmt --all --check
      - name: Panic strategy must be unwind (maknae-config catch_unwind boundary depends on it)
        run: |
          if grep -rEln 'panic[[:space:]]*=[[:space:]]*["'\'']abort["'\'']' Cargo.toml crates/*/Cargo.toml bins/*/Cargo.toml .cargo/config.toml 2>/dev/null; then
            echo "ERROR: a manifest sets panic = \"abort\"; maknae-config's fail-closed parse boundary requires unwind"; exit 1
          fi
      # #74: the package set is DERIVED from `cargo metadata`, not listed here.
      # The old hand-written loop named 13 of 21 workspace members, and a copy of
      # the same list lived in CONTRIBUTING.md. MEASURED, because the first
      # version of this comment overstated it: `cargo clippy -p X` DOES lint X's
      # workspace path dependencies under `-D warnings`, so the eight unnamed
      # members' libs were reached incidentally. What went unlinted is their TEST
      # TARGETS -- `--all-targets` applies only to SELECTED packages -- and of the
      # eight only `maknae-plane` has any test code. Deriving the set means a new
      # crate, and its tests, are linted automatically.
      - name: clippy (every workspace crate, all targets, one pass per declared feature)
        run: bash ci/gates/clippy-all.sh
      - name: Per-package release builds (single-package AUDITABLE — spec §3/§6)
        run: |
          for p in maknaed maknae maknae-spifc; do cargo auditable build --locked -p "$p" --release; done
      - name: Tests (workspace test IS permitted; does NOT establish isolation)
        run: cargo test --locked --workspace
      - name: cargo-deny
        run: cargo deny --locked check
      - name: P1 manifest lint
        run: ci/gates/p1-manifest-lint.sh
      - name: P2 invert-tree witness
        run: ci/gates/p2-invert-tree.sh
      - name: P2 artifact witness
        run: ci/gates/p2-artifact-witness.sh
      - name: Build-invocation lint
        run: ci/gates/build-invocation-lint.sh
      - name: Feature-resolution pin (production stays featureless on the authz door)
        run: ci/gates/feature-resolution-pin.sh
      - name: Negative-control (gates must fire)
        run: ci/gates/negative-control.sh
      - name: Direct std::fs production drift is forbidden
        run: ci/gates/std-fs-drift.sh .
      - name: Gate — verb-vocabulary drift (#67)
        run: ci/gates/verb-vocabulary-drift.sh
      - name: Mutation lane status (paused by default — operator ruling 2026-09-07)
        run: echo "mutation lane paused in hosted CI; opt in with the run-mutants label or vars.MUTATION_IN_CI=true; the zero-missed evidence is in the PR body"
      - name: Gate — config-disclosure drift (#162)
        run: ci/gates/config-disclosure-drift.sh
      - name: Gate — authz composition drift (ADR-0008 decision 1; #154/#148)
        run: ci/gates/authz-composition-drift.sh
      - name: Coverage toolchain component (also required on cache hits)
        run: rustup component add llvm-tools
      - name: Cache coverage-tool executable
        id: coverage-tool-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Install coverage tooling (pinned)
        if: steps.coverage-tool-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - name: Coverage-tiers fixture suite (gate proven to fire, all modes)
        run: ci/gates/tests/coverage-tiers/run.sh
      - name: Coverage-tiers gate (live; CI is the lane of record)
        run: bash ci/gates/coverage-tiers.sh --root .
      - name: Upload coverage evidence (SA-11 artifact; exists for red runs too)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-json
          path: target/coverage.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # MUTATION LANE: wired, paused by default. See the job's `if:` below.
  # ---------------------------------------------------------------------------
  mutation:
    needs: affected
    # PAUSED BY DEFAULT — operator ruling 2026-09-07 (hosted minutes are the
    # operator's personal account). The lane stays WIRED (hobibot, PR #247): it
    # runs only when a PR carries the `run-mutants` label or the repository
    # variable MUTATION_IN_CI is 'true'; otherwise it shows as SKIPPED in every
    # run, and build-and-gate prints the pause. The zero-missed obligation is
    # met locally (dev host + Rocky lane) and reported in the PR body.
    if: >-
      ${{ always()
          && (needs.affected.result != 'success' || needs.affected.outputs.mutants != '')
          && ((github.event.action == 'labeled' && github.event.label.name == 'run-mutants')
              || (github.event.action != 'labeled' && (contains(github.event.pull_request.labels.*.name, 'run-mutants') || vars.MUTATION_IN_CI == 'true'))) }}
    runs-on: ubuntu-latest
    # #238, run 34053713105: all nine completed crate sweeps passed, but the
    # 35m job limit killed the final (Vault) sweep after its 143s cold build.
    # Kernel alone took 15m on CI versus 6m on the warm local host. Budget the
    # hosted cold run with headroom; normal changes still select affected crates
    # and individual mutant timeouts/zero-missed requirements remain unchanged.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a trustworthy selection
        env:
          SELECTOR_RESULT: ${{ needs.affected.result }}
        run: test "$SELECTOR_RESULT" = success
      - name: Install toolchain (pinned)
        run: rustup show
      - name: Cache cargo-mutants executable
        id: mutants-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-27.1.0
      - name: Install cargo-mutants 27.1.0
        if: steps.mutants-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Native syscall mutation filter fixtures
        if: contains(format(' {0} ', needs.affected.outputs.mutants), ' maknae-io ')
        run: python3 ci/gates/tests/mutation-platform/run.py
      - name: Mutation gate (whole crates; zero missed; TIMEOUT = investigate)
        env:
          PACKAGES: ${{ needs.affected.outputs.mutants }}
          # Mutation evidence needs test assertions, not debugger symbols. #238
          # exceeded this job's 35m budget; two representative kernel mutant
          # rebuilds on Rocky9 fell from 7.08s to 2.46s without symbols. Keep the
          # normal test profile's assertions/overflow checks and all gate scope.
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          test -n "$PACKAGES"
          read -r -a packages <<< "$PACKAGES"
          bash ci/gates/coverage-tiers.sh --root . --mutants "${packages[@]}"

  # macOS is a DEPLOYMENT TARGET (packaging/isolation-contract.md). These two jobs
  # are the only automated macOS coverage that exists; neither substitutes for the
  # other, and both are honestly narrower than the platform.

  darwin-cross:
    needs: affected
    if: ${{ always() && github.event.action != 'labeled' && (needs.affected.result != 'success' || needs.affected.outputs.build == 'true') }}
    # Free, no Mac required, and it pays for itself: adding this locally caught
    # `RecvFlags::CMSG_CLOEXEC` not existing on darwin, which meant
    # maknae-io::recv_delegated did not compile there AT ALL. Off Linux a received
    # descriptor arrives without close-on-exec and FD_CLOEXEC must be set
    # explicitly — a security-relevant delta a Linux-only CI cannot see.
    #
    # #198: the gate checks EVERY member, one at a time, and lets cargo say
    # which are SDK-blocked from a Linux runner (a build-script failure inside
    # aws-lc-sys / aws-lc-fips-sys / ring — and only that). Seventeen check,
    # four are reported blocked by name. `negative-control` proves it fires.
    runs-on: ubuntu-latest
    timeout-minutes: 30  # per-pass cold cache: 116 s measured on Rocky 9 x86_64 (17 members + 2 feature passes), ~2.5 min on Apple Silicon (#198)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain (pinned)
        run: rustup show
      - name: Add supported darwin target
        run: rustup target add aarch64-apple-darwin
      - name: Cross-compile check (Apple Silicon) — every member, cargo decides what the runner can build
        run: bash ci/gates/darwin-cross-check.sh

  darwin-native:
    needs: affected
    if: ${{ always() && github.event.action != 'labeled' && (needs.affected.result != 'success' || needs.affected.outputs.build == 'true') }}
    # Runs whenever Rust is affected; docs-only changes skip it. Keyed on
    # `build`, not `darwin`: this job tests the WHOLE workspace, so a change to
    # an SDK-blocked crate (maknae-vault, maknae-kernel, the bins) must trigger
    # it even though those crates are outside the cross-check set.
    #
    # Corrected 2026-09-11 (#198): this said "private-repo minute budget". The
    # repo is public, and GitHub's billing doc is explicit that standard hosted
    # runners — macOS included — are free on public repositories (only "larger
    # runners" are always charged; macos-26 is standard). So the SDK crates are
    # tested here too: the runner has the SDK, and nothing else verifies the
    # FIPS crates for macOS.
    #
    # A cross-compile check proves the code BUILDS for macOS. This proves it
    # WORKS there — the difference that turns ADR-0009's F_GETPATH lane from
    # written into verified.
    # Pinned to a NAMED image, deliberately not `macos-latest`. macOS is a
    # deployment target, so the runner is part of the evidence: `macos-latest`
    # silently re-points as images roll, which would change what "verified on
    # macOS" means without any commit saying so. Operator-selected image:
    # https://github.com/actions/runner-images/releases/tag/macos-26/20260729.0423
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install toolchain (pinned)
        run: rustup show
      # aws-lc-fips-sys builds the FIPS module with cmake AND Go (its build
      # script runs aws-lc's `cmake/go.cmake`); the macos-26 image ships cmake
      # but no Go on PATH, and the first whole-workspace run died on exactly
      # that: "CMake Error at aws-lc/cmake/go.cmake:6: Could not find Go".
      # The seven SDK-free crates this lane used to test never needed it. Go
      # here only drives aws-lc's build-time tooling (delocate), but this is a
      # FIPS build lane and everything else on it is pinned, so the Go payload
      # is pinned to an exact release too: go1.27.1, the latest stable on
      # go.dev/dl on 2026-09-11 (review finding on PR #282: `stable` would
      # have downloaded whatever release that name meant on the day, so cold
      # and cached runs could attest different tooling). Bump deliberately.
      - name: Install Go (aws-lc-fips-sys builds the FIPS module with cmake + go)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Test the whole workspace natively (SDK crates included)
        run: |
          set -euo pipefail
          # #222: make the unified-log round-trip a HARD FAILURE here rather
          # than a skip. The macos runner user is admin and can read
          # /var/db/diagnostics, so the skip branch is dead on CI -- which means
          # a soft default would let this lane go green with zero round-trip
          # evidence (the #219 ok-on-nothing class one level up).
          MAKNAE_AUDIT_REQUIRE_UNIFIED_LOG=1 cargo test --locked --workspace
      - name: Confirm the F_GETPATH lane actually ran
        # The delegated suite is the macOS control for ADR-0009: on Linux it
        # exercises /proc/self/fd, here it exercises fcntl(F_GETPATH). A green
        # workspace that silently skipped it would prove nothing, so assert the
        # tests were collected rather than trusting the exit code.
        run: |
          set -euo pipefail
          out="$(cargo test --locked -p maknae-io --lib delegated -- --list)"
          printf '%s\n' "$out"
          n="$(printf '%s\n' "$out" | grep -c ': test$' || true)"
          [ "$n" -ge 15 ] || { echo "FAIL: expected the delegated suite, saw $n tests"; exit 1; }
          echo "delegated suite present on macOS: $n tests"
