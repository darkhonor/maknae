name: ci
on:
  pull_request:
  push:
    branches: [main]

# MUTANTS_PATHS: consumed by the mutation job's change gate AND verified by
# ci/gates/coverage-tiers.sh against coverage-tiers.toml's mutants_crates
# (drift = gate FAIL). Comma-separated repo-relative crate dirs. Do not add a
# second MUTANTS_PATHS: line anywhere in this file (multi-match = hard FAIL).
# The authorization seam (maknae-security) is the in-tree security-critical crate
# carrying the mutation obligation (ADR-0016 T1, zero missed).
env:
  MUTANTS_PATHS: "crates/maknae-config,crates/maknae-security,crates/maknae-kernel"

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (pinned)
        run: rustup show   # honors rust-toolchain.toml
      - name: Install gate tooling (BEFORE the auditable builds that need it)
        run: |
          cargo install cargo-deny --version "^0.19" --locked
          cargo install cargo-auditable --locked
          cargo install rust-audit-info --locked
      - name: fmt
        run: cargo fmt --all --check
      - name: Panic strategy must be unwind (maknae-config catch_unwind boundary depends on it)
        run: |
          if grep -rEln 'panic[[:space:]]*=[[:space:]]*["'\'']abort["'\'']' Cargo.toml crates/*/Cargo.toml bins/*/Cargo.toml .cargo/config.toml 2>/dev/null; then
            echo "ERROR: a manifest sets panic = \"abort\"; maknae-config's fail-closed parse boundary requires unwind"; exit 1
          fi
      - name: clippy (per-package, bins + lib crates, all targets incl. tests)
        run: |
          for p in maknaed maknae maknae-spifc maknae-security maknae-config maknae-kernel; do cargo clippy -p "$p" --all-targets -- -D warnings; done
      - name: Per-package release builds (single-package AUDITABLE — spec §3/§6)
        run: |
          for p in maknaed maknae maknae-spifc; do cargo auditable build -p "$p" --release; done
      - name: Tests (workspace test IS permitted; does NOT establish isolation)
        run: cargo test --workspace
      - name: cargo-deny
        run: cargo deny check
      - name: P1 manifest lint
        run: ci/gates/p1-manifest-lint.sh
      - name: P2 invert-tree witness
        run: ci/gates/p2-invert-tree.sh
      - name: P2 artifact witness
        run: ci/gates/p2-artifact-witness.sh
      - name: Build-invocation lint
        run: ci/gates/build-invocation-lint.sh
      - name: Negative-control (gates must fire)
        run: ci/gates/negative-control.sh
      - name: Isolation-contract lint
        run: ci/gates/isolation-contract-lint.sh
      - name: Coverage tooling (llvm-tools + cargo-llvm-cov pinned)
        run: |
          rustup component add llvm-tools
          cargo install cargo-llvm-cov --locked --version "^0.8"
      - name: Coverage-tiers fixture suite (gate proven to fire, all modes)
        run: ci/gates/tests/coverage-tiers/run.sh
      - name: Coverage-tiers gate (live; CI is the lane of record)
        run: bash ci/gates/coverage-tiers.sh --root .
      - name: Upload coverage evidence (SA-11 artifact; exists for red runs too)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: target/coverage.json
          if-no-files-found: warn

  mutation:
    # Change-gated, required-check-safe: always starts; SKIPs unless a
    # security-critical crate (MUTANTS_PATHS) changed; runs UNCONDITIONALLY on
    # push (push = main by the trigger set — if the trigger set ever widens,
    # revisit the base resolution here).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Change gate
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=1" >>"$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          run=0
          IFS=',' read -r -a paths <<<"$MUTANTS_PATHS"
          for p in "${paths[@]}"; do
            p="$(printf '%s' "$p" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            if printf '%s\n' "$changed" | grep -Eq "^${p}(/|$)"; then run=1; fi
          done
          if [ "$run" = "0" ]; then echo "SKIP: no mutants_crates paths changed"; fi
          echo "run=$run" >>"$GITHUB_OUTPUT"
      - name: Install toolchain (pinned)
        if: steps.gate.outputs.run == '1'
        run: rustup show
      - name: Install cargo-mutants
        if: steps.gate.outputs.run == '1'
        run: cargo install cargo-mutants --locked
      - name: Mutation gate (zero missed; TIMEOUT = investigate)
        if: steps.gate.outputs.run == '1'
        run: bash ci/gates/coverage-tiers.sh --root . --mutants-all
