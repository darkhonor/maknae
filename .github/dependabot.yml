version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Every pin in Cargo.toml records the failure it prevents (AGENTS.md); a
    # Dependabot bump must keep that comment true or be closed.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
