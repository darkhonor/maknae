# cargo-deny >= 0.19 required — the scope-valued `unmaintained = "all"` is rejected by 0.17.x
# (validated against 0.19.8; CI pins ^0.19 to match).
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
unmaintained = "all"          # spec §5/§6: escalate archived/unmaintained deps to error, incl. transitive
yanked = "deny"
unsound = "all"

[bans]
multiple-versions = "warn"
# Every TLS leg runs on crypto-profile-awslc4's provider over the AWS-LC FIPS
# module (ADR-0025, ADR-0030, ADR-0031). `ring` and the OpenSSL path are banned
# outright. The cryptographic libraries are reached only through
# crypto-profile-awslc4, and it only through maknae-crypto; the other wrappers
# are the third-party crates that depend on them today. tokio-rustls re-exports
# rustls, so it is confined to maknae-vault the same way. `aws-lc-sys` is pulled
# by aws-lc-rs itself and is not banned.
deny = [
  { name = "native-tls" },
  { name = "openssl-sys" },
  { name = "ring" },
  { name = "crypto-profile-awslc3" },
  { name = "crypto-profile-awslc4", wrappers = ["maknae-crypto"] },
  { name = "aws-lc-rs", wrappers = ["crypto-profile-awslc4", "rcgen"] },
  { name = "rustls", wrappers = ["crypto-profile-awslc4", "hyper-rustls", "reqwest", "rustls-platform-verifier", "tokio-rustls"] },
  { name = "tokio-rustls", wrappers = ["maknae-vault", "hyper-rustls", "reqwest"] },
  { name = "rcgen", wrappers = ["crypto-profile-awslc4"] },
]

# reqwest's own TLS features install a stock provider; rustls-no-provider leaves it to maknae-crypto's init().
[[bans.features]]
crate = "reqwest"
deny = ["default-tls", "rustls", "__rustls-aws-lc-rs", "native-tls", "native-tls-no-alpn"]

# rustls's built-in providers stay out of the graph, so its stock-provider
# entry points do not compile anywhere in Maknae (#581).
[[bans.features]]
crate = "rustls"
deny = ["aws_lc_rs", "aws-lc-rs", "fips", "ring"]

[[bans.features]]
crate = "rustls-webpki"
deny = ["aws-lc-rs", "aws-lc-rs-fips", "ring"]

[licenses]
# OpenSSL: AWS-LC (aws-lc-fips-sys).
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "OpenSSL"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
