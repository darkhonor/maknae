# cargo-deny >= 0.19 required — the scope-valued `unmaintained = "all"` is rejected by 0.17.x
# (validated against 0.19.8; CI pins ^0.19 to match).
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
unmaintained = "all"          # spec §5/§6: escalate archived/unmaintained deps to error, incl. transitive
yanked = "deny"
unsound = "all"

[bans]
multiple-versions = "warn"
# FIPS posture (spec §6.2): every TLS leg must be rustls-aws-lc-fips, never
# the OpenSSL path, and `ring` is banned outright (maintainer ruling
# 2026-10-27, ADR-0030): it is a second, non-FIPS crypto library, absent from
# the graph since #320, and enabling a `ring` feature on rustls or a wrapper
# would expose a stock provider no start-up assertion sees. `aws-lc-sys` is
# pulled by `aws-lc-rs` itself and is not banned. The runtime `.fips()`
# assertion is the gate on the process default.
#
# The cryptographic libraries are declared only by maknae-crypto (ADR-0030):
# each entry below refuses a direct dependency from any other workspace member.
# The other wrappers are the third-party crates that depend on them today.
# tokio-rustls re-exports rustls, so it is confined to maknae-vault the same way.
deny = [
  { name = "native-tls" },
  { name = "openssl-sys" },
  { name = "ring" },
  { name = "aws-lc-rs", wrappers = ["maknae-crypto", "rustls", "rustls-webpki", "rcgen"] },
  { name = "rustls", wrappers = ["maknae-crypto", "hyper-rustls", "reqwest", "rustls-platform-verifier", "tokio-rustls"] },
  { name = "tokio-rustls", wrappers = ["maknae-vault", "hyper-rustls", "reqwest"] },
  { name = "rcgen", wrappers = ["maknae-crypto"] },
]

# reqwest's own TLS features install a stock provider when none is set;
# `rustls-no-provider` leaves the choice to maknae-crypto's process default.
[[bans.features]]
crate = "reqwest"
deny = ["default-tls", "rustls", "__rustls-aws-lc-rs", "native-tls", "native-tls-no-alpn"]

[licenses]
# OpenSSL: AWS-LC (aws-lc-fips-sys).
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "OpenSSL"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
