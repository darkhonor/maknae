# cargo-deny >= 0.17 required (the `unmaintained` key is scope-valued, not severity-valued).
[advisories]
unmaintained = "all"          # spec §5/§6: escalate archived/unmaintained deps to error, incl. transitive
yanked = "deny"

[bans]
multiple-versions = "warn"

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
