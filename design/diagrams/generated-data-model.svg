<text x="44" y="793" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">Authorization policy — the shipped baseline</text>
<text x="44" y="809" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">Read per request from disk. `allow` and `deny` are the same shape distinguished by rule-kind; deny-overrides is applied at composition, not encoded in</text>
<text x="44" y="822" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">the data.</text>
