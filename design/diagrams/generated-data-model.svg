<text x="44" y="512" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">The ABAC four-tuple. Subject, Resource and Context are attribute BAGS, not fixed columns — which is what lets an extension key on attributes the core</text>
<text x="44" y="525" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">never declared (ADR-0004).</text>
