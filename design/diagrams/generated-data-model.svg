<svg width="1200" height="1146" viewBox="0 0 1200 1146" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Maknae data model</title>
  <desc>IDEF1X data model of the Maknae audit trail, authorization request and policy.</desc>
  <rect x="0" y="0" width="1200" height="1146" fill="#FFFFFF"/>
<text x="44" y="44" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">Data model — what Maknae records and enforces</text>
<text x="44" y="66" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">IDEF1X. Square corners are independent entities; rounded corners inherit their identity from a parent. A filled circle marks the child end;</text>
<text x="44" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">P is one-or-more, Z is zero-or-one, 1 is exactly one, blank is zero-or-more. Attributes above the rule are the primary key.</text>
<text x="44" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">Audit trail — AU-3</text>
<text x="44" y="132" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">One record per request outcome. The key is (session-id, seq), not the timestamp: two records can share a clock tick, and seq is per-session monotonic,</text>
<text x="44" y="145" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">so the pair is what orders and identifies the trail.</text>
