# One tool call, for any tool: who decides it, who launches it, what its network reaches, and what the model sees.

title = "One tool call: who decides, who launches it, what it reaches, what the model sees"
subtitle = [
  "Any tool, the same steps for a person's maknae and for maknae-agentd working a task. A task changes only the inputs: the uid, the workspace, bindings and reach, the credential.",
  "An in-kernel verb is live today; a container tool is decided first, gets its credential (generated-tool-credentials.svg) and is launched by the launch helper. Each step shows its build state, or the issue that builds it.",
]
svg_title = "Maknae tool invocation"
svg_desc = "UML sequence diagram of one tool call for any tool, each step marked live, unreachable or with the issue that builds it: the catalog and the menu, the model's invoke, an in-kernel verb decided and performed by maknaed, or a container tool decided first with a deny exit, its credential, the launch helper starting the container with the sandbox baseline, each network connection decided through maknae-proxy, and the output filtered, zeroized, recorded and released to the model."
pitch = 175
wrap_cols = 34

[[boundary]]
before = "front"
left = "the model, at its provider"
right = "untrusted · the subject's uid"
shade = false

[[boundary]]
before = "helper"
left = ""
right = "TRUST BOUNDARY — trust plane"
shade = true

[[boundary]]
before = "site"
left = ""
right = "external"
shade = false

[[participant]]
id = "model"
label = "model"
stereo = "«untrusted» never handed a delivered credential"
kind = "untrusted"

[[participant]]
id = "front"
label = "front end"
stereo = "«untrusted» maknae · maknae-agentd"
kind = "untrusted"

[[participant]]
id = "tool"
label = "tool container"
stereo = "«untrusted» the subject's uid"
kind = "untrusted"

[[participant]]
id = "helper"
label = "launch helper"
stereo = "«trusted» launch PEP · SELinux · #481"
kind = "trusted"

[[participant]]
id = "kernel"
label = "maknaed"
stereo = "«trusted» sole PDP"
kind = "trusted"

[[participant]]
id = "proxy"
label = "maknae-proxy"
stereo = "«trusted» PEP"
kind = "trusted"

[[participant]]
id = "site"
label = "site"
stereo = "«external» forge · registry · service"
kind = "external"

# --- the menu ---------------------------------------------------------------

[[step]]
id = "catalog"
from = "front"
to = "kernel"
kind = "call"
label = "tool.catalog: the subject's tools, shapes and forges"
status = "live"
evidence = "ADR-0039 decision 4 · crates/maknae-kernel/src/run.rs"
note = "maknae-agentd refetches when a TaskClaim reply's digest changes; maknae fetches on demand (maknae tools). The catalog is a hint and never authority."

[[step]]
id = "menu"
from = "front"
to = "model"
kind = "call"
label = "offer the menu: granted entries and shapes, bound values filled in"
status = "#479"
evidence = "#479 · ADR-0037 decision 5 · crates/maknae-llm/prompt/baseline-tools.json"
sees = "tool names and shapes, never a credential"
note = "Today the model is offered the six file tools and task_agent only. Every crossing to the model travels in a model turn through maknaed and egress (generated-credential-path.svg)."

[[step]]
id = "invoke"
from = "model"
to = "front"
kind = "call"
label = "invoke a tool by name with its arguments"
status = "live"
evidence = "ADR-0023 decision 4 · crates/maknae-agent/src/route.rs"
test = "crates/maknae-agent/src/route.rs::task_agent_routes_its_agent_and_prompt_and_never_prints_the_prompt"
note = "Live for the file tools and task_agent. A container tool's invoke carries an entry, a shape and slot values, never an option (#479, ADR-0036 decision 21)."

# --- an in-kernel verb: live today -------------------------------------------

[[step]]
id = "verb"
from = "front"
to = "kernel"
kind = "call"
label = "fs.read or task_agent, citing the task when there is one"
status = "live"
evidence = "ADR-0023 decision 4 · crates/maknae-agent/src/route.rs"
test = "crates/maknae-agent/src/route.rs::task_agent_routes_its_agent_and_prompt_and_never_prints_the_prompt"

[[step]]
id = "verb-decide"
from = "kernel"
to = "kernel"
kind = "self"
label = "decide and perform it: the read, or the sub-task's submission"
status = "live"
evidence = "ADR-0023 decision 4 · crates/maknae-kernel/src/run.rs"
test = "crates/maknae-kernel/tests/agent_loop.rs::a_denied_read_reaches_the_model_as_unavailable_and_is_a_deny_in_the_trail"

[[step]]
id = "verb-release"
from = "kernel"
to = "model"
kind = "reply"
label = "the content, or unavailable, in the next model turn"
status = "live"
evidence = "ADR-0023 decision 3 · crates/maknae-agent/src/drive.rs"
test = "crates/maknae-agent/src/drive.rs::an_unavailable_read_is_rendered_as_unavailable"
sees = "file content the subject may read; sensitive.yaml paths refused"

# --- a container tool ------------------------------------------------------

[[step]]
id = "request"
from = "front"
to = "kernel"
kind = "call"
label = "tool request: the call, the workspace root, the cited task"
status = "#479"
evidence = "#479 · ADR-0036 decision 1 · crates/maknae-kernel/src/tool_call.rs"
sees = "the call, no credential"
note = "A person cites no task, so no bindings or reach; an agent cites its task. Bindings on session.new for a person's own session are #479."

[[step]]
id = "resolve"
from = "kernel"
to = "kernel"
kind = "self"
label = "resolve and render; a slot or argv refusal stops before the PDP"
status = "unreachable"
evidence = "ADR-0036 decision 7 · crates/maknae-kernel/src/tool_call.rs · #479"

[[step]]
id = "decide"
from = "kernel"
to = "kernel"
kind = "self"
label = "decide tool.invoke: containment, the tools.yaml ceiling, the role, Tool grants"
status = "unreachable"
evidence = "ADR-0036 decision 7 · ADR-0037 decision 10 · crates/maknae-kernel/src/tool_call.rs · #479"
note = "The request carries maknae-security labels like every other request (ADR-0037 decision 8), so RBAC applies now and a labeling or DCS engine can plug in later (#147)."

[[step]]
id = "reach-check"
from = "kernel"
to = "kernel"
kind = "self"
label = "in a task: the shape's forge needs lie within the task's reach"
status = "#168"
evidence = "#168 · ADR-0037 decision 7"
note = "The tool-call path stamps reach.git.base and reach.git.head on the request; nothing reads them. #168 PR C adds the refusal."

[[step]]
id = "bundle-check"
from = "kernel"
to = "kernel"
kind = "self"
label = "the workspace's credential bundle ∩ what the subject holds"
status = "#479"
evidence = "#479 · ADR-0036 decision 13"

[[step]]
id = "workspace"
from = "kernel"
to = "kernel"
kind = "self"
label = "decide the workspace mount; denies become the mask set"
status = "unreachable"
evidence = "ADR-0036 decision 5 · crates/maknae-kernel/src/workspace.rs · #479"
note = "Person: current or path, never home or above. Agent: the task's own directory. Ruled 2026-11-27, not built (#479): noexec,nosuid,nodev when the entry's executes_workspace is false."

[[step]]
id = "deny"
from = "kernel"
to = "front"
kind = "reply"
label = "Deny: nothing is minted, read or launched"
status = "unreachable"
evidence = "ADR-0036 decision 7 · crates/maknae-kernel/src/tool_call.rs · #479"

[[step]]
id = "not-available"
from = "front"
to = "model"
kind = "reply"
label = "not available"
status = "#479"
evidence = "#479 · ADR-0037 decision 5"
sees = "a refusal, never why"

[[step]]
id = "credential"
from = "front"
to = "kernel"
kind = "ref"
label = "the Permit and the credential: its Permit and fetch steps"
target = "generated-tool-credentials.svg"
status = "#479"
evidence = "#479 · #168 · ADR-0036 decision 13"

[[step]]
id = "launch"
from = "front"
to = "helper"
kind = "call"
label = "launch: the kernel-signed obligation and the credentials to place"
status = "#481"
evidence = "#481 · ADR-0036 decision 6"
note = "The helper is the only thing that talks to the runtime: rootless Podman by default; Docker or containerd by site choice; a MaknaeRuntimeClass on Kubernetes. A rootful runtime warns loudly at every start."

[[step]]
id = "start"
from = "helper"
to = "tool"
kind = "call"
label = "verify the obligation; start the container as the subject's uid"
status = "#481"
evidence = "#481 · ADR-0036 decision 4 · ADR-0036 decision 6"
note = "Read-only root, non-root, no capabilities, no-new-privileges, the runtime's default seccomp; scratch tmpfs noexec,nosuid,nodev; Landlock where the host has it."

[[step]]
id = "connect"
from = "tool"
to = "proxy"
kind = "call"
label = "CONNECT host:443 through the relay the helper runs"
status = "#566"
evidence = "#566 · ADR-0036 decision 9"
note = "The container's only route: an internal network and a relay in the rootless network namespace (measured 2026-11-18)."

[[step]]
id = "connect-decide"
from = "proxy"
to = "kernel"
kind = "call"
label = "decide this CONNECT: invocation identity, host, port"
status = "#566"
evidence = "#566 · ADR-0035 decision 5"

[[step]]
id = "connect-verdict"
from = "kernel"
to = "proxy"
kind = "reply"
label = "Permit or Deny; the connection is recorded"
status = "#566"
evidence = "#566 · ADR-0035 decision 5"

[[step]]
id = "tunnel"
from = "proxy"
to = "site"
kind = "call"
label = "tunnel; TLS end to end"
status = "#566"
evidence = "#566 · ADR-0036 decision 9"
note = "Content-blind: the proxy sees host and port only, so content checks do not run on tool traffic (#147)."

[[step]]
id = "output"
from = "tool"
to = "front"
kind = "reply"
label = "exit status and output, through the helper"
status = "#479"
evidence = "#479 · ADR-0036 decision 1"

[[step]]
id = "filter"
from = "front"
to = "front"
kind = "self"
label = "filter the output for every delivered value; on a match, withhold it and revoke"
status = "#752"
evidence = "#752 · ADR-0036 decision 14"

[[step]]
id = "zeroize"
from = "front"
to = "front"
kind = "self"
label = "zeroize every delivered value"
status = "#751"
evidence = "#751 · ADR-0036 decision 13"

[[step]]
id = "record"
from = "front"
to = "kernel"
kind = "call"
label = "record the outcome, with the filtered output"
status = "#479"
evidence = "#479 · ADR-0036 decision 1"
sees = "output, never a credential"

[[step]]
id = "release"
from = "kernel"
to = "model"
kind = "reply"
label = "the output, released in the next model turn"
status = "#479"
evidence = "#479 · ADR-0036 decision 14 · ADR-0023"
sees = "output, never a credential"
note = "The release is a kernel decision. Category detection is not built, so tool output counts as unmarked (#147)."

[[fragment]]
operator = "opt"
guard = "an in-kernel verb: no container"
first = "verb"
last = "verb-release"

[[fragment]]
operator = "opt"
guard = "a container tool"
first = "request"
last = "release"
status = "#479"
evidence = "#479 · ADR-0036 decision 1"

[[fragment]]
operator = "opt"
guard = "denied: the call ends here"
first = "deny"
last = "not-available"
status = "#479"
evidence = "#479 · ADR-0036 decision 7"

[[fragment]]
operator = "loop"
guard = "each connection the tool opens"
first = "connect"
last = "tunnel"
status = "#566"
evidence = "#566 · ADR-0036 decision 9"
