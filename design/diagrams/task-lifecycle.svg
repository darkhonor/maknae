<rect x="782" y="366" width="26" height="16" rx="3" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/><text x="795" y="378" text-anchor="middle" fill="#0F6E56">15</text>
<rect x="926" y="380" width="26" height="16" rx="3" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.8"/><text x="939" y="392" text-anchor="middle" fill="#0F6E56">15</text>
