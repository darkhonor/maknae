<svg width="1000" height="860" viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Agent task lifecycle (UML 2.5.1 state machine)</title>
  <desc>What states does an agent task pass through, from submission to collection, and what moves it between them, including hold and release? A submitted task is Queued, or Held when a containment caught it while it was stored. A claim makes it Working; a report makes it Reported; a stop, a lapsed lease, an un-enrolled agent or a withdrawn tasker makes it Closed. A drop deletes a queued task; an acknowledgement or the REPORT_HOLD expiry deletes a report or a close. A contained tasker or root holds the task from any of the four states; a contained agent holds it only from Queued or Working. A release returns a task held from Queued or Working to Queued, and one held from Reported or Closed to that state under a new report ordinal, once no cause of the hold is contained and its parent is not held. Each numbered arrow is one transition per number, keyed below as event [guard] / function.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="hold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
