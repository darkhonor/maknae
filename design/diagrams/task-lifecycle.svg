<text x="775" y="263" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Closed</text>
<rect x="300" y="420" width="400" height="56" rx="8" fill="#FBEAEA" stroke="#A32D2D" stroke-width="0.9"/>
<text x="500" y="445" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#501313">Held</text>
<text x="500" y="463" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#A32D2D">held_from records the state it was held from</text>
