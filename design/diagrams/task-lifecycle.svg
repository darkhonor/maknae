<g font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2C2C2A">
<text x="30" y="520" font-size="12.5" font-weight="600">Transitions: event [guard] / function (functions in crates/maknae-kernel/src/task.rs)</text>
<text x="30" y="542"><tspan font-weight="600">1</tspan>  initial → Queued: submit / submit_task, TaskStore::confirm</text>
<text x="30" y="560"><tspan font-weight="600">2</tspan>  initial → Held: submit [tasker, root or agent contained while stored] / TaskStore::confirm (held path)</text>
<text x="30" y="578"><tspan font-weight="600">3</tspan>  Queued → Working: claim [tasker's standing decided] / TaskStore::claim</text>
<text x="30" y="596"><tspan font-weight="600">4</tspan>  Working → Reported: report / TaskStore::report</text>
<text x="30" y="614"><tspan font-weight="600">5</tspan>  Working → Closed: stop / TaskStore::stop</text>
<text x="30" y="632"><tspan font-weight="600">6</tspan>  Working → Closed: [lease lapsed] / perform (AgentLost)</text>
<text x="30" y="650"><tspan font-weight="600">7</tspan>  Queued, Working → Closed: [agent un-enrolled] / perform (AgentGone)</text>
<text x="30" y="668"><tspan font-weight="600">8</tspan>  Queued → Closed: [tasker's authority withdrawn] / perform (Withdrawn)</text>
<text x="30" y="686"><tspan font-weight="600">9</tspan>  Queued → deleted: drop / TaskStore::drop_queued</text>
<text x="30" y="704"><tspan font-weight="600">10</tspan>  Reported, Closed → deleted: acknowledge / TaskStore::acknowledged</text>
<text x="30" y="722"><tspan font-weight="600">11</tspan>  Reported, Closed → deleted: [REPORT_HOLD elapsed] / perform (expiry)</text>
<text x="30" y="740" fill="#A32D2D"><tspan font-weight="600">12</tspan>  Live → Held, from any of the four states: [tasker or root contained] / perform → hold_durably</text>
<text x="30" y="758" fill="#A32D2D"><tspan font-weight="600">13</tspan>  Open → Held, from Queued or Working: [agent contained] / perform → hold_durably</text>
<text x="30" y="776" fill="#0F6E56"><tspan font-weight="600">14</tspan>  Held → Queued: release [no cause contained, parent not held, held from Queued or Working] / TaskStore::release</text>
<text x="30" y="794" fill="#0F6E56"><tspan font-weight="600">15</tspan>  Held → Reported, Held → Closed: release [no cause contained, parent not held, held from that state] / TaskStore::release; new rseq, report time reset</text>
</g>
<text x="30" y="824" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Red: hold, by containment. Dashed green: release, by an administrator (maknae held release). Lifting a containment releases nothing.</text>
<text x="30" y="840" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">A held task is never handed out, closed or expired. Live and Open are composite states: a transition from one leaves any state inside it.</text>
</svg>
