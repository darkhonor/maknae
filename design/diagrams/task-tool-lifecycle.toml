# An agent's task around its tool calls: bindings and reach at submission, the claim, the tool calls, the outcome and the revoke.

title = "An agent's task around its tool calls: bindings, reach, the claim, the credential's life, the outcome"
subtitle = [
  "A task is how an agent's tool calls start and end. Each call in it is the tool call a person makes (generated-tool-invocation.svg); the task adds bindings, reach, credential.",
  "Each step is marked with its build state. Submission, reach, claim and report are live; no tool call enforces the sealed reach and no task token is minted until #168 PR C and #479.",
]
svg_title = "Maknae task and tool-call lifecycle"
svg_desc = "UML sequence diagram of an agent task's life around its tool calls, each step marked live, unreachable, decided or planned: forge login, binding recognition, the sealed tasker token, intake, the reach observation in the Egress Daemon, addenda, the claim, the work, the credential's storage, re-mint and revoke, the report and the stop."
pitch = 185
wrap_cols = 36

[[boundary]]
before = "kernel"
left = "untrusted · tasker uid · agent uid"
right = "TRUST BOUNDARY — trust plane"
shade = true

[[boundary]]
before = "vault"
left = ""
right = "external"
shade = false

[[participant]]
id = "tasker"
label = "tasker CLI"
stereo = "«untrusted» maknae agent <name>"
kind = "untrusted"

[[participant]]
id = "agentd"
label = "maknae-agentd"
stereo = "«untrusted» the agent's uid"
kind = "untrusted"

[[participant]]
id = "kernel"
label = "maknaed"
stereo = "«trusted» sole PDP · task store"
kind = "trusted"

[[participant]]
id = "egress"
label = "maknae-egress"
stereo = "«trusted» deputy · reach · minter"
kind = "trusted"

[[participant]]
id = "vault"
label = "Vault"
stereo = "«external» KV · Transit"
kind = "external"

[[participant]]
id = "github"
label = "GitHub"
stereo = "«external» forge API"
kind = "external"

# --- the sequence ---------------------------------------------------------

[[step]]
from = "tasker"
to = "vault"
kind = "call"
label = "maknae forge login: store the tasker's forge token, once"
status = "live"
evidence = "ADR-0037 decision 7 · bins/maknae/src/forge.rs"
test = "bins/maknae/src/forge.rs::login_writes_wrapped_under_the_users_forge_path"
note = "A wrapped write to the tasker's own Vault subtree, with the tasker's own Vault login. The client reads no gh store."

[[step]]
from = "tasker"
to = "tasker"
kind = "self"
label = "bind from prompt links and checkout remotes; echo what was not bound"
status = "live"
evidence = "ADR-0037 decision 3 · crates/maknae-agent/src/hints.rs"
test = "crates/maknae-agent/src/hints.rs::each_link_form_binds_what_it_names"
note = "Only hosts of git forges in the subject's catalog bind. A task carries at most 8 bindings; a binding never changes after sealing."

[[step]]
from = "tasker"
to = "vault"
kind = "call"
label = "wrapped read per bound server whose forge observes reach; seal the wrapping token to egress"
status = "live"
evidence = "ADR-0037 decision 7 · bins/maknae/src/agent.rs"
test = "bins/maknae/src/agent.rs::an_expired_login_reads_no_forge_token"

[[step]]
from = "tasker"
to = "kernel"
kind = "call"
label = "TaskSubmit: prompt, bindings, sealed forge tokens"
status = "live"
evidence = "ADR-0033 · crates/maknae-loop/src/tasker.rs"
test = "crates/maknae-loop/src/tasker.rs::submit_sends_the_bindings_it_is_given"

[[step]]
from = "kernel"
to = "kernel"
kind = "self"
label = "intake: decide session.task, re-validate and seal the bindings"
status = "live"
evidence = "ADR-0037 decision 3 · crates/maknae-kernel/src/task.rs"
test = "crates/maknae-kernel/src/task.rs::a_remote_tasker_with_a_binding_is_refused"
note = "A binding's server must be a current git forge host; a sub-task's binding must equal one of its parent's."

[[step]]
from = "kernel"
to = "egress"
kind = "call"
label = "Reach frame: the bindings, the sealed tasker token, a deadline"
status = "live"
evidence = "ADR-0037 decision 7 · crates/maknae-kernel/src/reach.rs"
test = "crates/maknae-kernel/src/reach.rs::a_parent_must_hold_each_binding_and_its_reach"
note = "The kernel carries the tasker's token sealed and never opens it. Sub-tasks take the tasker side from the parent's reach."

[[step]]
from = "egress"
to = "vault"
kind = "call"
label = "open the seal, check the wrapping token's creation_path, unwrap the tasker's token"
status = "live"
evidence = "ADR-0028 · ADR-0037 decision 7 · bins/maknae-egress/src/opener.rs"
test = "crates/maknae-deputy/src/reach/open.rs::the_tasker_token_opens_only_under_its_own_path_and_server"

[[step]]
from = "egress"
to = "github"
kind = "call"
label = "tasker side: GET /repos/{base}, the change, the head repository"
status = "live"
evidence = "ADR-0037 decision 7 · crates/maknae-deputy/src/reach/drive.rs"
test = "crates/maknae-deputy/src/reach/drive.rs::a_tasker_frame_is_observed_with_the_opened_token"
note = "Every answer but 200 refuses the task, a 404 included. The tasker's token is used for this read only and never stored."

[[step]]
from = "egress"
to = "vault"
kind = "call"
label = "agent side: Transit signs the App's JWT"
status = "live"
evidence = "ADR-0038 decision 3 · bins/maknae-egress/src/minting.rs"

[[step]]
from = "egress"
to = "github"
kind = "call"
label = "the App's permissions; a metadata-read token lists the installation's repositories, then is revoked"
status = "live"
evidence = "ADR-0038 decision 3 · crates/maknae-deputy/src/reach/drive.rs"
test = "crates/maknae-deputy/src/reach/drive.rs::a_token_held_past_the_deadline_is_revoked"
note = "GET /repos is never called with an installation token: its permissions block reads all false (measured 2026-11-19)."

[[step]]
from = "egress"
to = "kernel"
kind = "reply"
label = "observations, per binding and side"
status = "live"
evidence = "ADR-0037 decision 7 · crates/maknae-kernel/src/reach.rs"

[[step]]
from = "kernel"
to = "kernel"
kind = "self"
label = "seal reach (tasker ∩ agent), sign the task, record it, queue it"
decide = [
  "ADR-0037's Owed list still says bindings, reach, recognizers and the intersection are not built; #168 PRs A and B built them, and #674 built binds: and bound-value patterns. Still owed: session.new bindings (#479), the label claim registry, the mapping from a role level to an installation-token permission set, the re-mint check and enforcing reach. Recommendation: add a dated as-built status line to ADR-0037.",
]
status = "live"
evidence = "ADR-0033 · ADR-0037 decision 7 · crates/maknae-kernel/src/task.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::a_person_submits_and_sees_the_task_queued"
note = "github-machine-user is AtHandOut today, so its reach is empty until #168 PR C observes it at hand-out. GitLab has no reach check: its tools stay refused in tasks."

[[step]]
from = "kernel"
to = "tasker"
kind = "reply"
label = "echo what was bound and its reach"
status = "live"
evidence = "ADR-0037 decision 7 · crates/maknae-kernel/src/task.rs"

[[step]]
from = "tasker"
to = "kernel"
kind = "call"
label = "TaskAdd: a signed addendum of bindings, reach observed afresh"
status = "live"
evidence = "ADR-0037 decision 2 · crates/maknae-kernel/src/task.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::an_addendum_is_sealed_signed_and_handed_to_the_agent_that_verifies_it"

[[step]]
from = "agentd"
to = "kernel"
kind = "call"
label = "TaskClaim"
decide = [
  "How is a github-machine-user credential observed at hand-out (#168 PR C)? The Egress Daemon holds no KV grant (ADR-0038 decision 5), and the agent reads its own stored token (ADR-0038 decision 2). Recommendation: a second leg after hand-out, since TaskClaim names no task and doubles as the heartbeat. Once the claim reply names the task and its bindings, maknae-agentd wrap-reads its stored token for the bound servers only and sends the sealed wrapping token in a follow-up frame that completes the hand-out, so the heartbeat stays free of credentials (D3). Egress calls GET /repos with it and maps the answer to reach operations as the tasker side is (ADR-0037 decision 7), and the kernel keeps the result as a hand-out reach record beside the signed task, which recording it does not re-sign; sub-task reach and the task view read that record too. If the leg fails or its frame never arrives, the agent side is empty and the task acts on nothing (fail closed), with no new close. This assumes a fine-grained token, whose permissions block was measured 2026-10-22; a classic token is unmeasured.",
]
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/run.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::an_agent_claims_in_fifo_order_across_taskers"
note = "Hand-out re-decides the tasker's role and the agent's taskers:, not the tasker's provider reach (ADR-0037 residual 1)."

[[step]]
from = "kernel"
to = "agentd"
kind = "reply"
label = "the signed task, its addendum, the catalog digest"
status = "live"
evidence = "ADR-0039 decision 4 · crates/maknae-kernel/src/run.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::an_agent_fetches_the_catalog_its_claim_stamped"

[[step]]
from = "agentd"
to = "kernel"
kind = "call"
label = "work the task: model turns and tool calls, each citing the task"
status = "live"
evidence = "design/diagrams/tool-invocation.toml · crates/maknae-agent/src/route.rs"
test = "crates/maknae-kernel/tests/agent_loop.rs::a_denied_read_reaches_the_model_as_unavailable_and_is_a_deny_in_the_trail"
note = "Live today for the file tools and sub-tasks. A gh, git or cargo call is the tool-call sequence (generated-tool-invocation.svg), #479."

[[step]]
from = "kernel"
to = "kernel"
kind = "self"
label = "store each minted set's for_revocation blob with the task"
status = "#168"
evidence = "#168 · ADR-0038 decision 4"
note = "Produced by the mint in the tool-call diagram (steps 11 to 13). The task store has no field for it yet. A rotation of egress's seal key strands every outstanding blob (ADR-0038 residual 2)."

[[step]]
from = "kernel"
to = "egress"
kind = "call"
label = "re-mint before expiry, re-checking the agent side of reach"
decide = [
  "When to re-mint? ADR-0038's Consequences and #168's close-out item 2 say only before expiry, and ADR-0037 decision 7 only that each re-mint re-checks the agent side; #168's slice 3 banner says once the remaining life is shorter than a call's timeout. The other candidate is a fixed margin checked on the TaskClaim heartbeat. Recommendation: the call's timeout plus the time to launch, checked at each launch, so a token outlives the call's deadline and the heartbeat carries no credential; the replaced token is revoked at once, since the agent loop runs one tool call at a time, and its blob replaced in the store.",
]
status = "#168"
evidence = "#168 · ADR-0037 decision 7"

[[step]]
from = "agentd"
to = "kernel"
kind = "call"
label = "TaskReport: the outcome"
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/run.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::a_report_needs_the_agents_own_working_task_cited"

[[step]]
from = "kernel"
to = "egress"
kind = "call"
label = "Revoke frame per stored for_revocation blob, at the task's close"
status = "#168"
decide = [
  "Which ends revoke? ADR-0038 revokes at the task's outcome. A working task ends Reported or closes Stopped, AgentGone, AgentLost (a crashed or wedged maknae-agentd) or ParentEnded, and containment moves it to Held without closing it; Dropped and Withdrawn come before hand-out, so a lazy mint has given them no token. Recommendation: every close and every move to Held replays the task's stored blobs, so each contained or abandoned task's tokens are revoked, best effort: a failed revoke, or a blob sealed before a rotation of egress's seal key, leaves its token live until it expires (ADR-0038 residual 2). A released held task mints again at its next launch.",
]
evidence = "#168 · ADR-0038 decision 4"
note = "A failed revocation is recorded as an outcome (ADR-0036 decision 13). Each mint and revoke gets an intent and outcome pair on the trail (ADR-0038 decision 10)."

[[step]]
from = "egress"
to = "github"
kind = "call"
label = "DELETE /installation/token, for a Revoke frame"
decide = [
  "ADR-0038's Owed list still names the reach check, which #168 PR B built, and the kernel's call at task claim, which the 2026-11-25 ruling moved to first launch (tool-call diagram D5); egress's mint and revoke are built, and no kernel caller sends them. Recommendation: add a dated as-built status line to ADR-0038 recording both.",
]
status = "unreachable"
evidence = "ADR-0038 decision 4 · bins/maknae-egress/src/serve.rs"
test = "bins/maknae-egress/src/serve.rs::a_revoke_frame_opens_its_blob_and_deletes_that_token"
note = "The reach driver's own metadata-read token is already revoked live, in the agent-side step above."

[[step]]
from = "tasker"
to = "kernel"
kind = "call"
label = "TaskCollect: the report"
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/run.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::collect_returns_each_report_until_acknowledged_and_never_after"

[[step]]
from = "tasker"
to = "kernel"
kind = "call"
label = "TaskStop: close the working task as Stopped"
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/task.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::a_heartbeat_after_stop_tells_the_agent_it_was_stopped"
note = "Cooperative: the agent learns of the stop at its next heartbeat and ends its loop. A stop that holds without the agent, its tool containers included, is #481."
decide = [
  "Who halts a stopped task's in-flight tool containers when maknae-agentd does not cooperate? The kernel launches no containers, and #481's banner rests such a stop on the tier beneath (ADR-0035 decision 2). Options: (a) a narrowly scoped polkit rule that lets the agent's launch helper (tool-call D8) put each task's containers in a transient system unit that maknaed may stop, which needs a grant to the agent's uid and to _maknae; (b) reopen ADR-0036 decision 1's rejected trusted launcher; (c) keep the container stop cooperative and cut off what the task holds instead: revoke its minted tokens at the stop (D4), and revoke its invocation identities, so the proxy refuses new CONNECTs and closes live tunnels (#566 requirement 7). A machine-user token is the agent's own and stays live, held behind that network cut. A compromised maknae-agentd can already run commands as the agent's uid (ADR-0036 Consequences), so ending its containers adds nothing against it; against a wedged one, (c) leaves its containers' workspace writes and resources until they exit, and lifetime.max, a launch-shape field the front end carries out, bounds only a cooperating agent. Recommendation: (c) for Rabbithole; (a) and (b) each give a uid new authority over units. Choosing (c) rereads #420's 'the stop holds whether or not the agent cooperates' and rewords #481's 'halts its loop and its containers' as cutting off the task's minted credentials and network. macOS has no equivalent under launchd: a supported-platform gap.",
]
