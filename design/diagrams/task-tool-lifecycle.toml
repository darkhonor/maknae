# An agent's task: bindings and reach at submission, the pull hand-off, the agentic loop with its optional exchanges, the outcome and the revoke.

title = "An agent's task: bindings and reach, the pull hand-off, the agentic loop, the outcome and the revoke"
subtitle = [
  "maknaed never dials an agent: maknae-agentd polls until a task is queued for it, then works it in the agentic loop. Each tool call is the one a person makes (generated-tool-invocation.svg).",
  "When the agent's forge credential is a stored token, the kernel first asks the agent for it through forge_auth on its notice poll (#168), then sends one Reach frame that works both sides.",
  "Inside the loop, the tasker may add to the task, the agent may ask (#736), a tool call may wait for the tasker's approval (#174), and the tasker may stop it; halting its containers is #481. Each step shows its build state.",
]
svg_title = "Maknae agent task lifecycle"
svg_desc = "UML sequence diagram of an agent task, each step marked live, unreachable or with the issue that builds it: binding recognition, the sealed tasker token, intake, forge_auth on the agent's notice poll for a stored-token agent, one Reach frame per server observing both sides in the Egress Daemon, the queue, the agent's claim poll, the hand-out, the agentic loop with the tool-call sequence, the credential's storage and re-mint, the heartbeat and the optional add, ask, approval and stop exchanges, then the report, the revoke and the collect."
pitch = 195
wrap_cols = 36
precondition = "GitHub forge token in Vault at <kv_mount>/data/<user_prefix>/<you>/forges/<host>, field token: vault write -wrap-ttl=60s, or maknae forge login <host>. docs/first-provider.md U2."

[[boundary]]
before = "helper"
left = "untrusted · tasker uid · agent uid"
right = "TRUST BOUNDARY — trust plane"
shade = true

[[boundary]]
before = "vault"
left = ""
right = "external"
shade = false

[[participant]]
id = "tasker"
label = "tasker CLI"
stereo = "«untrusted» maknae agent <name>"
kind = "untrusted"

[[participant]]
id = "agentd"
label = "maknae-agentd"
stereo = "«untrusted» the agent's uid"
kind = "untrusted"

[[participant]]
id = "helper"
label = "launch helper"
stereo = "«trusted» launch PEP · SELinux · #481"
kind = "trusted"

[[participant]]
id = "kernel"
label = "maknaed"
stereo = "«trusted» sole PDP · task store"
kind = "trusted"

[[participant]]
id = "egress"
label = "maknae-egress"
stereo = "«trusted» deputy · reach · minter"
kind = "trusted"

[[participant]]
id = "vault"
label = "Vault"
stereo = "«external» KV · Transit"
kind = "external"

[[participant]]
id = "github"
label = "GitHub"
stereo = "«external» forge API"
kind = "external"

# --- the sequence ---------------------------------------------------------

[[step]]
id = "bind"
from = "tasker"
to = "tasker"
kind = "self"
label = "bind from prompt links and checkout remotes; echo what was not bound"
status = "live"
evidence = "ADR-0037 decision 3 · crates/maknae-agent/src/hints.rs"
test = "crates/maknae-agent/src/hints.rs::each_link_form_binds_what_it_names"
note = "Only hosts of git forges in the subject's catalog bind. A task carries at most 8 bindings; a binding never changes after sealing."

[[step]]
id = "wrapped-read"
from = "tasker"
to = "vault"
kind = "call"
label = "wrapped read per bound server whose forge observes reach; seal the wrapping token to egress"
status = "live"
evidence = "ADR-0037 decision 7 · bins/maknae/src/agent.rs"
test = "bins/maknae/src/agent.rs::an_expired_login_reads_no_forge_token"

[[step]]
id = "submit"
from = "tasker"
to = "kernel"
kind = "call"
label = "TaskSubmit: prompt, bindings, sealed forge tokens"
status = "live"
evidence = "ADR-0033 · crates/maknae-loop/src/tasker.rs"
test = "crates/maknae-loop/src/tasker.rs::submit_sends_the_bindings_it_is_given"

[[step]]
id = "intake"
from = "kernel"
to = "kernel"
kind = "self"
label = "intake: decide session.task, re-validate and seal the bindings"
status = "live"
evidence = "ADR-0037 decision 3 · crates/maknae-kernel/src/task.rs"
test = "crates/maknae-kernel/src/task.rs::a_remote_tasker_with_a_binding_is_refused"
note = "A binding's server must be a current git forge host; a sub-task's binding must equal one of its parent's."

[[step]]
id = "queue-forge-auth"
from = "kernel"
to = "kernel"
kind = "self"
label = "queue forge_auth for the agent: a nonce and the forge servers"
status = "#168"
evidence = "#168 · ADR-0037 decision 7"
note = "No credential is carried. At most 8 outstanding per agent. The wait takes no reach permit."

[[step]]
id = "notice-poll"
from = "agentd"
to = "kernel"
kind = "call"
label = "notice poll on control.sock, every 5 s"
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/control.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::a_working_task_whose_loop_is_stalled_lapses_agent_lost_while_notice_polls_continue"
note = "Control requests only, on the control socket. It never renews the claim lease; the heartbeat still does, so a wedged loop lapses."

[[step]]
id = "forge-auth"
from = "kernel"
to = "agentd"
kind = "reply"
label = "forge_auth: the nonce and the forge servers"
status = "#168"
evidence = "#168 · ADR-0033"

[[step]]
id = "agent-wrapped-read"
from = "agentd"
to = "vault"
kind = "call"
label = "wrapped read of its own stored token per named server; seal each wrapping token to egress"
status = "#168"
evidence = "#168 · ADR-0037 decision 7"
note = "At <kv_mount>/data/<agent_prefix>/<id>/forges/<host>, field token. The seal binds the nonce."

[[step]]
id = "forge-auth-answer"
from = "agentd"
to = "kernel"
kind = "call"
label = "forge_auth answer: per server, a sealed token, no token, or read refused"
status = "#168"
evidence = "#168 · ADR-0037 decision 7"

[[step]]
id = "unanswered"
from = "kernel"
to = "tasker"
kind = "reply"
label = "refused: AgentUnanswered, naming the agent"
status = "#168"
evidence = "#168 · ADR-0033"
note = "Only after the full 10 s; a shorter wait gives the reach refusal. Nothing is stored. The CLI offers retry or another agent; for an /add, retry."

[[step]]
id = "reach-frame"
from = "kernel"
to = "egress"
kind = "call"
label = "Reach frame: the bindings, the sealed tasker token, a deadline"
status = "live"
evidence = "ADR-0037 decision 7 · crates/maknae-kernel/src/reach.rs"
test = "crates/maknae-kernel/src/reach.rs::a_parent_must_hold_each_binding_and_its_reach"
note = "The kernel carries the tasker's token sealed and never opens it. Sub-tasks take the tasker side from the parent's reach. Ruled 2026-11-26, not built (#168): the same frame carries the agent's sealed tokens."

[[step]]
id = "unwrap"
from = "egress"
to = "vault"
kind = "call"
label = "open the seal, check the wrapping token's creation_path, unwrap the tasker's token"
status = "live"
evidence = "ADR-0028 · ADR-0037 decision 7 · bins/maknae-egress/src/opener.rs"
test = "crates/maknae-deputy/src/reach/open.rs::the_tasker_token_opens_only_under_its_own_path_and_server"

[[step]]
id = "tasker-side"
from = "egress"
to = "github"
kind = "call"
label = "tasker side: GET /repos/{base}, the change, the head repository"
status = "live"
evidence = "ADR-0037 decision 7 · crates/maknae-deputy/src/reach/drive.rs"
test = "crates/maknae-deputy/src/reach/drive.rs::a_tasker_frame_is_observed_with_the_opened_token"
note = "Every answer but 200 refuses the task, a 404 included. The tasker's token is used for this read only and never stored."

[[step]]
id = "transit-sign"
from = "egress"
to = "vault"
kind = "call"
label = "agent side: Transit signs the App's JWT"
status = "live"
evidence = "ADR-0038 decision 3 · bins/maknae-egress/src/minting.rs"

[[step]]
id = "agent-side"
from = "egress"
to = "github"
kind = "call"
label = "the App's permissions; a metadata-read token lists the installation's repositories, then is revoked"
status = "live"
evidence = "ADR-0038 decision 3 · crates/maknae-deputy/src/reach/drive.rs"
test = "crates/maknae-deputy/src/reach/drive.rs::a_token_held_past_the_deadline_is_revoked"
note = "GET /repos is never called with an installation token: its permissions block reads all false (measured 2026-11-19)."

[[step]]
id = "agent-unwrap"
from = "egress"
to = "vault"
kind = "call"
label = "open the agent's seal, check the purpose, nonce and creation_path, unwrap its token"
status = "#168"
evidence = "#168 · ADR-0037 decision 7"

[[step]]
id = "agent-observe"
from = "egress"
to = "github"
kind = "call"
label = "agent side: GET /repos/{base} and the head, as the machine user"
status = "#168"
evidence = "#168 · ADR-0037 decision 7"
note = "404, or 403 without rate-limit headers: empty, AgentNotCovered. 401, 429, a rate-limited 403, 5xx, a redirect or the deadline refuses."

[[step]]
id = "observations"
from = "egress"
to = "kernel"
kind = "reply"
label = "observations, per binding and side"
status = "live"
evidence = "ADR-0037 decision 7 · crates/maknae-kernel/src/reach.rs"
note = "Ruled 2026-11-26, not built (#168): egress computes the intersection and returns it with both sides."

[[step]]
id = "queue"
from = "kernel"
to = "kernel"
kind = "self"
label = "seal reach (tasker ∩ agent), sign the task, record it, queue it"
status = "live"
evidence = "ADR-0033 · ADR-0037 decision 7 · crates/maknae-kernel/src/task.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::a_person_submits_and_sees_the_task_queued"
note = "Queued in the task store; nothing is sent to the agent. GitLab tools stay refused in tasks. github-machine-user's reach is empty today (AtHandOut). Ruled 2026-11-26, not built (#168): observed through forge_auth, in the same Reach frame."

[[step]]
id = "echo"
from = "kernel"
to = "tasker"
kind = "reply"
label = "echo what was bound and its reach"
status = "live"
evidence = "ADR-0037 decision 7 · crates/maknae-kernel/src/task.rs"

[[step]]
id = "poll"
from = "agentd"
to = "kernel"
kind = "call"
label = "TaskClaim, every 5 s (POLL_EVERY)"
status = "live"
evidence = "ADR-0033 · crates/maknae-agent/src/task_driver.rs"
test = "crates/maknae-agent/src/task_driver.rs::idle_polls_every_five_seconds_and_does_nothing_else_on_idle_or_refused"

[[step]]
id = "idle"
from = "kernel"
to = "agentd"
kind = "reply"
label = "TaskIdle: nothing queued for this agent"
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/run.rs"

[[step]]
id = "claim"
from = "agentd"
to = "kernel"
kind = "call"
label = "TaskClaim that finds a queued task"
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/run.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::an_agent_claims_in_fifo_order_across_taskers"
note = "Hand-out re-decides the tasker's role and the agent's taskers:, not the tasker's provider reach (ADR-0037 residual 1)."

[[step]]
id = "hand-out"
from = "kernel"
to = "agentd"
kind = "reply"
label = "the signed task, its addendum, the catalog digest"
status = "live"
evidence = "ADR-0039 decision 4 · crates/maknae-kernel/src/run.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::an_agent_fetches_the_catalog_its_claim_stamped"

[[step]]
id = "work"
from = "agentd"
to = "github"
kind = "ref"
label = "model turns and tool calls, each citing the task"
target = "generated-tool-invocation.svg"
status = "live"
evidence = "crates/maknae-agent/src/route.rs"
test = "crates/maknae-kernel/tests/agent_loop.rs::a_denied_read_reaches_the_model_as_unavailable_and_is_a_deny_in_the_trail"
note = "Live for the file tools and sub-tasks. A tool call in a container is #479: its decision is generated-tool-invocation.svg, its credential and launch generated-tool-credentials.svg."

[[step]]
id = "store-blob"
from = "kernel"
to = "kernel"
kind = "self"
label = "store each minted set's for_revocation blob with the task"
status = "#168"
evidence = "#168 · ADR-0038 decision 4"
note = "Produced by the mint in generated-tool-credentials.svg (steps 10 to 13). The task store has no field for it yet. A rotation of egress's seal key strands every outstanding blob (ADR-0038 residual 2)."

[[step]]
id = "re-mint"
from = "kernel"
to = "egress"
kind = "call"
label = "re-mint before expiry, re-checking the agent side of reach"
status = "#168"
evidence = "#168 · ADR-0037 decision 7"
note = "Ruled 2026-11-26: at each launch, when the remaining life is under the call's timeout plus launch time; the old token is revoked at once."

[[step]]
id = "heartbeat"
from = "agentd"
to = "kernel"
kind = "call"
label = "heartbeat: TaskClaim with seen_follow_ups, every 5 min"
status = "live"
evidence = "ADR-0033 · crates/maknae-agent/src/task_driver.rs"
test = "crates/maknae-agent/src/task_driver.rs::the_heartbeat_is_sent_when_five_minutes_of_wall_time_have_passed_checked_after_every_step"
note = "Sent after a step once HEARTBEAT_EVERY has passed; it renews the 15-minute claim lease. A stop or follow-up is seen here."

[[step]]
id = "beat-reply"
from = "kernel"
to = "agentd"
kind = "reply"
label = "the follow-ups not yet seen, or the task's state"
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/task.rs"
test = "crates/maknae-agent/src/task_driver.rs::a_heartbeat_reads_only_the_follow_ups_not_yet_seen"

[[step]]
id = "add"
from = "tasker"
to = "kernel"
kind = "call"
label = "/add: TaskAdd, a follow-up, while Working"
status = "live"
evidence = "ADR-0037 decision 2 · crates/maknae-kernel/src/task.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::add_appends_a_follow_up_to_the_running_task_only"
note = "Refused once Reported. An /add with new bindings repeats steps 11 to 18 as a signed addendum, delivered on the next heartbeat. Ruled 2026-11-26, not built (#168): steps 5 to 10 first for a stored-token agent."

[[step]]
id = "ask"
from = "agentd"
to = "kernel"
kind = "call"
label = "a question: a report kind that keeps the task Working"
status = "#736"
evidence = "#736"
note = "At the agent's discretion; this is not an interactive session. The question's shape is open in #736."

[[step]]
id = "read-ask"
from = "tasker"
to = "kernel"
kind = "call"
label = "read the agent's question"
status = "#736"
evidence = "#736"

[[step]]
id = "answer"
from = "tasker"
to = "kernel"
kind = "call"
label = "answer with /add, delivered on the heartbeat"
status = "#736"
evidence = "#736"

[[step]]
id = "needs-approval"
from = "kernel"
to = "agentd"
kind = "reply"
label = "a tool call answered: approval required"
status = "#174"
evidence = "#174"
note = "The tasker may narrow what the site allows, never widen it. Matching and expiry of an approval are open in #174."

[[step]]
id = "request"
from = "agentd"
to = "kernel"
kind = "call"
label = "request_permission for that call"
status = "#174"
evidence = "#174"

[[step]]
id = "see-request"
from = "tasker"
to = "kernel"
kind = "call"
label = "see the pending request on the session's list poll"
status = "#174"
evidence = "#174"
note = "The agent never reaches the tasker; the request waits in maknaed until the tasker's session reads it."

[[step]]
id = "decide"
from = "tasker"
to = "kernel"
kind = "call"
label = "approve or deny, sent straight to maknaed"
status = "#174"
evidence = "#174"
note = "The decision never passes through the agent; the kernel still checks it against the site's authorization."

[[step]]
id = "approval"
from = "kernel"
to = "agentd"
kind = "reply"
label = "on the heartbeat reply: approval recorded, or denied"
status = "#174"
evidence = "#174"

[[step]]
id = "retry"
from = "agentd"
to = "kernel"
kind = "call"
label = "retry the call; the decision uses up the approval"
status = "#174"
evidence = "#174"

[[step]]
id = "stop"
from = "tasker"
to = "kernel"
kind = "call"
label = "TaskStop: close the working task as Stopped"
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/task.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::a_heartbeat_after_stop_tells_the_agent_it_was_stopped"
note = "The agent learns it on its next notice poll."

[[step]]
id = "stopped"
from = "kernel"
to = "agentd"
kind = "reply"
label = "on the next notice poll: Stop for the task; the step in flight is cut"
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/task.rs · crates/maknae-agent/src/task_driver.rs"
test = "crates/maknae-kernel/tests/agent_daemon.rs::a_tasker_stop_cuts_the_agents_step_within_one_poll_interval"
note = "The heartbeat reply still reports the stop, so an agent that missed every poll learns it there."

[[step]]
id = "halt"
from = "agentd"
to = "helper"
kind = "call"
label = "the cancel token asks the launch helper to stop the task: it kills the task's cgroup within N seconds"
status = "#481"
evidence = "#481"
note = "Ruled 2026-11-26 and 2026-11-27: conditions 1 to 5 end by construction, and if agentd dies the helper stops what it launched; 6, a compromised agent, is cut off by the revoke (step 44)."

[[step]]
id = "report"
from = "agentd"
to = "kernel"
kind = "call"
label = "TaskReport: the outcome"
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/run.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::a_report_needs_the_agents_own_working_task_cited"
[[step]]
id = "revoke"
from = "kernel"
to = "egress"
kind = "call"
label = "Revoke frame per stored for_revocation blob, at every close and move to Held"
status = "#168"
evidence = "#168 · ADR-0038 decision 4"
note = "Ruled 2026-11-26: every close and move to Held, best effort; the kernel caller is wired with #168 PR C. Each gets a trail intent and outcome (ADR-0038 decision 10)."

[[step]]
id = "delete"
from = "egress"
to = "github"
kind = "call"
label = "DELETE /installation/token, for a Revoke frame"
status = "unreachable"
evidence = "ADR-0038 decision 4 · bins/maknae-egress/src/serve.rs"
test = "bins/maknae-egress/src/serve.rs::a_revoke_frame_opens_its_blob_and_deletes_that_token"
note = "No kernel caller sends this until step 44 is built; an ADR-0038 as-built line follows then. The reach driver's metadata-read token is already revoked live (step 15)."
[[step]]
id = "collect"
from = "tasker"
to = "kernel"
kind = "call"
label = "TaskCollect, every 2 s with a task on screen, else 5 s"
status = "live"
evidence = "ADR-0033 · crates/maknae-kernel/src/run.rs · crates/maknae-agent/src/tasking/book.rs"
test = "crates/maknae-kernel/tests/task_loop.rs::collect_returns_each_report_until_acknowledged_and_never_after"
note = "Nothing is pushed: the open session pulls. On opening a session, it first shows what came while you were away."

[[step]]
id = "report-back"
from = "kernel"
to = "tasker"
kind = "reply"
label = "the report"
status = "live"
evidence = "crates/maknae-agent/src/tasking/book.rs"
test = "crates/maknae-agent/src/tasking/book.rs::reports_on_open_are_marked_while_you_were_away_and_acknowledged_after_display"
[[fragment]]
operator = "opt"
guard = "a side's credential is a stored token"
first = "queue-forge-auth"
last = "forge-auth-answer"
status = "#168"
evidence = "#168 · ADR-0037 decision 7"

[[fragment]]
operator = "loop"
guard = "every 5 s, in every state"
first = "notice-poll"
last = "forge-auth"

[[fragment]]
operator = "opt"
guard = "no answer within 10 s"
first = "unanswered"
last = "unanswered"
status = "#168"
evidence = "#168 · ADR-0033"

[[fragment]]
operator = "opt"
guard = "the agent's credential is a stored token"
first = "agent-unwrap"
last = "agent-observe"
status = "#168"
evidence = "#168 · ADR-0037 decision 7"

[[fragment]]
operator = "opt"
guard = "the agent's credential is a GitHub App"
first = "transit-sign"
last = "agent-side"

[[fragment]]
operator = "loop"
guard = "until a task is queued for this agent"
first = "poll"
last = "idle"

[[fragment]]
operator = "loop"
guard = "until TaskReport, or the task ends"
first = "work"
last = "halt"

[[fragment]]
operator = "opt"
guard = "the tasker adds"
first = "add"
last = "add"

[[fragment]]
operator = "opt"
guard = "the agent asks"
first = "ask"
last = "answer"
status = "#736"
evidence = "#736"

[[fragment]]
operator = "opt"
guard = "the tasker's settings say “ask me first”"
first = "needs-approval"
last = "retry"
status = "#174"
evidence = "#174"

[[fragment]]
operator = "opt"
guard = "the tasker stops"
first = "stop"
last = "halt"

[[fragment]]
operator = "loop"
guard = "while the session is open"
first = "collect"
last = "report-back"
