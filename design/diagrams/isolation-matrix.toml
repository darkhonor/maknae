# Who can read, carry or unwrap each user's credential (ADR-0028), as B. W.
# Lampson's access-control matrix. Curated, like credential-path.toml: a right
# is a property of Vault policy, OS custody and code together, readable out of
# no single manifest, so each cell names its control, the code or measurement
# that shows it, and the test that proves it where one exists.
#
# A cell carries the right the code permits today, never the intended one.
# Every (subject, object) pair has exactly one cell; generation refuses a gap.

title = "Per-user isolation — the access-control matrix for model credentials"
subtitle = [
  "Rows are subjects, columns are objects; each cell is the right the code permits, keyed to its control, evidence and test below (ADR-0028).",
  "A's key and B's key are standing objects, rated across all turns. The wrapping token, sealed blob, prompt and metadata are the objects of one of",
  "A's turns; its metadata is the user, provider, model, conversation and key path.",
]
scope = "Out of scope: root on the host and the Vault administrator, who can read everything."
svg_title = "Maknae per-user isolation matrix"
svg_desc = "Lampson access-control matrix of which subject can read, carry or unwrap each user's model credential, prompt and turn metadata, with the enforcing control for each cell."

[[subject]]
id = "cli_a"
label = "CLI as user A"

[[subject]]
id = "cli_b"
label = "CLI as user B"

[[subject]]
id = "agentd"
label = "Agent Daemon (planned, no identity)"

[[subject]]
id = "kernel"
label = "maknaed"

[[subject]]
id = "egress"
label = "Egress Daemon"

[[subject]]
id = "vault"
label = "Vault"

[[subject]]
id = "model"
label = "Model provider"

[[object]]
id = "key_a"
label = "A's key"

[[object]]
id = "key_b"
label = "B's key"

[[object]]
id = "wrap"
label = "wrapping token (A's turn)"

[[object]]
id = "sealed"
label = "sealed blob (A's turn)"

[[object]]
id = "prompt"
label = "prompt (A's turn)"

[[object]]
id = "meta"
label = "metadata (A's turn)"

[[right]]
id = "r"
glyph = "r"
meaning = "read: can obtain the plaintext"

[[right]]
id = "s"
glyph = "s"
meaning = "sealed-only: carries it, cannot read it"

[[right]]
id = "u"
glyph = "u"
meaning = "unwrap-once: obtains it only by exchanging a single-use wrapping token, for one call"

[[right]]
id = "p"
glyph = "p"
meaning = "part: reads only the fields its footnote names"

[[right]]
id = "none"
glyph = "—"
meaning = "none: cannot obtain it"

# --- CLI as user A --------------------------------------------------------

[[cell]]
subject = "cli_a"
object = "key_a"
right = "r"
control = "A's own userpass identity reads it, response-wrapped (min_wrapping_ttl), and A can unwrap that token itself: the accepted residual #429"
evidence = "bins/maknae/src/agent.rs:373 · deploy/vault-pki/main.tf:207 · ADR-0028"
test = "crates/maknae-vault/src/api_request.rs::the_wrapped_read_carries_the_user_token_and_the_wrap_ttl"

[[cell]]
subject = "cli_a"
object = "key_b"
right = "none"
control = "Vault templated policy maknae-user scopes reads to maknae/users/{{identity.entity.aliases.<accessor>.name}}, so A's login reaches only A's subtree"
evidence = "deploy/vault-pki/main.tf:207 · docs/verification-walkthrough.md (C2, measured 403)"

[[cell]]
subject = "cli_a"
object = "wrap"
right = "r"
control = "Vault returns it to A's own wrapped read; a reply carrying the key instead is refused"
evidence = "bins/maknae/src/agent.rs:373 · crates/maknae-vault/src/wrap.rs:243"
test = "crates/maknae-vault/src/wrap.rs::an_unwrapped_response_is_refused"

[[cell]]
subject = "cli_a"
object = "sealed"
right = "r"
control = "A's CLI seals it, so A already holds what it contains"
evidence = "bins/maknae/src/agent.rs:176 · crates/maknae-seal/src/seal.rs:54"
test = "bins/maknae/src/agent.rs::a_turn_reads_the_wrapped_key_then_seals_it_to_exactly_this_request"

[[cell]]
subject = "cli_a"
object = "prompt"
right = "r"
control = "A writes it"
evidence = "bins/maknae/src/agent.rs:506"

[[cell]]
subject = "cli_a"
object = "meta"
right = "r"
control = "A chooses the providers.yaml entry; the CLI mints the conversation id"
evidence = "bins/maknae/src/agent.rs:524 · bins/maknae/src/agent.rs:553"
test = "bins/maknae/src/agent.rs::the_entry_is_the_default_or_the_named_label_and_no_entries_means_no_model_access"

# --- CLI as user B --------------------------------------------------------

[[cell]]
subject = "cli_b"
object = "key_a"
right = "none"
control = "Vault templated policy maknae-user scopes reads to maknae/users/{{identity.entity.aliases.<accessor>.name}}, so B's login cannot read A's subtree, wrapped or not"
evidence = "deploy/vault-pki/main.tf:207 · docs/verification-walkthrough.md (C2, measured 403)"

[[cell]]
subject = "cli_b"
object = "key_b"
right = "r"
control = "B's own userpass identity reads it, response-wrapped, and B can unwrap that token itself: the accepted residual #429, as for A"
evidence = "deploy/vault-pki/main.tf:207 · ADR-0028"

[[cell]]
subject = "cli_b"
object = "wrap"
right = "none"
control = "never exposed to B: it travels only sealed, and the Egress Daemon refuses a token whose creation_path is not the requesting user's path before it unwraps"
evidence = "bins/maknae-egress/src/opener.rs:83 · crates/maknae-vault/src/wrap.rs:299"
test = "crates/maknae-vault/src/wrap.rs::another_users_token_is_refused_before_it_is_unwrapped"

[[cell]]
subject = "cli_b"
object = "sealed"
right = "none"
control = "it crosses only A's plane connection; replayed in B's turn it does not open, because the AAD binds conversation and path and the kernel derives the username from B's uid"
evidence = "crates/maknae-kernel/src/run.rs:862 · crates/maknae-kernel/src/provider_choice.rs:62 · crates/maknae-seal/src/aad.rs:35"
test = "crates/maknae-kernel/src/provider_choice.rs::an_admitted_choice_carries_the_sets_entry_the_choices_model_and_field_and_the_peers_path · crates/maknae-seal/src/seal.rs::a_blob_retargeted_to_another_request_fails_to_open"

[[cell]]
subject = "cli_b"
object = "prompt"
right = "none"
control = "it lives only in A's process, A's plane connection and the trust-plane accounts; the audit trail keeps only its digest and length, in a 0700 _maknae directory"
evidence = "crates/maknae-audit-append/src/record.rs:130 · packaging/rpm/maknae.spec:176 · packaging/deb/postinst:48 · packaging/macos/scripts/preinstall:203"

[[cell]]
subject = "cli_b"
object = "meta"
right = "none"
control = "the audit trail that records it is written by maknaed in a 0700 _maknae directory; B's uid holds no other copy"
evidence = "crates/maknae-audit-append/src/sink.rs:48 · packaging/rpm/maknae.spec:176 · packaging/deb/postinst:48 · packaging/macos/scripts/preinstall:203"

