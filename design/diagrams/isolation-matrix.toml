# --- Egress Daemon --------------------------------------------------------

[[cell]]
subject = "egress"
object = "key_a"
right = "u"
control = "creation_path and TTL checked before the unwrap; the key is held in a zeroizing buffer for one call, with no key cache"
evidence = "crates/maknae-vault/src/wrap.rs:299 · crates/maknae-deputy/src/call.rs:226"
test = "crates/maknae-vault/src/wrap.rs::a_matching_token_is_looked_up_then_unwrapped_and_yields_only_the_field · crates/maknae-vault/src/wrap.rs::another_users_token_is_refused_before_it_is_unwrapped"

[[cell]]
subject = "egress"
object = "key_b"
right = "u"
control = "the same check on B's turns: the Egress Daemon sees each active user's key, one call at a time, so a compromised one harvests every key used while it is compromised"
evidence = "crates/maknae-vault/src/wrap.rs:299 · ADR-0028"
test = "crates/maknae-vault/src/wrap.rs::a_matching_token_is_looked_up_then_unwrapped_and_yields_only_the_field"

[[cell]]
subject = "egress"
object = "wrap"
right = "u"
control = "opened only under this request's AAD, looked up (creation_path, TTL at most 60 s), then presented once to unwrap; Vault makes it single-use"
evidence = "bins/maknae-egress/src/opener.rs:83 · crates/maknae-vault/src/wrap.rs:299"
test = "crates/maknae-vault/src/wrap.rs::another_users_token_is_refused_before_it_is_unwrapped · crates/maknae-vault/src/wrap.rs::a_token_outside_the_ttl_bound_is_refused_before_it_is_unwrapped"

[[cell]]
subject = "egress"
object = "sealed"
right = "r"
control = "it holds the seal private key and opens the blob only under this request's AAD"
evidence = "bins/maknae-egress/src/opener.rs:83 · crates/maknae-seal/src/seal.rs:84"
test = "bins/maknae-egress/src/opener.rs::a_blob_sealed_for_one_request_opens_only_under_that_request · crates/maknae-seal/src/seal.rs::a_blob_retargeted_to_another_request_fails_to_open"

[[cell]]
subject = "egress"
object = "prompt"
right = "r"
control = "it builds the provider request from the turns"
evidence = "crates/maknae-deputy/src/call.rs:243"
test = "crates/maknae-deputy/src/call.rs::an_admitted_frame_reaches_the_provider_and_returns_its_reply"

[[cell]]
subject = "egress"
object = "meta"
right = "r"
control = "the egress frame carries the destination, model, admitted key path (naming the user), key field and conversation"
evidence = "crates/maknae-proto/src/egress_frame.rs:25"
test = "crates/maknae-kernel/src/egress.rs::a_request_for_a_choice_carries_the_providers_record_the_choices_model_and_the_admitted_path"

