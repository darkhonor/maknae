# --- maknaed --------------------------------------------------------------

[[cell]]
subject = "kernel"
object = "key_a"
right = "none"
control = "maknaed's AppRole policy grants no KV path, and the wrapping token reaches it only sealed: the seal private key is held only by the Egress Daemon (Linux root:root 0400 credential loaded by LoadCredentialEncrypted; macOS keychain ACL), and maknaed does not link maknae-seal"
evidence = "deploy/vault-pki/main.tf:138 · packaging/common/maknae-egress.service · bins/maknae/src/enroll/artifact_table.rs:214 · bins/maknae/src/enroll/keychain_write.rs:44 · ci/gates/seal-confinement.sh"

[[cell]]
subject = "kernel"
object = "key_b"
right = "none"
control = "as for A's key: no KV grant in maknaed's AppRole policy, no seal private key, and maknae-seal is not linked"
evidence = "deploy/vault-pki/main.tf:138 · packaging/common/maknae-egress.service · ci/gates/seal-confinement.sh"

[[cell]]
subject = "kernel"
object = "wrap"
right = "s"
control = "carried only inside the sealed blob; maknaed does not link maknae-seal and holds no seal private key"
evidence = "crates/maknae-kernel/src/egress.rs:26 · ci/gates/seal-confinement.sh · ci/gates/lib.sh:13"

[[cell]]
subject = "kernel"
object = "sealed"
right = "s"
control = "forwarded as opaque bytes with the path it admitted; maknaed does not link maknae-seal and holds no seal private key"
evidence = "crates/maknae-kernel/src/egress.rs:26 · ci/gates/seal-confinement.sh · ci/gates/lib.sh:13"
test = "crates/maknae-kernel/src/egress.rs::a_request_for_a_choice_carries_the_providers_record_the_choices_model_and_the_admitted_path"

[[cell]]
