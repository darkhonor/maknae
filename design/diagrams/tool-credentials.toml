# A tool's credential, by custody: minted by Maknae, stored in the subject's own Vault tree, or brokered by the trust plane.

title = "A tool's credential: who mints it, who stores it, who ever holds it"
subtitle = [
  "One tool call's credential, from the model's invoke to the released output. The front end is maknae for a person or maknae-agentd for an agent; the launch helper is the only thing that talks to the container runtime.",
  "The effective credential is what the workspace needs ∩ what the subject holds, decided on every call. A subject only ever uses its own credentials (ADR-0037 decision 6). Each step shows its build state, or the issue that builds it.",
]
svg_title = "Maknae tool credential custody"
svg_desc = "UML sequence diagram of a tool credential by custody, each step marked live, unreachable or with the issue that builds it: the model's invoke, the kernel's decision before any credential with a deny exit, a token minted in the trust plane and carried in the Permit, a Vault child token or a stored credential fetched by the front end with its own login, the launch helper placing the credential in the container, the output filtered and the credential zeroized before the kernel releases it to the model, and brokered custody where the front end never holds the credential."
pitch = 160
wrap_cols = 32

[[boundary]]
before = "front"
left = "the model, at its provider"
right = "untrusted · the subject's uid"
shade = false

[[boundary]]
before = "helper"
left = ""
right = "TRUST BOUNDARY — trust plane"
shade = true

[[boundary]]
before = "vault"
left = ""
right = "external"
shade = false

[[participant]]
id = "model"
label = "model"
stereo = "«untrusted» never holds a credential"
kind = "untrusted"

[[participant]]
id = "front"
label = "front end"
stereo = "«untrusted» maknae · maknae-agentd"
kind = "untrusted"

[[participant]]
id = "tool"
label = "tool container"
stereo = "«untrusted» the subject's uid"
kind = "untrusted"

[[participant]]
id = "helper"
label = "launch helper"
stereo = "«trusted» launch PEP · SELinux · #481"
kind = "trusted"

[[participant]]
id = "kernel"
label = "maknaed"
stereo = "«trusted» sole PDP"
kind = "trusted"

[[participant]]
id = "egress"
label = "maknae-egress"
stereo = "«trusted» deputy · minter"
kind = "trusted"

[[participant]]
id = "ssh"
label = "maknae-ssh"
stereo = "«trusted» proposed · #456"
kind = "trusted"

[[participant]]
id = "vault"
label = "Vault"
stereo = "«external» KV · Transit · SSH"
kind = "external"

[[participant]]
id = "site"
label = "site"
stereo = "«external» forge · service · host"
kind = "external"

# --- the model asks for a tool; it never asks for a credential -----------

[[step]]
id = "menu"
from = "front"
to = "model"
kind = "call"
label = "the menu: each tool, its shapes, and that a credential is provided when it runs"
status = "#479"
evidence = "#479 · ADR-0037 decision 5"
sees = "tool names and shapes, never a credential"
note = "Every crossing to the model travels in a model turn through maknaed and egress (generated-credential-path.svg); it is drawn direct here."

[[step]]
id = "invoke"
from = "model"
to = "front"
kind = "call"
label = "invoke: entry, shape and slot values, never an option"
status = "#479"
evidence = "#479 · ADR-0036 decision 21"
note = "Slots, not options: the model cannot ask a tool to print its token (#674 PR 3a)."

# --- decide first: nothing is minted or read for a call that is not permitted

[[step]]
id = "request"
from = "front"
to = "kernel"
kind = "call"
label = "tool request: the call, the workspace, the cited task"
status = "#479"
evidence = "#479 · ADR-0036 decision 1 · crates/maknae-kernel/src/tool_call.rs"
sees = "the call, no credential"
note = "A person cites no task; an agent cites its task. The rest of the decision is generated-tool-invocation.svg."

[[step]]
id = "decide"
from = "kernel"
to = "kernel"
kind = "self"
label = "decide tool.invoke: containment, the ceiling, the role, Tool grants"
status = "unreachable"
evidence = "ADR-0036 decision 7 · crates/maknae-kernel/src/tool_call.rs · #479"
note = "Authorization before any credential: nothing is minted or read for a call that is not permitted."

[[step]]
id = "reach-check"
from = "kernel"
to = "kernel"
kind = "self"
label = "in a task: the shape's forge needs lie within the task's reach"
status = "#168"
evidence = "#168 · ADR-0037 decision 7"

[[step]]
id = "bundle-check"
from = "kernel"
to = "kernel"
kind = "self"
label = "the workspace's credential bundle ∩ what the subject holds"
status = "#479"
evidence = "#479 · ADR-0036 decision 13"
note = "A Basic site never writes this policy by hand: Maknae proposes the bundle from a run and grants an agent with one decision."

[[step]]
id = "deny"
from = "kernel"
to = "front"
kind = "reply"
label = "Deny: no credential is minted or read"
status = "unreachable"
evidence = "ADR-0036 decision 7 · crates/maknae-kernel/src/tool_call.rs · #479"

[[step]]
id = "not-available"
from = "front"
to = "model"
kind = "reply"
label = "not available"
status = "#479"
evidence = "#479 · ADR-0037 decision 5"
sees = "a refusal, never why"

# --- minted in the trust plane: an agent's task only ---------------------

[[step]]
id = "mint-frame"
from = "kernel"
to = "egress"
kind = "call"
label = "Mint frame, lazily: the task, the class, one permission set"
status = "#168"
evidence = "#168 · ADR-0038 decision 4"
sees = "the task's bindings and reach"
note = "Agents only: a person's session uses the person's own credential (ADR-0037 decision 6). Minted at the first launch that needs the set (ruled 2026-11-25)."

[[step]]
id = "transit-sign"
from = "egress"
to = "vault"
kind = "call"
label = "Transit signs the App's JWT"
status = "unreachable"
evidence = "ADR-0038 decision 3 · bins/maknae-egress/src/minting.rs · #168"
sees = "the JWT claims; the App key never leaves Transit"

[[step]]
id = "mint-token"
from = "egress"
to = "site"
kind = "call"
label = "one installation token for the set's repositories and permissions; the grant is verified"
status = "unreachable"
evidence = "ADR-0038 decision 3 · crates/maknae-deputy/src/mint/minter.rs · #168"
sees = "the token"
note = "One kind behind a closed interface (ADR-0038 decision 2): a GitLab project token or a Gitea token would be another kind."

[[step]]
id = "sealed"
from = "egress"
to = "kernel"
kind = "reply"
label = "the token sealed to the agent; for_revocation sealed to egress"
status = "unreachable"
evidence = "ADR-0038 decision 4 · crates/maknae-deputy/src/mint/minter.rs · #168"
sees = "sealed bytes only"

# --- the Permit: one reply --------------------------------------------------

[[step]]
id = "permit"
from = "kernel"
to = "front"
kind = "reply"
label = "Permit: the launch obligation names the bundle; a minted token rides in it, sealed to the agent"
status = "#479"
evidence = "#479 · #168 · ADR-0035 decision 3 · crates/maknae-kernel/src/tool_launch.rs"
sees = "class names and sealed bytes"
note = "A stored credential or a Vault child token is never in it: maknaed never holds a subject's own secrets (ADR-0028)."

[[step]]
id = "open"
from = "front"
to = "front"
kind = "self"
label = "open the minted token's seal with the agent's own key"
status = "#168"
evidence = "#168 · ADR-0038 decision 4"
sees = "the token"

[[step]]
id = "child-token"
from = "front"
to = "vault"
kind = "call"
label = "create a child token from the subject's own Vault token, with only the class's policies"
status = "#479"
evidence = "#479 · ADR-0036 decision 13"
sees = "the subject's token and the child"
note = "A person's own Vault login or the agent's own AppRole. Vault mints a child only within its parent's policies."

[[step]]
id = "stored-read"
from = "front"
to = "vault"
kind = "call"
label = "read the class's path in the subject's own tree"
status = "#479"
evidence = "#479 · ADR-0036 decision 13 · ADR-0028"
sees = "the credential"
note = "A person: <user_prefix>/<you>/... An agent: <agent_prefix>/<id>/... Never another subject's tree. Stored with maknae credential save (#732)."

[[step]]
id = "fetch-failed"
from = "front"
to = "front"
kind = "self"
label = "a class cannot be fetched: the call fails, naming it"
status = "#479"
evidence = "#479 · ADR-0036 decision 13"
note = "A child token minted for this call is revoked; a task's minted sets keep their task lifetime."

# --- the launch helper places the credential --------------------------------

[[step]]
id = "launch"
from = "front"
to = "helper"
kind = "call"
label = "launch: the kernel-signed obligation, and beside it the credentials to place"
status = "#481"
evidence = "#481 · #751 · ADR-0036 decision 6"
sees = "the credential"
note = "The helper's separation from the agent is its SELinux domain; on AppArmor same-uid ptrace is restricted by the host only, and macOS is not built (ADR-0035 decision 4)."

[[step]]
id = "verify"
from = "helper"
to = "helper"
kind = "self"
label = "verify the obligation: kernel-signed, this invocation, used once"
status = "#481"
evidence = "#481 · ADR-0036 decision 6"

[[step]]
id = "start"
from = "helper"
to = "tool"
kind = "call"
label = "start the container; place each credential through its class's plug-in point"
status = "#481"
evidence = "#481 · ADR-0036 decision 13"
sees = "the credential"
note = "Read-only root, non-root, no capabilities, no-new-privileges, the runtime's default seccomp. Credential files under /run/maknae-launch/<uid>/, which sensitive.yaml covers."

[[step]]
id = "use"
from = "tool"
to = "site"
kind = "ref"
label = "the tool's network calls: the connection loop"
target = "generated-tool-invocation.svg"
status = "#566"
evidence = "#566 · ADR-0036 decision 9"

[[step]]
id = "output"
from = "tool"
to = "front"
kind = "reply"
label = "exit status and output, through the helper"
status = "#479"
evidence = "#479 · ADR-0036 decision 1"

[[step]]
id = "helper-clean"
from = "helper"
to = "helper"
kind = "self"
label = "remove the credential files; zeroize what it placed"
status = "#481"
evidence = "#481 · #751"

[[step]]
id = "filter"
from = "front"
to = "front"
kind = "self"
label = "filter the output for every delivered value, in every encoding; on a match, withhold it and revoke"
status = "#752"
evidence = "#752 · ADR-0036 decision 14"
note = "Raw, base64, hex, URL, HTTP Basic and long fragments. A minted or child token is revoked; a stored one is flagged to rotate, with a plain warning."

[[step]]
id = "zeroize"
from = "front"
to = "front"
kind = "self"
label = "zeroize every delivered value"
status = "#751"
evidence = "#751 · ADR-0036 decision 13"
note = "DeliveredCredential has no Display or Serialize, so a log line or an error cannot print it; the process writes no core file."

[[step]]
id = "record"
from = "front"
to = "kernel"
kind = "call"
label = "record the outcome, with the filtered output"
status = "#479"
evidence = "#479 · ADR-0036 decision 1"
sees = "output, never a credential"

[[step]]
id = "release"
from = "kernel"
to = "model"
kind = "reply"
label = "the output, released in the next model turn"
status = "#479"
evidence = "#479 · ADR-0036 decision 14"
sees = "output, never a credential"

[[step]]
id = "revoke-child"
from = "front"
to = "vault"
kind = "call"
label = "revoke the child token when the outcome is recorded"
status = "#479"
evidence = "#479 · ADR-0036 decision 13"

[[step]]
id = "revoke-task"
from = "kernel"
to = "egress"
kind = "ref"
label = "revoke each minted set when the task closes or is held"
target = "generated-task-tool-lifecycle.svg"
status = "#168"
evidence = "#168 · ADR-0038 decision 4"

# --- brokered: the trust plane holds it, the front end never does ----------

[[step]]
id = "model-key"
from = "front"
to = "egress"
kind = "ref"
label = "a model key: sealed for egress, which alone opens and spends it"
target = "generated-credential-path.svg"
status = "live"
evidence = "ADR-0028 decision 5 · bins/maknae-egress/src/opener.rs"

[[step]]
id = "ssh-request"
from = "front"
to = "kernel"
kind = "call"
label = "an ssh request: a registered destination and the command"
status = "#456"
evidence = "#456 · #457"

[[step]]
id = "ssh-decide"
from = "kernel"
to = "ssh"
kind = "call"
label = "the decided operation"
status = "#456"
evidence = "#456 · #457"

[[step]]
id = "ssh-cert"
from = "ssh"
to = "vault"
kind = "call"
label = "a short-lived SSH certificate signed by Vault, or the sealed key opened"
status = "#456"
evidence = "#456 · #457"
sees = "the certificate or key"

[[step]]
id = "ssh-run"
from = "ssh"
to = "site"
kind = "call"
label = "connect to the pinned host and run"
status = "#456"
evidence = "#456 · #459"

[[step]]
id = "ssh-output"
from = "ssh"
to = "front"
kind = "reply"
label = "output only"
status = "#456"
evidence = "#456 · #457"
sees = "output, never the credential"
note = "Brokering needs the trust plane to end the protocol: SSH here, the model API in egress. A tool's HTTPS through maknae-proxy is TLS end to end, so it cannot be brokered."

[[step]]
id = "ssh-release"
from = "front"
to = "model"
kind = "reply"
label = "the output, through the same filter"
status = "#752"
evidence = "#752 · #456"
sees = "output, never a credential"

