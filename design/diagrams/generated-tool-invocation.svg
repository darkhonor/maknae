<path d="M 262 726 h 30 v 20 h -30" fill="none" stroke="#2C2C2A" stroke-width="1" marker-end="url(#call)"/>
<text x="302" y="730" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#2C2C2A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">11. redact every credential value it delivered</text>
<text x="302" y="747" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="400" fill="#5F5E5A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">ADR-0036 decision 14</text>
<line x1="262" y1="804" x2="602" y2="804" stroke="#2C2C2A" stroke-width="1" marker-end="url(#call)"/>
<text x="432.0" y="774" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#2C2C2A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">12. outcome + redacted output;</text>
<text x="432.0" y="786" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#2C2C2A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">per-invocation credential</text>
<text x="432.0" y="798" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#2C2C2A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">revoked</text>
<text x="432.0" y="815" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="400" fill="#5F5E5A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">ADR-0036 decision 1 · ADR-0036 decision 13</text>
<line x1="602" y1="860" x2="92" y2="860" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#rep)"/>
<text x="347.0" y="842" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F5E5A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">13. released in the next model</text>
<text x="347.0" y="854" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F5E5A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">turn: redacted, or status only</text>
<text x="347.0" y="871" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="400" fill="#5F5E5A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">ADR-0023 decision 3 · ADR-0036 decision 14</text>
<text x="40" y="936" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A">Notes</text>
<text x="40" y="963" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#B3452F">1.</text>
<text x="60" y="963" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">The model only asks. It runs nothing, and a front end is the PEP that stands between it and the host (ADR-0035 decision 1).</text>
<text x="40" y="990" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#B3452F">3.</text>
<text x="60" y="990" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">tools.yaml is the ceiling; policy grants within it (Tool(rust-fetch gh pr view *)); deny-overrides with the mandatory operands.</text>
<text x="40" y="1017" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#B3452F">4.</text>
<text x="60" y="1017" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">A PEP that cannot carry out an obligation must deny.</text>
<text x="40" y="1044" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#B3452F">5.</text>
<text x="60" y="1044" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">Agent: the agent's own uid, only the task's own directory mounted. Operator: current or path; never home; protected folders masked.</text>
<text x="40" y="1071" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#B3452F">6.</text>
<text x="60" y="1071" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">The container has no other route: no DNS, no direct TCP (measured 2026-11-18).</text>
<text x="40" y="1098" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#B3452F">9.</text>
<text x="60" y="1098" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">The proxy sees the host and port only, never content.</text>
<text x="40" y="1125" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#B3452F">11.</text>
<text x="60" y="1125" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">Default redacted, with a marker saying a Maknae-managed credential was used; status only for secret-reading entries.</text>
<text x="40" y="1152" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#B3452F">13.</text>
<text x="60" y="1152" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">The release is a kernel decision. Today only the front end's redaction screens tool output: category detection is not built, and the ceiling treats it as unmarked. In full it travels maknaed → maknae-egress → the provider, with the next session.prompt.</text>
<text x="24" y="1184" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F5E5A">source: design/diagrams/tool-invocation.toml@3424e8fa78 · maknae 00a7312a · 2026-11-18</text><text x="1018" y="1184" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F5E5A">UML 2.5.1 (OMG formal/2017-12-05)</text>
</svg>
