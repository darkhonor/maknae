<line x1="772" y1="648" x2="942" y2="648" stroke="#2C2C2A" stroke-width="1" marker-end="url(#call)"/>
<text x="857.0" y="642" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#2C2C2A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">9. tunnel; TLS end to end</text>
