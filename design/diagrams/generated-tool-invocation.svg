<line x1="772" y1="548" x2="602" y2="548" stroke="#2C2C2A" stroke-width="1" marker-end="url(#call)"/>
<text x="687.0" y="530" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#2C2C2A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">7. decide this CONNECT: identity,</text>
<text x="687.0" y="542" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#2C2C2A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">host, port</text>
<text x="687.0" y="559" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="400" fill="#5F5E5A" stroke="#FFFFFF" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">ADR-0035 decision 5</text>
<line x1="602" y1="604" x2="772" y2="604" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#rep)"/>
