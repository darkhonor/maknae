<svg width="1042" height="1200" viewBox="0 0 1042 1200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Maknae tool invocation</title>
  <desc>UML sequence diagram of one tool invocation by either front end: the kernel's decision, the container launch, the per-connection proxy decision, and redacted output to the model.</desc>
  <rect x="0" y="0" width="1042" height="1200" fill="#FFFFFF"/>
<text x="40" y="44" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">One tool invocation — who decides, who runs it, what the model sees</text>
<text x="40" y="64" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">The model asks; the front end (maknae, or maknae-agentd) asks maknaed, then starts the tool in a container as the subject and carries out the decision.</text>
<text x="40" y="79" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">The container's only route is the relay to maknae-proxy, which asks maknaed about every CONNECT. Decided by ADR-0035 and ADR-0036; not built.</text>
