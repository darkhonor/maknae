# --- interfaces ------------------------------------------------------------

[[iface]]
n = "I1"
from = "subject"
to = "cli"
status = "built"
mechanism = "local process invocation"
identity = "the invoking uid; the OS is the authority"
evidence = "bins/maknae/src/cli.rs"

[[iface]]
n = "I2"
from = "cli"
to = "daemon"
status = "built"
mechanism = "AF_UNIX stream at /run/maknae/maknaed.sock, group-gated on bind; mutual mTLS, TLS 1.3 pinned; SCM_RIGHTS carries the subject's descriptor"
identity = "plane leaf certificate, URI-SAN — MACHINE identity only"
evidence = "crates/maknae-config/src/transport.rs:15 · crates/maknae-vault/src/tls.rs:51 · crates/maknae-io/src/delegated.rs:182"

[[iface]]
n = "I3"
from = "daemon"
to = "vault"
status = "built"
mechanism = "HTTPS via vaultrs/reqwest; AppRole login, then pki sign; TLS negotiated (1.2 floor), FIPS suite set asserted"
identity = "AppRole role `maknaed` + per-plane SecretID"
evidence = "crates/maknae-vault/src/client.rs:344 · crates/maknae-vault/src/plane.rs:17"

[[iface]]
n = "I4"
from = "cli"
to = "vault"
status = "built"
mechanism = "HTTPS; the user's own userpass token (`maknae login`) mints the cli-plane leaf and reads the user's key only response-wrapped"
identity = "userpass user, entity `maknae-<user>`, group `maknae-users`"
evidence = "bins/maknae/src/cli.rs:336 · bins/maknae/src/login.rs:90 · deploy/vault-pki/main.tf:237"

[[iface]]
n = "I10"
from = "egress"
to = "vault"
status = "built"
mechanism = "HTTPS; wrapping lookup + unwrap of the user's wrapping token, after the seal is opened; no Vault identity"
identity = "none — the wrapping token is the only credential presented"
evidence = "bins/maknae-egress/src/opener.rs · crates/maknae-vault/src/wrap.rs:378"

[[iface]]
n = "I5"
from = "daemon"
to = "audit"
status = "built"
mechanism = "append-only write + fsync on a blocking worker; the reply is gated on the append"
identity = "n/a — daemon-owned artifact"
evidence = "crates/maknae-audit-append/src/sink.rs"

[[iface]]
n = "I6"
from = "remote"
to = "gateway"
status = "ratified-unbuilt"
mechanism = "OIDC federation; AAL2/FAL2 (NIST SP 800-63B/63C)"
identity = "enrolled remote subject, asserted by the gateway"
evidence = "design/adr/ADR-0006-client-authentication-model.md"

[[iface]]
n = "I7"
from = "gateway"
to = "daemon"
status = "ratified-unbuilt"
mechanism = "machine channel; the gateway ASSERTS the principal to the PDP"
identity = "gateway's own scoped machine credential — never the daemon's plane/kernel identity"
evidence = "design/adr/ADR-0006-client-authentication-model.md"

[[iface]]
n = "I8"
from = "egress"
to = "llm"
status = "built"
mechanism = "HTTPS, the user's key as bearer"
identity = "the user's own provider API key, unwrapped for this one call"
evidence = "crates/maknae-deputy/src/call.rs:258"

[[iface]]
n = "I11"
from = "daemon"
to = "egress"
status = "built"
mechanism = "AF_UNIX stream at egress.socket_path (default /run/maknae-egress/egress.sock); one connection per decided request; the peer's uid is checked before the first write"
identity = "the Egress Daemon's uid, from the socket's peer credentials"
evidence = "crates/maknae-kernel/src/egress_socket.rs · crates/maknae-config/src/egress_cfg.rs:27"

[[iface]]
n = "I9"
from = "daemon"
to = "mcp"
status = "stub"
mechanism = "none — maknae-mcp is a one-line CRATE_MARKER"
identity = "undecided"
evidence = "crates/maknae-mcp/src/lib.rs"

# --- host platform controls -----------------------------------------------
# Not peer systems. These act ON the daemon rather than exchanging data with
# it, which is why they are drawn as a separate band: they are MANDATORY
# controls, and per ADR-0020 a mandatory Deny is not waivable by any
# discretionary grant the PDP could issue.

[[iface]]
n = "P1"
from = "mac"
to = "daemon"
status = "built"
class = "platform"
mechanism = "SELinux policy_module(maknae, 1.0.0) confines maknaed_t, with separate types for etc, private, secret, audit and runtime, plus maknae_vault_port_t on the outbound leg. Debian and Ubuntu get an equivalent AppArmor 3.x profile."
identity = "the daemon's own domain — maknaed_t, entered via maknaed_exec_t"
evidence = "packaging/common/maknae.te · packaging/common/maknae.fc · packaging/deb/apparmor/usr.bin.maknaed"

[[iface]]
n = "P2"
from = "fapolicyd"
to = "daemon"
status = "built"
class = "platform"
mechanism = "Execution is gated by fapolicyd's rpmdb trust backend; the rpm-installed binary is trusted automatically. NO per-file trust record is shipped, deliberately — a static path/size/sha256 record goes stale on every rebuild, and a bare path is silently ignored."
identity = "package provenance, not a credential"
evidence = "packaging/common/maknae.fapolicyd.trust — verified on a STIG-hardened enforcing Rocky 10 host"

[[iface]]
n = "P3"
from = "daemon"
to = "journald"
status = "built"
class = "platform"
mechanism = "StandardOutput=journal, StandardError=journal, SyslogIdentifier=maknaed. This is the DIAGNOSTIC channel and is not the audit trail — AU-3 records go to the append-only sink at I5, on a path whose write gates the reply."
identity = "systemd unit identity"
evidence = "packaging/common/maknaed.service:59"

# --- stated negatives ------------------------------------------------------
# An SV-1 is read to find attack surface. A surface that does not exist has to
# be SAID, or the reader assumes it was overlooked.

[[negative]]
claim = "No inbound network interface exists. Nothing in the tree binds a TCP or UDP port; the only bind is UnixListener::bind on the client plane. Every occurrence of :8200 is a Vault address to DIAL."
consequence = "There is nothing to ingress-filter, which is why no firewalld, nftables or ufw profile ships. #117's gateway is the first inbound listener, and the first thing that will need one."
evidence = "crates/maknae-kernel/src/run.rs:1879 — PlaneListener::bind on an AF_UNIX path"

[[negative]]
claim = "Every network flow is EGRESS. The daemons' flows — I3 and I10 to Vault, and I8 from the Egress Daemon to the provider — are each constrained by something narrower than a firewall rule. I4, the CLI to Vault, is not: it is the user's own process."
consequence = "SELinux authorizes each daemon connect per DOMAIN, where a host firewall rule would authorize it per HOST: name_connect on maknae_vault_port_t for maknaed_t and maknae_egress_t, and the provider leg (http_port_t) for maknae_egress_t alone. A packet filter cannot express 'this process and no other'. The policy's domains are maknaed_t, maknae_egress_t and maknae_tool_t (declared for tools, unused); none is the CLI's, and its executable is not labelled, so I4 runs in the user's own domain, usually unconfined, and SELinux does not confine it."
evidence = "packaging/common/maknae-selinux-ports.sh · packaging/common/maknae.te:8 · packaging/common/maknae.te:26 · packaging/common/maknae.fc"

[[negative]]
claim = "Reaching the client plane requires a local account in the gated group, not a route."
consequence = "The socket is filesystem-mediated: group-gated at bind, then mutual mTLS over it. A network position buys nothing, so perimeter controls are not the boundary that matters here."
evidence = "crates/maknae-kernel/src/run.rs:1879 · crates/maknae-config/src/transport.rs:15"
