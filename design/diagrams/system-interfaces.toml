# DoDAF SV-1 — Systems Interface Description.
#
# Curated. The point of an SV-1 is the INVENTORY, and an inventory that mixes
# what exists with what is designed is worse than none: an assessor reading it
# would test interfaces that are not there and miss that the ones that are have
# no gateway in front of them.
#
# So every interface carries a status, on the same rule the StdV-1 uses:
#   built            the code does this today; evidence names it
#   ratified-unbuilt an ADR fixes it, the code does not implement it yet
#   stub             the crate exists as a marker; there is no interface
#
# ADR-0006 carries its own banner to this effect ("the code does NOT yet
# implement this ADR"), and the authority order is code -> KLC -> ADRs.

[[node]]
id = "subject"
label = "subject"
sub = "local uid"
col = 0
row = 1
kind = "actor"

