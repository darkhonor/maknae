# The three data models Maknae records and enforces, in IDEF1X.
#
# Curated, like read-path.toml. IDEF1X models a SHAPE, and the shape here is a
# normalization of Rust structs that are serialized as nested JSON — a judgement
# about identity and dependence that no manifest holds. Every entity cites the
# type it is drawn from so a reader can check the normalization rather than
# take it.
#
# IDEF1X notation (ISO/IEC/IEEE 31320-2:2012):
#   square corners  = independent entity (identity does not depend on another)
#   rounded corners = dependent entity   (identity inherits from its parent)
#   solid line      = identifying relationship
#   filled circle   = the child end
#   attributes above the rule are the primary key

[[section]]
id = "audit"
title = "Audit trail — AU-3"
note = "One record per request outcome. The key is (session-id, seq), not the timestamp: two records can share a clock tick, and seq is per-session monotonic, so the pair is what orders and identifies the trail."

[[section]]
id = "authz"
title = "Authorization request — the PDP's input"
note = "The ABAC four-tuple. Subject, Resource and Context are attribute BAGS, not fixed columns — which is what lets an extension key on attributes the core never declared (ADR-0004)."

[[section]]
id = "policy"
title = "Authorization policy — the shipped baseline"
note = "Read per request from disk. `allow` and `deny` are the same shape distinguished by rule-kind; deny-overrides is applied at composition, not encoded in the data."

# --- audit -----------------------------------------------------------------

[[entity]]
id = "record"
section = "audit"
name = "AUDIT-RECORD"
kind = "independent"
pk = ["session-id", "seq"]
attrs = ["ts", "event", "action", "object", "object-requested", "au3-1"]
evidence = "crates/maknae-audit-append/src/record.rs:61"

