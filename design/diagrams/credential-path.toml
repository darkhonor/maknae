# One model turn's credential path, end to end (ADR-0028 decision 5). Curated,
# like read-path.toml: a call sequence is not derivable from a manifest, so each
# step names the code that implements it and the test that proves its claim.
#
# `sees` is what that hop can read of the user's key. Vault appears TWICE on
# purpose: the client reads with the user's own token and gets back only a
# single-use wrapping token; the Egress Daemon, which holds no Vault identity,
# exchanges it. maknaed carries the token sealed and never links the opener.

title = "The per-turn credential path — who can see a user's model key"
subtitle = [
  "One session.prompt turn, end to end (ADR-0028 decision 5). The client makes a wrapped read with the user's own Vault token and seals the",
  "wrapping token to the Egress Daemon; maknaed decides on metadata and forwards the sealed bytes it cannot open. Each step names its code and its test.",
]
svg_title = "Maknae per-turn credential path"
svg_desc = "UML sequence diagram of one model turn's credential path across the user, the trust plane, the Egress Daemon and Vault."
pitch = 210
wrap_cols = 34

[[boundary]]
before = "vault_r"
left = "untrusted · user uid"
right = "external"
shade = false

[[boundary]]
before = "kernel"
left = ""
right = "TRUST BOUNDARY — trust plane"
shade = true

[[boundary]]
before = "vault_u"
left = ""
right = "external"
shade = false

[[participant]]
id = "user"
label = "User"
stereo = "«person»"
kind = "actor"

[[participant]]
id = "cli"
label = "maknae CLI · as user uid"
stereo = "«untrusted»"
kind = "untrusted"

[[participant]]
id = "vault_r"
label = "Vault · user token"
stereo = "«external»"
kind = "external"

[[participant]]
id = "kernel"
label = "maknaed"
stereo = "«PDP»"
kind = "trusted"

[[participant]]
id = "egress"
label = "Egress Daemon · _maknae-egress"
stereo = "«egress»"
kind = "trusted"

[[participant]]
id = "vault_u"
label = "Vault · unwrap"
stereo = "«external»"
kind = "external"

[[participant]]
id = "model"
label = "Model provider"
stereo = "«external»"
kind = "external"

# --- the sequence ---------------------------------------------------------

[[step]]
from = "user"
to = "cli"
kind = "call"
label = "maknae agent <prompt>"
evidence = "bins/maknae/src/agent.rs:506"
sees = "prompt"

[[step]]
from = "cli"
to = "cli"
kind = "self"
label = "load the user token; choose the providers.yaml entry"
evidence = "bins/maknae/src/agent.rs:518 · bins/maknae/src/agent.rs:524"
test = "bins/maknae/src/agent.rs::the_entry_is_the_default_or_the_named_label_and_no_entries_means_no_model_access"

[[step]]
from = "cli"
to = "vault_r"
kind = "call"
label = "wrapped read of <kv>/data/<prefix>/<user>/<subpath>, X-Vault-Wrap-TTL: 60s"
evidence = "bins/maknae/src/agent.rs:373 · crates/maknae-vault/src/api_request.rs:123"
test = "crates/maknae-vault/src/api_request.rs::the_wrapped_read_carries_the_user_token_and_the_wrap_ttl"
sees = "user token, key path"
note = "Residual, accepted (#429): any process running as the user can make this read itself and call the provider without maknaed; nothing correlates such reads with turns yet."

[[step]]
from = "vault_r"
to = "cli"
kind = "reply"
label = "wrapping token (a reply carrying the key is refused)"
evidence = "crates/maknae-vault/src/wrap.rs:243"
test = "crates/maknae-vault/src/wrap.rs::an_unwrapped_response_is_refused"
sees = "wrapping token (exchangeable once for the key)"

[[step]]
from = "cli"
to = "cli"
kind = "self"
label = "seal the wrapping token to seal.pub; AAD = conversation, provider, model, path, field"
evidence = "bins/maknae/src/agent.rs:176 · crates/maknae-vault/src/wrap.rs:188 · crates/maknae-seal/src/aad.rs:35 · crates/maknae-seal/src/seal.rs:54"
test = "bins/maknae/src/agent.rs::a_turn_reads_the_wrapped_key_then_seals_it_to_exactly_this_request"

[[step]]
from = "cli"
to = "kernel"
kind = "call"
label = "session.prompt + choice + SealedKey"
evidence = "bins/maknae/src/agent.rs:378 · crates/maknae-proto/src/sealed.rs:9"
test = "crates/maknae-proto/src/sealed.rs::a_sealed_key_encodes_as_a_cbor_byte_string_and_round_trips"
sees = "metadata, prompt, sealed blob (opaque)"

[[step]]
from = "kernel"
to = "kernel"
kind = "self"
label = "admit (peer-uid username, set, model, subpath, field), PDP, destination stamp: metadata only"
evidence = "crates/maknae-kernel/src/run.rs:862,1425 · crates/maknae-kernel/src/provider_choice.rs:62 · ci/gates/seal-confinement.sh"
test = "crates/maknae-kernel/src/provider_choice.rs::the_refusals_come_in_the_ruled_order"
sees = "metadata, prompt content (#417), sealed blob (opaque)"
note = "Residual (#417): prompt content still transits maknaed, and the AAD does not bind it, so maknaed could pair a sealed token with content of its choosing."

[[step]]
from = "kernel"
to = "egress"
kind = "call"
label = "egress frame (admitted path) + sealed_key"
evidence = "crates/maknae-kernel/src/run.rs:1561 · crates/maknae-kernel/src/egress.rs:36"
test = "crates/maknae-kernel/src/egress.rs::a_request_for_a_choice_carries_the_providers_record_the_choices_model_and_the_admitted_path"

[[step]]
from = "egress"
to = "egress"
kind = "self"
label = "open the seal under this request's AAD"
evidence = "bins/maknae-egress/src/opener.rs:57 · crates/maknae-deputy/src/unseal.rs:73 · crates/maknae-seal/src/seal.rs:84"
test = "crates/maknae-seal/src/seal.rs::a_blob_retargeted_to_another_request_fails_to_open"
sees = "wrapping token"

[[step]]
from = "egress"
to = "vault_u"
kind = "call"
label = "lookup (creation_path, TTL), then unwrap"
evidence = "crates/maknae-vault/src/wrap.rs:378 · crates/maknae-vault/src/wrap.rs:295"
test = "crates/maknae-vault/src/wrap.rs::another_users_token_is_refused_before_it_is_unwrapped"
sees = "wrapping token"

[[step]]
from = "vault_u"
to = "egress"
kind = "reply"
label = "the API key field"
evidence = "crates/maknae-vault/src/wrap.rs:354"
test = "crates/maknae-vault/src/wrap.rs::a_matching_token_is_looked_up_then_unwrapped_and_yields_only_the_field"
sees = "plaintext key — only here"
note = "On this path the plaintext key exists only inside the Egress Daemon, for one call: a zeroizing buffer, dropped after the call, with no key cache."

[[step]]
from = "egress"
to = "model"
kind = "call"
label = "provider call, key as bearer"
evidence = "crates/maknae-deputy/src/call.rs:226 · crates/maknae-deputy/src/call.rs:258"
test = "crates/maknae-deputy/src/call.rs::an_admitted_frame_reaches_the_provider_and_returns_its_reply"
sees = "key, prompt"

[[step]]
from = "model"
to = "egress"
kind = "reply"
label = "reply, or an error (key redacted)"
evidence = "crates/maknae-deputy/src/call.rs:273"
test = "crates/maknae-deputy/src/call.rs::a_provider_error_is_journaled_with_the_key_redacted_and_never_returned"

[[step]]
from = "egress"
to = "kernel"
kind = "reply"
label = "content, or RefusedBeforeSend → Failed"
evidence = "bins/maknae-egress/src/serve.rs:122 · crates/maknae-kernel/src/egress_socket.rs:349"
test = "crates/maknae-kernel/src/egress_socket.rs::a_deputy_that_refuses_before_any_provider_io_is_refused_before_send"

[[step]]
from = "kernel"
to = "cli"
kind = "reply"
label = "PromptReply, or \"not authorized\""
evidence = "crates/maknae-kernel/src/run.rs:1684 · crates/maknae-kernel/src/run.rs:1753"
test = "crates/maknae-kernel/tests/prompt_loop.rs::a_deputy_refusal_before_any_provider_io_is_recorded_failed_never_outcome_unknown"
note = "A refusal reaches the user only as \"not authorized\" (the CLI prints PROMPT_REFUSED); the reason is in the audit trail, for the administrator."
