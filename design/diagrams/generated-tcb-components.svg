<svg width="900" height="602" viewBox="0 0 900 602" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Maknae trusted computing base</title>
  <desc>UML component view of Maknae's TCB: privileged crates inside the trust plane, the untrusted client binary, and the non-privileged crates both link.</desc>
  <rect x="0" y="0" width="900" height="602" fill="#FFFFFF"/>
<text x="40" y="44" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">Trusted computing base — component view</text>
  <text x="40" y="64" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">Membership derived from ci/gates/lib.sh, the list the P1 gate polices. Linkage from the built artifacts.</text>
  <rect x="40" y="86" width="552" height="112" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="56" y="110" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">Trust plane · maknaed</text>
  <text x="225.6" y="110" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#534AB7">«trusted»</text>
  <rect x="54" y="122" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.75"/>
  <text x="63" y="135" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#26215C">maknae-audit-append</text>
  <rect x="230" y="122" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.75"/>
  <text x="239" y="135" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#26215C">maknae-authz-basic</text>
  <rect x="406" y="122" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.75"/>
  <text x="415" y="135" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#26215C">maknae-kernel</text>
  <rect x="54" y="148" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.75"/>
  <text x="63" y="161" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#26215C">maknae-subject-ctx-mint</text>
  <text x="56" y="187" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#534AB7">the TCB — privileged crates, forbidden to the client binary</text>
  <rect x="40" y="218" width="552" height="112" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="56" y="242" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#04342C">Trust plane · supporting</text>
  <text x="248.39999999999998" y="242" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#0F6E56">«component»</text>
  <rect x="54" y="254" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="63" y="267" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#04342C">maknae-audit</text>
  <rect x="230" y="254" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="239" y="267" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#04342C">maknae-llm</text>
  <rect x="406" y="254" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="415" y="267" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#04342C">maknae-mcp</text>
  <rect x="54" y="280" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="63" y="293" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#04342C">maknae-security</text>
  <rect x="230" y="280" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="239" y="293" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#04342C">maknae-spif</text>
  <rect x="406" y="280" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="415" y="293" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#04342C">maknae-subject-ctx</text>
  <text x="56" y="319" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#0F6E56">linked by the daemon only — not privileged, so not in the TCB</text>
  <rect x="40" y="350" width="552" height="112" rx="16" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="56" y="374" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Shared, non-privileged</text>
  <text x="233.2" y="374" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F5E5A">«component»</text>
  <rect x="54" y="386" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="63" y="399" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#2C2C2A">maknae-config</text>
  <rect x="230" y="386" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="239" y="399" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#2C2C2A">maknae-io</text>
  <rect x="406" y="386" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="415" y="399" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#2C2C2A">maknae-msgs</text>
  <rect x="54" y="412" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="63" y="425" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#2C2C2A">maknae-plane</text>
  <rect x="230" y="412" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="239" y="425" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#2C2C2A">maknae-proto</text>
  <rect x="406" y="412" width="164" height="19" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="415" y="425" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#2C2C2A">maknae-vault</text>
  <text x="56" y="451" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F5E5A">linked by BOTH planes — in the TCB of neither; the client needs these to connect and to delegate descriptors</text>
  <rect x="40" y="482" width="552" height="60" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="5 4"/>
  <text x="56" y="506" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Untrusted plane · maknae</text>
  <text x="248.39999999999998" y="506" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F5E5A">«untrusted»</text>
  <text x="56" y="531" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#B3452F">links NO privileged crate — refused by «gate:P1» in the manifests, witnessed in the built artifact by «gate:P2»</text>
  <text x="24" y="586" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F5E5A">generated from ci/gates/lib.sh + rust-audit-info · 855de07 +local-changes · 2026-08-30</text><text x="876" y="586" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F5E5A">UML 2.5.1 (OMG formal/2017-12-05)</text>
</svg>
