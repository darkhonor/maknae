<svg width="1212" height="1215" viewBox="0 0 1212 1215" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Maknae fs.read boundary crossings</title>
  <desc>UML sequence diagram of the Maknae fs.read path across the trust boundary.</desc>
  <rect x="0" y="0" width="1212" height="1215" fill="#FFFFFF"/>
<text x="40" y="44" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">The fs.read path — boundary crossings</text>
<text x="40" y="64" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">One request, end to end. The OS appears TWICE because that is the whole of ADR-0009: the same kernel, asked by two different</text>
<text x="40" y="79" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">principals, answers differently — and only the subject's answer may authorize a read. Each step names the code that implements it.</text>
